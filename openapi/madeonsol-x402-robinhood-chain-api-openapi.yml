  /api/x402/rhc/deployer-hunter/alerts:
    get:
      operationId: rhc_deployer-hunter_alerts
      summary: Robinhood Chain tracked-deployer launch alerts — new tokens from graded…
      tags:
      - x402 Robinhood Chain
      parameters:
      - name: limit
        in: query
        required: false
        description: Max alerts
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: deployer_tier
        in: query
        required: false
        description: Filter by deployer tier
        schema:
          type: string
          enum:
          - elite
          - good
          - neutral
          - spammer
      - name: priority
        in: query
        required: false
        description: Filter by alert priority
        schema:
          type: string
          enum:
          - high
          - medium
      - name: alert_type
        in: query
        required: false
        description: Filter by alert type
        schema:
          type: string
          enum:
          - new_deploy
          - graduated
      - name: launchpad
        in: query
        required: false
        description: Filter by launchpad name (1-32 chars)
        schema:
          type: string
      - name: min_mc
        in: query
        required: false
        description: Minimum market cap in USD at alert
        schema:
          type: number
          minimum: 0
      - name: include_untradeable
        in: query
        required: false
        description: Include alerts whose pool liquidity is under the $100 tradability floor
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
      - name: since
        in: query
        required: false
        description: ISO8601 timestamp with offset — only alerts after this time (incremental polling)
        schema:
          type: string
      - name: before
        in: query
        required: false
        description: ISO8601 timestamp with offset — only alerts before this time (pagination)
        schema:
          type: string
      - name: offset
        in: query
        required: false
        description: Pagination offset (not with cursor)
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - name: cursor
        in: query
        required: false
        description: 'Opaque keyset cursor: pass next_cursor from the previous page alone (not with before/offset)'
        schema:
          type: string
      x-payment-info:
