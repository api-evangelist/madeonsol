openapi: 3.2.0
info:
  title: MadeOnSol x402 Robinhood Chain API
  version: 1.0.0
  description: 'Pay-per-call Solana and Robinhood Chain memecoin intelligence — KOL trades, deployer reputation, token risk, wallet PnL. No signup, no API key: every endpoint is x402-paywalled per request.'
  x-guidance: 'All endpoints are GET. Call an endpoint, receive an x402 v2 402 challenge (accepts[].amount is in token ATOMIC units), pay from your wallet, retry with the payment header. Solana endpoints (/api/x402/*) settle in USDC on Solana mainnet; Robinhood Chain endpoints (/api/x402/rhc/*) dual-accept USDG on Robinhood Chain (eip155:4663) or USDC on Solana. Path parameters are in curly braces; query parameters are optional unless marked required. Human-readable index: https://madeonsol.com/x402. The madeonsol-x402 SDKs (npm and PyPI) handle the 402 → sign → retry loop automatically, including LangChain and CrewAI toolkits.'
  contact:
    email: info@madeonsol.com
servers:
- url: https://madeonsol.com
tags:
- name: x402 Robinhood Chain
paths:
  /api/x402/rhc/kol/feed:
    get:
      operationId: rhc_kol_feed
      summary: Robinhood Chain KOL trade feed — EVM-native (0x addresses, eth_amount, tx_hash)…
      tags:
      - x402 Robinhood Chain
      parameters:
      - name: limit
        in: query
        required: false
        description: Max trades to return
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: action
        in: query
        required: false
        description: Filter by trade side
        schema:
          type: string
          enum:
          - buy
          - sell
      - name: kol
        in: query
        required: false
        description: Filter by a single RHC KOL wallet address (0x, 40 hex)
        schema:
          type: string
      - name: min_eth
        in: query
        required: false
        description: Minimum ETH-equivalent trade size
        schema:
          type: number
          minimum: 0
          maximum: 100000
      - name: before
        in: query
        required: false
        description: ISO8601 timestamp — only trades before this time (pagination)
        schema:
          type: string
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.005000'
        protocols:
        - x402: {}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: Illustrative response fragment; additional fields and row properties are documented by the endpoint. Not live market data.
                properties:
                  trades:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                required:
                - trades
                additionalProperties: true
        '402':
          description: Payment Required
