  /api/x402/rhc/tokens/{mint}/holders:
    get:
      operationId: rhc_tokens_mint_holders
      summary: Robinhood Chain holder census — top holders with wei-exact balances…
      tags:
      - x402 Robinhood Chain
      parameters:
      - name: mint
        in: path
        required: true
        description: Robinhood Chain token address (0x, 40 hex)
        schema:
          type: string
          example: '0x0000000000000000000000000000000000000001'
        example: '0x0000000000000000000000000000000000000001'
      - name: limit
        in: query
        required: false
        description: Top holders to return (page size)
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        description: Page offset (ignored when `after` is set)
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - name: after
        in: query
        required: false
        description: 'Keyset cursor: pass next_after from the previous page unchanged (walks the full holder set past offset 10,000)'
        schema:
          type: string
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.020000'
        protocols:
