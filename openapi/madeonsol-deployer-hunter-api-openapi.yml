  /deployer-hunter/{wallet}/rewards:
    get:
      tags:
      - Deployer Hunter
      summary: Deployer creator-fee rewards — collected vs attributed
      description: 'pump.fun **creator-fee rewards** for a wallet, answered two ways that are never merged. **`collected`** = what actually reached the wallet: `direct_claims` (collect_creator_fee — these rows carry no mint; history since 2026-08-17 is retained, archive policy pending), `social_claims` (social-handle PDA claims paid to the wallet) and `share_payouts` (distribute_creator_fees payouts naming the wallet as a shareholder, on any token — `on_own_tokens` isolates the ones it deployed). **`attributed`** = every distribute_creator_fees payout on the tokens the wallet **deployed**, whoever received it, split `to_self` / `to_others` with `redirected_pct`. A deployer whose attributed total dwarfs its collected total is redirecting fees (launch tool, KOL, social handle) — that gap is the signal. Each money block carries `sol`, `usdc` and `usd` (quotes are summed separately; `usd` is null when a SOL amount exists and no SOL price is available, never a silent zero). `top_tokens` / `top_recipients` (≤10 each) show where the attributed fees went, with social PDAs labelled. Works for non-deployers too (`is_deployer: false`, attributed empty). Shareholder payouts and social claims since 2026-08-17. Tokens on the default config (100% to the creator) pay via direct claims, so `attributed` only covers tokens whose fees were ever split. PRO+.'
      parameters:
      - name: wallet
        in: path
        required: true
        schema:
          type: string
          example: gVDXhoGbePACvSqN7CZBtQXFW9eyJwsgudPEwSydAkx
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    type: string
                  is_deployer:
                    type: boolean
                  tokens_in_scope:
                    type: integer
                    description: tokens attributed to the wallet in our token table — the universe `attributed` is computed over; not the profile's total_tokens_deployed
                  collected:
                    type: object
                    properties:
                      sol:
                        type: number
                      usdc:
                        type: number
                      usd:
                        type: number
                        nullable: true
                      direct_claims:
                        type: object
                        properties:
                          count:
                            type: integer
                          sol:
                            type: number
                          usdc:
                            type: number
                          usd:
                            type: number
                            nullable: true
                          first_at:
                            type: string
                            nullable: true
                          last_at:
                            type: string
                            nullable: true
                          window_days:
                            type: integer
                      social_claims:
                        type: object
                        properties:
                          count:
                            type: integer
                          sol:
                            type: number
                          usdc:
                            type: number
                          usd:
                            type: number
                            nullable: true
                          first_at:
                            type: string
                            nullable: true
                          last_at:
                            type: string
                            nullable: true
                      share_payouts:
                        type: object
                        properties:
                          count:
                            type: integer
                          tokens:
                            type: integer
                          sol:
                            type: number
                          usdc:
                            type: number
                          usd:
                            type: number
                            nullable: true
                          on_own_tokens:
                            type: object
                            properties:
                              sol:
                                type: number
                              usdc:
                                type: number
                              usd:
                                type: number
                                nullable: true
                          first_at:
                            type: string
                            nullable: true
                          last_at:
                            type: string
                            nullable: true
                  attributed:
                    type: object
                    properties:
                      count:
                        type: integer
                      sol:
                        type: number
                      usdc:
                        type: number
                      usd:
                        type: number
                        nullable: true
                      to_self:
                        type: object
                        properties:
                          sol:
                            type: number
                          usdc:
                            type: number
                          usd:
                            type: number
                            nullable: true
                      to_others:
                        type: object
                        properties:
                          sol:
                            type: number
                          usdc:
                            type: number
                          usd:
                            type: number
                            nullable: true
                      redirected_pct:
                        type: number
                        nullable: true
                        description: share of attributed fees that went to wallets other than the deployer (0–100)
                      tokens_with_payouts:
