openapi: 3.2.0
info:
  title: MadeOnSol Deployer Hunter API
  version: 1.20.0
  description: Real-time Solana & Robinhood Chain trading intelligence — KOL wallet trades, deployer reputation, token buyer-quality scoring, wallet tracking, and copy-trade signals across both chains (Robinhood Chain paths under `/rhc/*`).
  contact:
    name: MadeOnSol
    url: https://madeonsol.com/contact
  license:
    name: Proprietary
    url: https://madeonsol.com/terms
servers:
- url: https://madeonsol.com/api/v1
  description: Production
security:
- BearerAuth: []
tags:
- name: Deployer Hunter
  description: Pump.fun deployer reputation alerts, leaderboard, and per-deployer drilldowns.
paths:
  /deployer-hunter/alerts:
    get:
      tags:
      - Deployer Hunter
      summary: Pump.fun deployer alerts
      description: 'New token launches from profiled Pump.fun deployers, enriched with deployer tier, `deployer.best_token_peak_mc`, `deployer.runner_rate` (fraction of the deployer''s labeled tokens that ran — peak >=60min — with `deployer.labeled_tokens` as the confidence denominator; gate on >=3) and `deployer.avg_time_to_bond_minutes`, plus any active KOL buys. Each alert carries `deployer_sol_balance` — the deployer wallet''s SOL balance snapshotted at alert time (SOL; null for rows before 2026-06-21 or on RPC failure). Pagination: `cursor=` (strict (created_at, id) keyset, `next_cursor`) is preferred; `before=` (strict timestamp — skips alerts sharing the boundary created_at) and `offset` stay supported. `kol_buys` is an exact per-mint aggregate (was a page-wide 500-row sample until 2026-09-21), and `min_kol_buys` is served by a bounded scan — see `has_more` / `scan`.'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: Only alerts after this ISO timestamp
      - name: before
        in: query
        schema:
          type: string
          format: date-time
        description: 'Cursor: only alerts strictly older than this ISO timestamp. Use `next_before` from the previous response.'
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Legacy offset pagination. Prefer `cursor` for high-scale polling.
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 200
        description: 'PREFERRED pagination (audit F09 follow-up): the `next_cursor` from a previous page — an opaque strict (created_at, id) keyset, so paging never repeats or skips rows that share a sort value and progresses with limit=1 through runs of identical timestamps. Malformed or tampered → 400. Cannot be combined with `before=` or `offset=` (400).'
      - name: tier
        in: query
        schema:
          type: string
          enum:
          - elite
          - good
          - moderate
          - rising
          - cold
        description: Filter by deployer reputation tier
      - name: alert_type
        in: query
        schema:
          type: string
        description: Filter by alert_type (e.g. new_token, bonded, rug_flagged)
      - name: priority
        in: query
        schema:
          type: string
          enum:
          - high
          - medium
          - low
        description: Filter by alert priority
      - name: min_kol_buys
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Only alerts where at least N distinct KOLs bought the token (post-filter on kol_buys.count, served by a bounded scan — see `scan`)
      - name: token_mint
        in: query
        schema:
          type: string
        description: Scope to one token's alert history — combine with alert_type=bonded to check if/when a specific token bonded
      responses:
        '200':
          description: OK. Includes `next_before` cursor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  coverage:
                    $ref: '#/components/schemas/LaunchCoverage'
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        token_mint:
                          type: string
                          nullable: true
                        token_name:
                          type: string
                          nullable: true
                        token_symbol:
                          type: string
                          nullable: true
                        alert_type:
                          type: string
                        title:
                          type: string
                        message:
                          type: string
                        priority:
                          type: string
                          enum:
                          - high
                          - medium
                          - low
                        created_at:
                          type: string
                          format: date-time
                        market_cap_at_alert:
                          type: number
                          nullable: true
                        deployer_sol_balance:
                          type: number
                          nullable: true
                        launchpad:
                          type: string
                          nullable: true
                        deployers:
                          type: object
                          nullable: true
                          description: Joined deployer-reputation row for the alerting wallet.
                          properties:
                            wallet_address:
                              type: string
                            tier:
                              type: string
                              nullable: true
                            total_tokens_deployed:
                              type: integer
                            total_bonded:
                              type: integer
                            instant_bonds:
                              type: integer
                            bonding_rate:
                              type: number
                              nullable: true
                            recent_outcomes:
                              type: array
                              items:
                                type: boolean
                              nullable: true
                            recent_bond_rate:
                              type: number
                              nullable: true
                            best_token_peak_mc:
                              type: number
                              nullable: true
                            runner_rate:
                              type: number
                              nullable: true
                              description: Fraction of labeled tokens that ran (peak ≥60min).
                            runner_tokens:
                              type: integer
                              nullable: true
                            labeled_tokens:
                              type: integer
                              nullable: true
                              description: Confidence denominator for runner_rate.
                            avg_time_to_bond_minutes:
                              type: number
                              nullable: true
                        kol_buys:
                          type: object
                          nullable: true
                          description: Post-hoc KOL-buy enrichment on this token, or null if no tracked KOL has bought it.
                          properties:
                            count:
                              type: integer
                              description: Distinct KOLs who bought
                            total_sol:
                              type: number
                            kols:
                              type: array
                              items:
                                type: string
                              description: KOL names
                  limit:
                    type: integer
                  offset:
                    type: integer
                  next_before:
                    type: string
                    format: date-time
                    nullable: true
                    description: 'Legacy cursor — pass as ?before= to fetch older alerts (strict timestamp bound: skips alerts sharing the boundary created_at). Prefer next_cursor.'
                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque keyset cursor for the next (older) page — pass as `cursor=`. null = end of feed. PREFERRED over the strict-timestamp legacy cursor, which skips same-timestamp siblings of the boundary row.
                  has_more:
                    type: boolean
                    description: false only when the candidate feed is exhausted (not merely when the page is short).
                  kol_buys_complete:
                    type: boolean
                    description: 'false when the per-mint KOL-buy aggregate could not be read exactly: the pre-migration fallback hit the 1,000-row page clamp (kol_buys counts are lower bounds), or the read failed (kol_buys is null = unknown, not "no KOL buys"; with min_kol_buys the request fails instead).'
                  scan:
                    type: object
                    description: 'Present when a filter had to be applied after the candidate fetch (audit F09): has_more is then false only when the candidates ran out, and scan_truncated=true means the per-request scan budget ran out first — more matches MAY exist past next_cursor.'
                    properties:
                      post_filtered:
                        type: boolean
                      scanned:
                        type: integer
                        description: Candidate rows examined
                      scan_truncated:
                        type: boolean
                        description: The per-request scan budget ran out before `limit` matches — more matches MAY exist past the cursor/offset
                      scan_budget:
                        type: integer
                  data_age_seconds:
                    type: integer
                    nullable: true
                  delay:
                    type: string
                    nullable: true
                    description: BASIC tier only — present when the feed is free-tier delayed, e.g. "5m"
                  delay_seconds:
                    type: integer
                    nullable: true
                  as_of:
                    type: string
                    format: date-time
                    nullable: true
                  delay_note:
                    type: string
                    nullable: true
                  upgrade:
                    type: string
                    nullable: true
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-madeonsol-tier: FREE
      x-badges:
      - name: FREE
        position: after
        color: '#64748b'
      operationId: getDeployerHunterAlerts
      x-operation-id-source: derived
  /deployer-hunter/{wallet}:
    get:
      tags:
      - Deployer Hunter
      summary: Single deployer profile
      description: Profile for one Pump.fun deployer wallet — tier, bonding rate, total tokens deployed, total bonded count, recent bond rate, best-token peak MC, and `runner_rate` (fraction of labeled tokens that ran, peak >=60min; with `labeled_tokens` confidence denominator) + `avg_time_to_bond_minutes`.
      parameters:
      - name: wallet
        in: path
        required: true
        schema:
          type: string
          example: 2FxiPRPLYX3H84FZkdRiUHDgDm4U5u98etbL4yvZ3qRq
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  coverage:
                    $ref: '#/components/schemas/LaunchCoverage'
                  is_deployer:
                    type: boolean
                  wallet:
                    type: string
                  deployer:
                    type: object
                    nullable: true
                    description: null when is_deployer is false
                    properties:
                      id:
                        type: string
                        format: uuid
                      wallet_address:
                        type: string
                      total_tokens_deployed:
                        type: integer
                      total_bonded:
                        type: integer
                      instant_bonds:
                        type: integer
                        nullable: true
                      bonding_rate:
                        type: number
                        nullable: true
                      recent_bond_rate:
                        type: number
                        nullable: true
                      tier:
                        type: string
                        enum:
                        - elite
                        - good
                        - moderate
                        - rising
                        - cold
                        - unranked
                        nullable: true
                      is_tracked:
                        type: boolean
                      avg_time_to_bond_minutes:
                        type: number
                        nullable: true
                      best_token_peak_mc:
                        type: number
                        nullable: true
                      avg_peak_mc:
                        type: number
                        nullable: true
                      recent_outcomes:
                        type: object
                        nullable: true
                        description: Free-form recent-token outcome summary
                      runner_rate:
                        type: number
                        nullable: true
                        description: Fraction of labeled tokens that ran (peak >=60min)
                      runner_tokens:
                        type: integer
                        nullable: true
                      labeled_tokens:
                        type: integer
                        nullable: true
                        description: Confidence denominator for runner_rate
                      post_bond_survival_rate:
                        type: number
                        nullable: true
                      post_bond_2x_rate:
                        type: number
                        nullable: true
                      post_bond_labeled_count:
                        type: integer
                        nullable: true
                      first_seen_at:
                        type: string
                        format: date-time
                        nullable: true
                      first_deploy_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: Earliest deploy observed by MadeOnSol for this wallet (the earliest of our live-ingested creates, bond catch-ups and bonded tokens). Not proof of the wallet's first-ever on-chain launch. Only moves earlier as evidence arrives. Anchor for `funding_features.funding_to_first_deploy_seconds` and `capital_intelligence.launched_at`.
                      last_deploy_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: Latest deploy observed by MadeOnSol for this wallet. Only moves later.
                      last_bond_at:
                        type: string
                        format: date-time
                        nullable: true
                      label:
                        type: string
                        nullable: true
                  funding:
                    type: object
                    description: 'PRO+ only: wallet funding evidence for this deployer, the same block as `/wallet/{address}/funding` (relationships ULTRA+). Absent below PRO.'
                  funding_features:
                    type: object
                    description: 'PRO+ only: flat factual funding features (no score), including the funding to first-deploy gap (`funding_to_first_deploy_seconds`, measured to `deployer.first_deploy_at`; negative when the deploy predates the funding we observed). Absent below PRO.'
                  capital_intelligence:
                    type: object
                    description: 'PRO+ only, when capital intelligence is enabled: capital relationships observed from high-signal source wallets (forward-looking from 2026-09-20). `capital_graph` per source is ULTRA+. Absent below PRO.'
                    properties:
                      observed:
                        type: boolean
                      note:
                        type: string
                        description: Present when observed is false.
                      pre_launch_sources:
                        type: integer
                        description: Sources whose first transfer is strictly before launched_at.
                      total_sources:
                        type: integer
                      launched_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: = deployer.first_deploy_at (earliest deploy observed by MadeOnSol).
                      sources:
                        type: array
                        items:
                          type: object
                          properties:
                            source_address:
                              type: string
                            explorer_url:
                              type: string
                            asset:
                              type: string
                            amount:
                              type: string
                              nullable: true
                            amount_raw:
                              type: string
                            transfer_count:
                              type: integer
                            funded_at:
                              type: string
                              format: date-time
                            last_funded_at:
                              type: string
                              format: date-time
                            funding_to_launch_seconds:
                              type: integer
                              nullable: true
                              description: Seconds from funded_at to launched_at; null unless pre_launch.
                            pre_launch:
                              type: boolean
                              description: funded_at strictly before launched_at.
                            source_profile_now:
                              type: object
                              nullable: true
                              description: The source's CURRENT MadeOnSol profile, not what was known at transfer time.
                            capital_graph:
                              type: object
                              description: ULTRA+ only.
                      disclaimer:
                        type: string
                  pump_stats:
                    type: object
                    nullable: true
                    description: Aggregated from the live pump.fun API (not our DB); null when is_deployer is false
                    properties:
                      total:
                        type: integer
                      bonded:
                        type: integer
                      bondingRate:
                        type: number
                      bestAthMc:
                        type: number
                      avgAthMc:
                        type: number
                  pump_tokens:
                    type: array
                    description: Raw pump.fun API token list (pump.fun-launched tokens only)
                    items:
                      type: object
                      properties:
                        mint:
                          type: string
                        name:
                          type: string
                        symbol:
                          type: string
                        image_uri:
                          type: string
                        creator:
                          type: string
                        created_timestamp:
                          type: integer
                          description: Unix ms
                        complete:
                          type: boolean
                          description: Bonded/graduated
                        ath_market_cap:
                          type: number
                        usd_market_cap:
                          type: number
                        market_cap:
                          type: number
                        reply_count:
                          type: integer
                        pool_address:
                          type: string
                        pump_swap_pool:
                          type: string
                  pump_error:
                    type: boolean
                    nullable: true
                    description: true when the live pump.fun API call failed
                  launchpad_tokens:
                    type: array
                    description: Non-pump.fun launchpad tokens (bonk/bags) from our own indexed data — no pre-tracking history
                    items:
                      type: object
                      properties:
                        mint:
                          type: string
                        name:
                          type: string
                          nullable: true
                        symbol:
                          type: string
                          nullable: true
                        launchpad:
                          type: string
                          description: e.g. launchlab (bonk), bags
                        complete:
                          type: boolean
                        deployed_at:
                          type: string
                          format: date-time
                        bonded_at:
                          type: string
                          format: date-time
                          nullable: true
                        peak_market_cap:
                          type: number
                          nullable: true
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '404':
          description: Deployer not tracked
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: FREE
      x-badges:
      - name: FREE
        position: after
        color: '#64748b'
      operationId: getDeployerHunterByWallet
      x-operation-id-source: derived
  /deployer-hunter/{wallet}/tokens:
    get:
      tags:
      - Deployer Hunter
      summary: Tokens launched by one deployer
      description: Paginated list of every token deployed by this wallet, with deployed_at, bonded_at, time-to-bond, peak MC, and MC trajectory snapshots (1h/6h/24h/7d after bond).
      parameters:
      - name: wallet
        in: path
        required: true
        schema:
          type: string
          example: 2FxiPRPLYX3H84FZkdRiUHDgDm4U5u98etbL4yvZ3qRq
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: only_bonded
        in: query
        description: true = only tokens that graduated (bonded_at set); total / has_more then count the bonded set. Any value other than true/false is a 400 (invalid_only_bonded).
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  coverage:
                    $ref: '#/components/schemas/LaunchCoverage'
                  is_deployer:
                    type: boolean
                  wallet:
                    type: string
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        token_mint:
                          type: string
                        token_name:
                          type: string
                          nullable: true
                        token_symbol:
                          type: string
                          nullable: true
                        deployed_at:
                          type: string
                          format: date-time
                        bonded_at:
                          type: string
                          format: date-time
                          nullable: true
                        time_to_bond_minutes:
                          type: number
                          nullable: true
                        peak_market_cap:
                          type: number
                          nullable: true
                        mc_at_bond:
                          type: number
                          nullable: true
                        market_cap_at_alert:
                          type: number
                          nullable: true
                        alerted_at:
                          type: string
                          format: date-time
                          nullable: true
                        instant_bond:
                          type: boolean
                          description: create → migrate within ~90s (curve filled by a bundle)
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  has_more:
                    type: boolean
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: FREE
      x-badges:
      - name: FREE
        position: after
        color: '#64748b'
      operationId: getDeployerHunterByWalletTokens
      x-operation-id-source: derived
  /deployer-hunter/{wallet}/trajectory:
    get:
      tags:
      - Deployer Hunter
      summary: Skill curve for one deployer
      description: Aggregated MC-at-bond and time-to-bond trends over the deployer's launch history. Surfaces whether they're improving or fading.
      parameters:
      - name: wallet
        in: path
        required: true
        schema:
          type: string
          example: 2FxiPRPLYX3H84FZkdRiUHDgDm4U5u98etbL4yvZ3qRq
      - name: include
        in: query
        schema:
          type: string
          enum:
          - daily_snapshots
        description: Set to 'daily_snapshots' to include the per-day MC-at-bond / time-to-bond series
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  coverage:
                    $ref: '#/components/schemas/LaunchCoverage'
                  is_deployer:
                    type: boolean
                    nullable: true
                    description: Only present (false) for untracked wallets; omitted otherwise
                  wallet:
                    type: string
                    description: Echo of the requested wallet — only on the is_deployer:false body
                  deployer:
                    type: object
                    nullable: true
                    description: null when the wallet isn't a tracked deployer
                    properties:
                      wallet_address:
                        type: string
                      total_tokens_deployed:
                        type: integer
                      total_bonded:
                        type: integer
                      bonding_rate:
                        type: number
                        nullable: true
                      recent_bond_rate:
                        type: number
                        nullable: true
                      tier:
                        type: string
                        enum:
                        - elite
                        - good
                        - moderate
                        - rising
                        - cold
                        nullable: true
                  trajectory:
                    type: object
                    nullable: true
                    description: null when the wallet isn't a tracked deployer
                    properties:
                      current_streak:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - bond
                            - fail
                            - none
                          count:
                            type: integer
                      longest_bond_streak:
                        type: integer
                      longest_fail_streak:
                        type: integer
                      rolling_bond_rates:
                        type: array
                        description: Rolling 10-token bond-rate windows
                        items:
                          type: object
                          properties:
                            window_end:
                              type: integer
                            bond_rate:
                              type: number
                      trend:
                        type: string
                        enum:
                        - improving
                        - declining
                        - stable
                      avg_days_between_deploys:
                        type: number
                        nullable: true
                      avg_recovery_tokens:
                        type: number
                        nullable: true
                        description: Avg tokens between a fail streak and the next bond
                      best_stretch:
                        type: object
                        nullable: true
                        properties:
                          start_index:
                            type: integer
                          end_index:
                            type: integer
                          bond_rate:
                            type: number
                      worst_stretch:
                        type: object
                        nullable: true
                        properties:
                          start_index:
                            type: integer
                          end_index:
                            type: integer
                          bond_rate:
                            type: number
