                      distributions:
                        type: integer
                      recipients:
                        type: integer
                      first_at:
                        type: string
                        nullable: true
                      last_at:
                        type: string
                        nullable: true
                  top_tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        mint:
                          type: string
                        quote:
                          type: string
                          enum:
                          - SOL
                          - USDC
                        total:
                          type: number
                        total_usd:
                          type: number
                          nullable: true
                        to_self:
                          type: number
