  /deployer-hunter/{wallet}/as-of:
    get:
      tags:
      - Deployer Hunter
      summary: Deployer reputation as it stood on a date (point-in-time)
      description: 'The deployer''s reputation **exactly as it stood on `date`** (default today, UTC) — the latest write-on-change snapshot at or before that date, so a backtest sees only what was knowable then. Because snapshots are only written when state changes, `snapshot.snapshot_date` can be earlier than `requested_date`; both are returned and `carried: true` marks that case. If no snapshot exists at or before `date` the response is `as_of: false, snapshot: null` — nothing is synthesized. `first_snapshot_date` says when tracking began. Snapshots exist from 2026-04-07. Untracked wallets return `is_deployer: false`. PRO+.'
      parameters:
      - name: wallet
        in: path
        required: true
        schema:
          type: string
          example: UVXV1BHPQFBfDS1tSVb48kXFMkeZ7ojfFkfsVFEAgyE
      - name: date
        in: query
        schema:
          type: string
          format: date
          example: '2026-08-15'
        description: 'YYYY-MM-DD (UTC). Default: today. Must be ≥ 2026-04-07 and not in the future.'
      responses:
