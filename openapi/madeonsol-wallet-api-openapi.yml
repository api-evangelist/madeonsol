openapi: 3.2.0
info:
  title: MadeOnSol Wallet API
  version: 1.20.0
  description: Real-time Solana & Robinhood Chain trading intelligence — KOL wallet trades, deployer reputation, token buyer-quality scoring, wallet tracking, and copy-trade signals across both chains (Robinhood Chain paths under `/rhc/*`).
  contact:
    name: MadeOnSol
    url: https://madeonsol.com/contact
  license:
    name: Proprietary
    url: https://madeonsol.com/terms
servers:
- url: https://madeonsol.com/api/v1
  description: Production
security:
- BearerAuth: []
tags:
- name: Wallet
  description: 'Universal per-wallet endpoints: aggregate stats with cross-product flags, FIFO cost-basis PnL with daily curve, open positions with live unrealized, and cursor-paginated raw trades. PRO+.'
paths:
  /wallet/{address}/funding:
    get:
      tags:
      - Wallet
      summary: Shared-funder evidence for a tracked wallet (PRO+)
      description: Addresses that sent a qualifying SOL transfer to this wallet AND to other tracked wallets (active KOLs, elite/good deployers), with the supporting transactions. Evidence of a funding connection — not proof of common ownership, manipulation or coordinated trading. Forward-looking coverage from monitoring start (no historical backfill); SOL-only in V1 (SPL/Token-2022 not supported). Known exchange/service funders are marked `service_funder`.
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
        description: Solana wallet (base58).
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
        description: Shared funders per page.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
      responses:
        '200':
          description: 'OK. `status`: ok | partial_coverage | not_tracked | collection_disabled | collection_stale | not_started. `collection_stale` = the collector has not reported within the staleness window, so evidence after `coverage.heartbeat_at` may be missing. An empty `shared_funders` with status ok means no shared funder was OBSERVED within coverage — never that wallets are independent.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - solana
                    - robinhood
                  chain_id:
                    type: string
                  native_asset:
                    type: string
                  address:
                    type: string
                  status:
                    type: string
                    enum:
                    - ok
                    - partial_coverage
                    - not_tracked
                    - collection_disabled
                    - collection_stale
                    - not_started
                  summary:
                    type: string
                  shared_funders:
                    type: array
                    items:
                      type: object
                      properties:
                        funder:
                          type: string
                        funder_explorer_url:
                          type: string
                        funder_label:
                          type: object
                          nullable: true
                          properties:
                            label:
                              type: string
                            category:
                              type: string
                            verified:
                              type: boolean
                        service_funder:
                          type: boolean
                          description: 'Known exchange/service: a common funding source, not a connection signal'
                        to_this_wallet:
                          type: array
                          items:
                            type: object
                            properties:
                              asset:
                                type: string
                                description: '''native'' or the token contract'
                              symbol:
                                type: string
                                nullable: true
                              decimals:
                                type: integer
                                nullable: true
                              amount_raw:
                                type: string
                                description: Exact integer (raw units)
                              amount:
                                type: string
                                nullable: true
                                description: Exact decimal string when decimals are known
                              transfer_count:
                                type: integer
                              first_seen:
                                type: string
                                format: date-time
                                description: Chain block time of the earliest transfer when resolved; otherwise the collector's observation time (Solana block times are resolved asynchronously and can stay unknown after bounded retries). Not a guaranteed on-chain timestamp.
                              last_seen:
                                type: string
                                format: date-time
                                description: Same basis as first_seen, for the latest transfer.
                              transactions:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    tx:
                                      type: string
                                    explorer_url:
                                      type: string
                        connected_wallets:
                          type: array
                          items:
                            type: object
                            properties:
                              address:
                                type: string
                              explorer_url:
                                type: string
                              tracked_as:
                                type: array
                                items:
                                  type: string
                              transfers:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    asset:
                                      type: string
                                      description: '''native'' or the token contract'
                                    symbol:
                                      type: string
                                      nullable: true
                                    decimals:
                                      type: integer
                                      nullable: true
                                    amount_raw:
                                      type: string
                                      description: Exact integer (raw units)
                                    amount:
                                      type: string
                                      nullable: true
                                      description: Exact decimal string when decimals are known
                                    transfer_count:
                                      type: integer
                                    first_seen:
                                      type: string
                                      format: date-time
                                      description: Chain block time of the earliest transfer when resolved; otherwise the collector's observation time (Solana block times are resolved asynchronously and can stay unknown after bounded retries). Not a guaranteed on-chain timestamp.
                                    last_seen:
                                      type: string
                                      format: date-time
                                      description: Same basis as first_seen, for the latest transfer.
                                    transactions:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          tx:
                                            type: string
                                          explorer_url:
                                            type: string
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      total:
                        type: integer
                      has_more:
                        type: boolean
                  coverage:
                    type: object
                    additionalProperties: true
                    description: collection_enabled, mode (off|shadow|on), heartbeat_at, collector_current, monitoring_started_at, last_committed_position, last_committed_at, tracked_intervals, known_gaps, supported/unsupported transfer types, recovery, history note
                  disclaimer:
                    type: string
                  direct_funding:
                    type: object
                    additionalProperties: true
                    description: 'Optional, additive: where THIS wallet was funded from (the same block as `funding` on the wallet/deployer profiles). Absent when the direct read fails — the shared-funder answer above still stands. `observed: false` carries `coverage`, `coverage_explanation`, `observation_started_at` and `note` (no funding observed within coverage is not evidence the wallet was never funded). `observed: true` adds the coverage fields, `asset_scope`, `native_funding`, `token_funding`, `sources[]` and `source_count` (PRO); cross-wallet `relationships` counts are ULTRA+ and removed below ULTRA.'
                    properties:
                      observed:
                        type: boolean
                      coverage:
                        type: string
                        description: Coverage level of the funding evidence, e.g. forward_only.
                      coverage_explanation:
                        type: string
                      observation_started_at:
                        type: string
                        format: date-time
                        nullable: true
                      note:
                        type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '400':
          description: Invalid address or query parameters.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tier below PRO.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: '`code: feature_disabled` (feature switched off by the operator; on in production since 2026-09-20) or `code: funding_data_unavailable` (data error — NOT an empty result; retry).'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: getWalletByAddressFunding
      x-operation-id-source: derived
  /wallet/{address}/flags:
    get:
      tags:
      - Wallet
      summary: Point-in-time wallet flags (PRO+)
      description: '"What did you know about this wallet on date D." For every flag source — `deployer` (tier, tracked/blocked/flagged, bonds, instant_bonds, runner_rate), `alpha` (bot_confidence, win_rate, bundle_rate…), `dump_cluster`, `kol`, `sniper`, `bundler` — the latest write-on-change snapshot at or before `as_of` (default: now). `carried: true` = the state was recorded earlier and had not changed by `as_of`; `null` = no snapshot at or before `as_of` (we had nothing on the wallet then); membership sources carry `active: false` after the wallet dropped out. `history=true` adds the change series for audit trails. Snapshots exist from 2026-08-28 (daily 01:20 UTC).'
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
        description: Solana wallet (base58).
      - name: as_of
        in: query
        schema:
          type: string
          format: date-time
        description: 'ISO-8601 with offset. Default: now.'
      - name: history
        in: query
        schema:
          type: boolean
          default: false
        description: Include the change series (newest first, ≤ 200 rows).
      responses:
        '200':
          description: OK. `{ wallet, as_of, flagged[], sources{ deployer, alpha, dump_cluster, kol, sniper, bundler }, history?[], note }`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    type: string
                  as_of:
                    type: string
                    format: date-time
                  flagged:
                    type: array
                    items:
                      type: string
                      enum:
                      - deployer
                      - alpha
                      - dump_cluster
                      - kol
                      - sniper
                      - bundler
                    description: Sources with a snapshot at or before as_of whose latest state is still active
                  sources:
                    type: object
                    description: One key per flag source; null = no snapshot at or before as_of
                    properties:
                      deployer:
                        type: object
                        nullable: true
                        description: tier, tracked/blocked/flagged, bonds, instant_bonds, runner_rate, plus snapshot_at/active/carried
                        additionalProperties: true
                      alpha:
                        type: object
                        nullable: true
                        description: bot_confidence, win_rate, bundle_rate…, plus snapshot_at/active/carried
                        additionalProperties: true
                      dump_cluster:
                        type: object
                        nullable: true
                        additionalProperties: true
                      kol:
                        type: object
                        nullable: true
                        additionalProperties: true
                      sniper:
                        type: object
                        nullable: true
                        additionalProperties: true
                      bundler:
                        type: object
                        nullable: true
                        additionalProperties: true
                  history:
                    type: array
                    nullable: true
                    description: Present when history=true (newest first, ≤ 200 rows)
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                        flags:
                          type: object
                          additionalProperties: true
                        snapshot_at:
                          type: string
                          format: date-time
                  note:
                    type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Tier below PRO.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: getWalletByAddressFlags
      x-operation-id-source: derived
  /wallet/batch/trades:
    post:
      tags:
      - Wallet
      summary: Recent trades for up to 50 wallets in one call
      description: 'The batch twin of `GET /wallet/{address}/trades`: same rows, same fields, same 90-day window — for **up to 50 wallets per request**, up to 100 trades each, newest first. Pass `since` (unix seconds) and you get only trades newer than that across every wallet; the response''s `next_since` is the newest `block_time` seen, so feed it straight back on the next poll. Missing wallets come back with an empty `trades` array — *not observed*, never a 404.


        **Why:** sweeping many wallets through the single-wallet route costs one request per wallet; fifty lookups in one call is one round-trip and one quota unit. Trades carry `price_sol`/`price_usd` (executed) and `market_price_sol`/`market_price_usd` (canonical) exactly like the single route.


        **Coverage honesty:** the tape is the pump.fun / LaunchLab / bags pipeline — a wallet''s Raydium-native or Meteora memecoin trades are not on it; the `coverage` block says so. PRO+.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - wallets
              properties:
                wallets:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 50
                  description: Base58 wallet addresses. Also accepts a comma-separated string.
                since:
                  type: integer
                  description: 'Unix seconds; only trades strictly after this. Default: 90 days ago (cannot reach further back).'
                limit_per_wallet:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                action:
                  type: string
                  enum:
                  - buy
                  - sell
      responses:
        '200':
          description: OK — `wallets[]` of `{wallet, count, trades[]}` plus `since`, `next_since`, `limit_per_wallet`, `coverage`
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      type: object
                      properties:
                        wallet:
                          type: string
                        count:
                          type: integer
                        trades:
                          type: array
                          items:
                            type: object
                            properties:
                              tx_signature:
                                type: string
                              token_mint:
                                type: string
                              action:
                                type: string
                                enum:
                                - buy
                                - sell
                              sol_amount:
                                type: number
                              token_amount:
                                type: number
                              price_sol:
                                type: number
                                nullable: true
                                description: This trade's executed price (sol_amount / token_amount)
                              price_usd:
                                type: number
                                nullable: true
                              market_price_sol:
                                type: number
                                nullable: true
                                description: Canonical pool price sampled near this trade's slot
                              market_price_usd:
                                type: number
                                nullable: true
                              block_time:
                                type: integer
                              traded_at:
                                type: string
                                format: date-time
                  since:
                    type: integer
                  next_since:
                    type: integer
                    description: Newest block_time seen — feed back as `since` on the next poll
                  limit_per_wallet:
                    type: integer
                  coverage:
                    type: object
                    properties:
                      history_start_days:
                        type: integer
                      scope:
                        type: string
                      note:
                        type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '400':
          description: Invalid body
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: postWalletBatchTrades
      x-operation-id-source: derived
  /wallet/batch/classify:
    post:
      tags:
      - Wallet
      summary: Batch wallet reputation flags (up to 100 addresses)
      description: 'Bulk reputation classification: `is_sniper`, `is_bundler`, `is_dumper` (+ raw dump-cluster cohort counts), `is_kol`, and `bot_confidence` for up to 100 wallets in one call. Flag values match the `flags` block on `GET /wallet/{address}` exactly.


        **Semantics**: flags derive from the pump.fun trade pipeline — `false` means "not observed", not "verified clean". `is_sniper` is behavior-updated (hourly); `is_bundler` is a lifetime flag; `is_dumper` uses a rolling 42-day window recomputed daily. PRO+.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - wallets
              properties:
                wallets:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  coverage:
                    $ref: '#/components/schemas/LaunchCoverage'
                  wallets:
                    type: array
                    items:
                      type: object
                      properties:
                        address:
                          type: string
                        is_sniper:
                          type: boolean
                        is_bundler:
                          type: boolean
                        is_dumper:
                          type: boolean
                        is_kol:
                          type: boolean
                        kol_name:
                          type: string
                          nullable: true
                        bot_confidence:
                          type: string
                          nullable: true
                          enum:
                          - none
                          - low
                          - medium
                          - high
                          description: null when not observed
                        dump_cluster:
                          type: object
                          nullable: true
                          properties:
                            dump_cohorts:
                              type: integer
                            runner_cohorts:
                              type: integer
                            total_cohorts:
                              type: integer
                            as_of:
                              type: string
                              format: date-time
                  count:
                    type: integer
                  as_of:
                    type: string
                    format: date-time
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '400':
          description: Invalid body
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: postWalletBatchClassify
      x-operation-id-source: derived
  /wallet-list/score:
    post:
      tags:
      - Wallet
      summary: Custom wallet-list scoring (up to 200 addresses)
      description: 'Enterprise only. Scores an arbitrary, customer-supplied list of Solana wallets on real FIFO cost-basis trading performance — not membership in our pre-tracked KOL/alpha lists (any wallet works, same as `GET /wallet/{address}/pnl`). Each wallet gets a transparent 0-100 `score` (50% win rate on closed positions + 50% profit factor, capped 5x — see `score_methodology` in the response), the full PnL summary, and the same reputation flags as `/wallet/batch/classify`.


        **Live-compute cap**: PnL is the expensive half of `/pnl` (up to 50k paginated trades + FIFO). Up to 200 wallets per call, but only the first 25 UNCACHED wallets are computed inline per request — the rest come back `status: "not_computed"`. Cached wallets (recently scored, or recently looked up via `/wallet/{address}/pnl`) are always free regardless of the cap. Resubmit a `not_computed` address alone, or call again shortly, to pick up its score once warm.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - wallets
              properties:
                wallets:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
