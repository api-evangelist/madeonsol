      summary: Paginated raw trades for any wallet
      description: 'Cursor-paginated `token_trades` rows for the wallet (launchpad-pipeline mints only). Buys under 0.05 SOL (under $3.50 when paid in USDC/USDT) are not stored; sells that receive SOL are kept at any size. Filters by action and/or token_mint. `since`/`until` Unix timestamps default to a 90-day window. Cursor is base64(`block_time:id`) — stable across DESC pagination. PRO+.


        *Added 2026-08-16*: `price_sol`/`price_usd` (this trade''s executed price, `sol_amount / token_amount`) and `market_price_sol`/`market_price_usd` (canonical pool price near the trade''s slot). Same definitions as `/tokens/{mint}/trades` — see that endpoint for which to use when.


        *Added 2026-09-07*: history below the Postgres floor is served from the Parquet archive — an explicit `since` older than `history.postgres_from` no longer returns an empty page. Same `history` block and `X-Read-Source` header as `/tokens/{mint}/trades`.'
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
          example: 2FxiPRPLYX3H84FZkdRiUHDgDm4U5u98etbL4yvZ3qRq
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        schema:
          type: string
          description: From `next_cursor` of previous response
      - name: action
        in: query
        schema:
          type: string
          enum:
          - buy
          - sell
      - name: token_mint
        in: query
        schema:
          type: string
          description: Filter to a single token
      - name: since
        in: query
        schema:
          type: integer
          description: Unix epoch seconds — default now-90d
      - name: until
        in: query
        schema:
          type: integer
          description: Unix epoch seconds — default now
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
            X-Read-Source:
              schema:
                type: string
                enum:
                - core
                - core+archive
                - archive
              description: 'Where this page''s rows came from: Postgres only, Postgres plus the Parquet archive (page straddles `history.postgres_from`), or the archive only.'
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                  trades:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletTrade'
                  next_cursor:
                    type: string
                    nullable: true
                  has_more:
                    type: boolean
                  filters:
                    type: object
                    properties:
                      action:
                        type: string
                        nullable: true
                      token_mint:
                        type: string
                        nullable: true
                      since:
                        type: integer
                      until:
                        type: integer
                  history:
                    type: object
                    description: Postgres/archive split for this page (added 2026-09-07, same semantics as `/tokens/{mint}/trades`). Rows at/after `postgres_from` come from Postgres, older rows from the Parquet archive, with one ordering and one cursor across the boundary. The 90-day default window sits above the floor, so only an explicit older `since` touches the archive.
                    properties:
                      postgres_from:
                        type: integer
                        description: Unix seconds — rows at/after this come from Postgres, older from the archive
                      archive_used:
                        type: boolean
                      archive_months:
                        type: array
                        items:
                          type: string
                      archive_available:
                        type: boolean
                        nullable: true
                        description: null = archive reader not configured
                      truncated:
                        type: boolean
                        description: true = older history was requested but the archive did not answer — do not treat has_more:false as the end of the tape
                      note:
                        type: string
                        description: Present when the archive could not be reached or is not configured
                  coverage:
                    $ref: '#/components/schemas/TradeCoverage'
                    description: 'Per-wallet coverage probe. `in_scope: null` with a note when the wallet''s history lives in the archive and the archive did not answer (inconclusive, not empty).'
        '400':
          description: Invalid wallet, action, mint, or inverted since/until
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
