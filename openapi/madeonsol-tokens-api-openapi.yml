  /tokens/{mint}/holders:
    get:
      tags:
      - Tokens
      summary: Live holders, holder count + concentration
      description: 'A live holder census read from the ledger at `confirmed`: every token account of the mint (owner + balance via mint-scoped `getProgramAccounts`), merged per owner. Gives an EXACT `holder_count` (distinct non-zero owners minus excluded pools/curves/burns), `token_accounts_nonzero`, ranks 1–100 retained, and `top1/top10/top20/top50/top100_share` over the circulating denominator. Each disclosed owner is labelled from MadeOnSol wallet intelligence (deployer / kol / early_buyer / bundle / bot / dump_cluster). Program-derived owners (liquidity pools, bonding curves, vaults) and burn addresses are EXCLUDED from the denominator and listed in `excluded[]` — the #1 raw account of a fresh memecoin is its own bonding curve. Disclosure: PRO ranks 1–10, ULTRA 1–50, BUSINESS 1–100; the maths is tier-independent. Measured latency: fresh pump.fun mints <1 s, $0.1–2M memecoins ~0.1–1.2 s, 200k–550k-account tokens 6–11 s (503 `holder_scan_in_progress` then cached). Mega-caps the provider refuses (TRUMP/JUP/BONK class) fall back to the top-20 `getTokenLargestAccounts` view with `holder_count: null` and `source.census_fallback_reason` set — never a trade-derived estimate. The same fallback applies when the census times out, and (since 2026-10-02) when a census''s balances add up to more than the mint''s supply: such a read is not one consistent ledger snapshot, so it is refused rather than served (`census_fallback_reason: census_inconsistent_sum_exceeds_supply`). Distinct from `/cap-table` (who bought first) — this is who holds NOW.'
      parameters:
      - name: mint
        in: path
        required: true
        schema:
          type: string
          example: FfuWjhMm5LP3anZ5zq8SG4iqzYVvhM4LoyNMM957pump
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mint:
                    type: string
                  slot:
                    type: integer
                    description: Ledger slot the holder set was read at.
                  as_of:
                    type: string
                    format: date-time
                  holders:
                    type: array
                    items:
                      type: object
                      properties:
                        rank:
                          type: integer
                        owner:
                          type: string
                          description: Wallet (owner of the token account(s)).
                        token_accounts:
                          type: array
                          items:
                            type: string
                        amount_raw:
                          type: string
                          description: Raw u64 balance as a string — never a float.
                        amount:
                          type: number
                          nullable: true
                        pct_of_supply:
                          type: number
                          nullable: true
                        pct_of_circulating:
                          type: number
                          nullable: true
                          description: Share of supply minus pools/curves/burns.
                        labels:
                          type: array
                          items:
                            type: string
                            enum:
                            - deployer
                            - kol
                            - early_buyer
                            - buyer
                            - bundle
                            - bot
                            - dump_cluster
                          description: Empty = unknown to us, not verified clean.
                        kol_name:
                          type: string
                          nullable: true
                        early_buyer_rank:
                          type: integer
                          nullable: true
                        bot_confidence:
                          type: string
                          nullable: true
                          enum:
                          - none
                          - low
                          - medium
                          - high
                        historical_win_rate:
                          type: number
                          nullable: true
                  count:
                    type: integer
                  disclosed:
                    type: integer
                    description: 'Rank cap by tier: 10 PRO, 50 ULTRA, 100 BUSINESS.'
                  excluded:
                    type: array
                    items:
                      type: object
                      properties:
                        owner:
                          type: string
                        token_accounts:
                          type: array
                          items:
                            type: string
                        amount_raw:
                          type: string
                        pct_of_supply:
                          type: number
                          nullable: true
                        reason:
                          type: string
                          enum:
                          - pool
                          - bonding_curve
                          - burn
                          - program_account
                          description: pool = vault authority of a known pool (dex + pool_address set); bonding_curve = pump.fun / LaunchLab curve; burn = incinerator / system program; program_account = off-curve owner we could not attribute to a known pool (vault, escrow, staking, unknown pool).
                        dex:
                          type: string
                          nullable: true
                          description: pumpfun | pumpswap | raydium | launchlab | meteora | orca | jupiter — when named.
                        pool_address:
                          type: string
                          nullable: true
                  concentration:
                    type: object
                    properties:
                      holder_count:
                        type: integer
                        nullable: true
                        description: Exact distinct non-zero owners minus excluded pools/curves/burns, at slot (census). null only when the census was not served (provider refusal, timeout or an inconsistent census; see source.census_fallback_reason) — never estimated from trades.
                      holder_count_source:
                        type: string
                        nullable: true
                      token_accounts_nonzero:
                        type: integer
                        nullable: true
                      supply_raw:
                        type: string
                        nullable: true
                      circulating_raw:
                        type: string
                        nullable: true
                      decimals:
                        type: integer
                        nullable: true
                      top1_share:
                        type: number
                        nullable: true
                      top10_share:
                        type: number
                        nullable: true
                      top20_share:
                        type: number
                        nullable: true
                      top50_share:
                        type: number
                        nullable: true
                      top100_share:
                        type: number
                        nullable: true
                      pool_and_program_pct:
                        type: number
                        nullable: true
                        description: Share of TOTAL supply sitting in pools/curves/vaults/burns among the excluded owners (= pool_pct + burned_pct + program_pct).
                      pool_pct:
                        type: number
                        nullable: true
                        description: Share of total supply in NAMED pools + bonding curves (excluded[].reason pool | bonding_curve).
                      burned_pct:
                        type: number
                        nullable: true
                        description: Share of total supply at burn addresses.
                      program_pct:
                        type: number
                        nullable: true
                        description: Share of total supply held by off-curve owners we could not attribute (excluded[].reason program_account).
                      deployer_pct:
                        type: number
                        nullable: true
                      kol_pct:
                        type: number
                        nullable: true
                      early_buyer_pct:
                        type: number
                        nullable: true
                      bundle_pct:
                        type: number
                        nullable: true
                      bot_pct:
                        type: number
                        nullable: true
                      dump_cluster_pct:
                        type: number
                        nullable: true
                      distinct_owners_in_top20:
                        type: integer
                      ranked_owners_available:
                        type: integer
                        description: How many ranked owners the scan retained (≤100 census, ≤20 fallback).
                  deployer:
                    type: object
                    nullable: true
                    properties:
                      wallet:
                        type: string
                      tier:
                        type: string
                      bonding_rate:
                        type: number
                        nullable: true
                  source:
                    type: object
                    properties:
                      method:
                        type: string
                        enum:
                        - getProgramAccounts_census
                        - getTokenLargestAccounts
                      token_program:
                        type: string
                        nullable: true
                      rpc_cap:
                        type: integer
                      commitment:
                        type: string
                      scan_ms:
                        type: integer
                      census_fallback_reason:
                        type: string
                        nullable: true
                        description: 'Why the full census was not served (null on a census). `census_exceeds_provider_limit` = the provider refused it (mega-caps); `census_timed_out`; `census_inconsistent_sum_exceeds_supply` = the census balances summed past the mint supply (or the supply could not be read), so it was refused (2026-10-02); `census_failed: <detail>` otherwise. `note` explains it in prose.'
                      note:
                        type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
