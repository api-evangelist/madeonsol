  /tokens/almost-bonded:
    get:
      tags:
      - Tokens
      summary: Almost-bonded pump.fun tokens (PRO+)
      description: 'Pre-bond pump.fun tokens approaching graduation, ranked by **velocity** (Δbonding-progress per minute) and enriched with **deployer reputation**. Differentiator: pre-bond + reputation + velocity in one feed — "95% and accelerating" beats "92% stalled".


        `progress_pct` is derived from on-chain `real_token_reserves` depletion. `velocity_pct_per_min` is null until a 5-minute snapshot exists; `eta_minutes` is a linear projection from current velocity. `stalled` flags tokens whose |velocity| is below 0.05 %/min. Already-bonded tokens are excluded (`is_bonded=false`, `max_progress` defaults to 99.99).'
      parameters:
      - name: min_progress
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 100
          default: 80
        description: Progress band floor (0-100).
      - name: max_progress
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 100
          default: 99.99
        description: Progress band ceiling (< 100; excludes bonded).
      - name: min_velocity_pct_per_min
        in: query
        schema:
          type: number
        description: Momentum filter — minimum Δprogress per minute. Tokens without a 5m snapshot drop out when set.
      - name: max_age_minutes
        in: query
        schema:
          type: integer
          minimum: 1
        description: Freshness — max minutes since deploy.
      - name: deployer_tier
        in: query
        schema:
          type: string
          enum:
          - elite
          - good
          - moderate
          - rising
          - cold
          - unranked
        description: Filter by deployer reputation tier.
      - name: launchpad
        in: query
        schema:
          type: string
          enum:
          - pumpfun
          - launchlab
        description: 'Restrict to one launchpad venue (default: both pump.fun and bonk/LetsBonk LaunchLab). No `bags` — its DBC curve has no progress decoder.'
      - name: authority_revoked
        in: query
        schema:
          type: boolean
        description: true = require both mint + freeze authority revoked.
      - name: min_liq
        in: query
        schema:
          type: number
          minimum: 0
        description: Minimum liquidity_usd.
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - velocity_desc
          - progress_desc
          - eta_asc
          default: velocity_desc
        description: '`velocity_desc` / `eta_asc` place unmeasured (null) tokens last.'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
            X-Read-Source:
              schema:
                type: string
                enum:
                - replica
                - core
                - cache
              description: 'Where this page was served from: the read replica, the primary (core) after a replica fallback, or the 8-second response cache.'
          description: 'OK. Returns `{ tokens[], filters, returned, note, coverage }`. Each token: `mint`, `symbol`, `name`, `launchpad` (`pumpfun` | `launchlab`), `progress_pct`, `velocity_pct_per_min`, `eta_minutes`, `stalled`, `real_sol_reserves`, `market_cap_usd`, `liquidity_usd`, `authorities_revoked`, `deployer_tier`, `age_minutes`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        mint:
                          type: string
                        symbol:
                          type: string
                          nullable: true
                        name:
                          type: string
                          nullable: true
                        launchpad:
                          type: string
                          enum:
                          - pumpfun
                          - launchlab
                        progress_pct:
                          type: number
                          nullable: true
                        velocity_pct_per_min:
                          type: number
                          nullable: true
                          description: Δprogress/min; null until a 5-minute-ago snapshot exists
                        eta_minutes:
                          type: number
                          nullable: true
                          description: Linear projection to 100% at the current velocity; null when velocity is null/non-positive
                        stalled:
                          type: boolean
                          nullable: true
                          description: true when |velocity| is below 0.05 %/min
                        real_sol_reserves:
                          type: number
                          nullable: true
                        market_cap_usd:
                          type: number
                          nullable: true
                        liquidity_usd:
                          type: number
                          nullable: true
                        authorities_revoked:
                          type: boolean
                        deployer_tier:
                          type: string
                          nullable: true
                        age_minutes:
                          type: integer
                          nullable: true
                          description: Minutes since deploy; null if the token has no pending_deploys row
                  filters:
                    type: object
                    properties:
                      min_progress:
                        type: number
                      max_progress:
                        type: number
                      min_velocity_pct_per_min:
                        type: number
                        nullable: true
                      max_age_minutes:
                        type: integer
                        nullable: true
                      deployer_tier:
                        type: string
                        nullable: true
                      launchpad:
                        type: string
                        nullable: true
                      authority_revoked:
                        type: boolean
                        nullable: true
                      min_liq:
                        type: number
                        nullable: true
                      sort:
                        type: string
                  returned:
                    type: integer
                  scan:
                    type: object
                    description: 'What the ranking covered (audit F09): complete=true means every candidate in the progress band was examined (or, for progress_desc, the top `limit` were found); scan_truncated=true means the budget ran out and velocity/eta ranks cover only the `scanned` most-progressed candidates.'
                    properties:
                      scanned:
                        type: integer
                      matched:
                        type: integer
                        nullable: true
                      complete:
                        type: boolean
                      scan_truncated:
                        type: boolean
                      scan_budget:
                        type: integer
                  note:
                    type: string
                  coverage:
                    $ref: '#/components/schemas/LaunchCoverage'
        '400':
          description: Invalid query parameters
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
