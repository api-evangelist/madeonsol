openapi: 3.2.0
info:
  title: MadeOnSol Tokens API
  version: 1.20.0
  description: Real-time Solana & Robinhood Chain trading intelligence — KOL wallet trades, deployer reputation, token buyer-quality scoring, wallet tracking, and copy-trade signals across both chains (Robinhood Chain paths under `/rhc/*`).
  contact:
    name: MadeOnSol
    url: https://madeonsol.com/contact
  license:
    name: Proprietary
    url: https://madeonsol.com/terms
servers:
- url: https://madeonsol.com/api/v1
  description: Production
security:
- BearerAuth: []
tags:
- name: Tokens
  description: Token-level buyer-quality, cap-table, and filtered token directory.
paths:
  /token/{mint}:
    get:
      tags:
      - Tokens
      summary: Comprehensive per-mint snapshot
      description: Price (VWAP from our DEX firehose), market cap, 24h volume + trade count, `liquidity_to_mc_ratio` (thinness gauge), `launchpad` of origin (`pumpfun`/`launchlab`/`bags`, null when unknown), `launch_cohort_sol` + `launch_cohort_size` (total SOL the first-20 buyers deployed — a heavily-bought open leans dump-prone), `name`/`symbol`, `image_url` + `socials` {website, twitter, telegram, discord} + `description` (from the token URI JSON, resolved within minutes of first trade; null until resolved), `twitter_reuse` {handle, mints_same_handle, mints_same_url} (how many OTHER mints reuse this X handle / exact URL — null = unknown, not zero), `early_buyer_exit` {cohort, still_holding, sold, still_holding_pct} (first-20 buyers still holding vs sold, from confirmed swaps), deployer reputation, KOL smart-money activity, `first_seen_at` + `age_seconds`, and `is_blacklisted` + `blacklist_category` — all in one call. **ULTRA** adds wallet addresses inside `kol_activity.top_buyers[]`. Available on every tier (a free taster of the snapshot data); the filterable `/tokens` directory and the `/tokens/{mint}/*` analytics are PRO/ULTRA.
      parameters:
      - name: include
        in: query
        schema:
          type: string
        description: 'Comma-separated: buyer_quality (embeds /tokens/{mint}/buyer-quality) and/or deployer (embeds /deployer-hunter/{deployer} as deployer_profile). Runs the sibling handler in-process and embeds its body under its own key; a failing include lands in include_errors and never fails the request; counts as ONE call. Unknown names are reported under include_errors.'
      - name: mint
        in: path
        required: true
        schema:
          type: string
          example: FfuWjhMm5LP3anZ5zq8SG4iqzYVvhM4LoyNMM957pump
        description: Solana base58 mint (32-44 chars). Tickers like `BTC`, `ETH`, `SOL` are rejected — use the wrapped-SOL mint `So11111111111111111111111111111111111111112` for SOL.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: object
                    properties:
                      mint:
                        type: string
                      name:
                        type: string
                        nullable: true
                      symbol:
                        type: string
                        nullable: true
                      image_url:
                        type: string
                        nullable: true
                        description: Off-chain metadata resolved from the token URI JSON; null until resolved
                      socials:
                        type: object
                        properties:
                          website:
                            type: string
                            nullable: true
                          twitter:
                            type: string
                            nullable: true
                          telegram:
                            type: string
                            nullable: true
                          discord:
                            type: string
                            nullable: true
                      twitter_reuse:
                        type: object
                        nullable: true
                        description: null = unknown (no twitter / socials unresolved), not zero
                        properties:
                          handle:
                            type: string
                            nullable: true
                          mints_same_handle:
                            type: integer
                          mints_same_url:
                            type: integer
                      description:
                        type: string
                        nullable: true
                      price_usd:
                        type: number
                        nullable: true
                      price_sol:
                        type: number
                        nullable: true
                      market_cap:
                        type: number
                        nullable: true
                      vwap_price_usd:
                        type: number
                        nullable: true
                      vwap_price_sol:
                        type: number
                        nullable: true
                      fdv_usd:
                        type: number
                        nullable: true
                      liquidity_usd:
                        type: number
                        nullable: true
                      liquidity_to_mc_ratio:
                        type: number
                        nullable: true
                      primary_dex:
                        type: string
                        nullable: true
                      launchpad:
                        type: string
                        nullable: true
                        enum:
                        - pumpfun
                        - launchlab
                        - bags
                        - null
                      primary_pool_address:
                        type: string
                        nullable: true
                      is_token_2022:
                        type: boolean
                        nullable: true
                        description: null = no mc-tracker observation (unknown), never false
                      transfer_fee_bps:
                        type: integer
                        nullable: true
                        description: null = unknown (no observation) — NOT "no fee"
                      mint_authority_revoked:
                        type: boolean
                        nullable: true
                      freeze_authority_revoked:
                        type: boolean
                        nullable: true
                      burn_detected:
                        type: boolean
                        nullable: true
                        description: 'DEPRECATED meaning: `true` when the token MINT''s on-chain supply decreased (a token burn, measured by mc-tracker''s supply-drift monitor). It is NOT LP-burn evidence and never means liquidity cannot be removed. null = no mc-tracker observation (unknown).'
                      token_supply_burn_detected:
                        type: boolean
                        nullable: true
                        description: The mint's supply decreased (token burn). Not LP evidence.
                      lp_burn_status:
                        type: string
                        enum:
                        - verified
                        - not_verified
                        - unknown
                        description: 'LP burn/lock evidence: `verified` only with measured LP-token custody (lp_burnt_pct ≥ 99). No Solana writer populates LP custody yet, so today every token is `unknown`. A token-supply burn is never promoted to an LP claim.'
                      volume_24h_usd:
                        type: number
                        nullable: true
                      volume_24h_sol:
                        type: number
                        nullable: true
                      trades_24h:
                        type: integer
                        nullable: true
                      price_source:
                        type: string
                        nullable: true
                        enum:
                        - mc_tracker
                        - dex_stream
                        - null
                        description: Which pipeline produced price_usd/price_sol; null when there is no price
                      price_observed_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: Last trade observed BY THE SELECTED price source — the price's own age anchor
                      price_age_seconds:
                        type: integer
                        nullable: true
                        description: Seconds since price_observed_at (null when the source carries no timestamp)
                      price_is_stale:
                        type: boolean
                        nullable: true
                        description: true when price_age_seconds > 900; null (unknown) when a price exists but its source has no observation time — never false without an observation; false when there is no price
                      last_trade_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: Newest trade observed by ANY source (mc-tracker or dex-stream). Not a price-age anchor — use price_observed_at
                      first_seen_at:
                        type: string
                        format: date-time
                        nullable: true
                      age_seconds:
                        type: integer
                        nullable: true
                      is_blacklisted:
                        type: boolean
                        nullable: true
                        description: null = the blacklist lookup failed (unknown) — never "not blacklisted"
                      blacklist_category:
                        type: string
                        nullable: true
                      launch_cohort_sol:
                        type: number
                        nullable: true
                        description: Total SOL the first-20 buyers deployed on their first buy
                      launch_cohort_size:
                        type: integer
                        nullable: true
                        description: null = the cohort lookup failed; 0 = no cohort rows
                      early_buyer_exit:
                        type: object
                        nullable: true
                        description: First-20 buyer cohort exit status from confirmed swaps; null when the cohort is unknown
                        properties:
                          cohort:
                            type: integer
                          still_holding:
                            type: integer
                          sold:
                            type: integer
                          still_holding_pct:
                            type: number
                      deployer:
                        type: object
                        nullable: true
                        description: Creator + live reputation. Resolved from `deployer_tokens` (bonded) or `pending_deploys` (not yet bonded — ~98% of fresh launches). null ⇒ read `deployer_identity` for why (unknown creator vs failed lookup). `history_status` other than `established` means the bonding rate is not a track record yet (a first launch is "0 of 1", not a serial dumper).
                        properties:
                          wallet:
                            type: string
                          address:
                            type: string
                            description: Same value as wallet (contract name)
                          tier:
                            type: string
                          bonding_rate:
                            type: number
                          total_deployed:
                            type: integer
                          total_bonded:
                            type: integer
                          recent_bond_rate:
                            type: number
                          identity_status:
                            type: string
                            enum:
                            - resolved
                          identity_source:
                            type: string
                            enum:
                            - deployer_tokens
                            - pending_deploys
                          history_status:
                            type: string
                            enum:
                            - new_in_our_index
                            - limited_history
                            - reputation_pending
                            - established
                          first_seen_at:
                            type: string
                            format: date-time
                            nullable: true
                            description: First deploy OBSERVED in our capture — not the wallet's first launch anywhere
                          observed_launch_count:
                            type: integer
                          resolved_outcome_count:
                            type: integer
                            description: Resolved outcomes (bonds + dumps) we hold for this creator
                          stats_computed_at:
                            type: string
                            format: date-time
                            nullable: true
                      deployer_identity:
                        type: object
                        description: 'Always present. Explains a null `deployer`: `unknown` = both lookups succeeded and found no creator; `lookup_failed` = a lookup errored (retry — NOT "no deployer").'
                        properties:
                          identity_status:
                            type: string
                            enum:
                            - resolved
                            - unknown
                            - lookup_failed
                          history_status:
                            type: string
                            nullable: true
                            enum:
                            - new_in_our_index
                            - limited_history
                            - reputation_pending
                            - established
                            - null
                          address:
                            type: string
                            nullable: true
                          source:
                            type: string
                            nullable: true
                            enum:
                            - deployer_tokens
                            - pending_deploys
                            - null
                      kol_activity:
                        type: object
                        description: 'Complete 7-day aggregate over every tracked-KOL trade (SQL, not a row sample). `status: unavailable` = the aggregate read failed: every figure is null, never zero/neutral.'
                        properties:
                          status:
                            type: string
                            enum:
                            - ok
                            - unavailable
                          buying_kols:
                            type: integer
                            nullable: true
                            description: Distinct KOL wallets with ≥1 buy in the window (exact)
                          selling_kols:
                            type: integer
                            nullable: true
                          net_flow_sol:
                            type: number
                            nullable: true
                          signal:
                            type: string
                            nullable: true
                            enum:
                            - accumulating
                            - distributing
                            - neutral
                            - null
                          top_buyers:
                            type: array
                            description: Largest KOL buyers by SOL bought over the whole window (≤ 10, complete ranking)
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                wallet:
                                  type: string
                                  description: ULTRA only
                                sol_amount:
                                  type: number
                          window_hours:
                            type: integer
                          window_start:
                            type: string
                            format: date-time
                            nullable: true
                          computed_at:
                            type: string
                            format: date-time
                            nullable: true
                          last_trade_at:
                            type: string
                            format: date-time
                            nullable: true
                          unique_kols:
                            type: integer
                            nullable: true
                          unique_wallets:
                            type: integer
                            nullable: true
                          buys:
                            type: integer
                            nullable: true
                          sells:
                            type: integer
                            nullable: true
                          buy_sol:
                            type: number
                            nullable: true
                          sell_sol:
                            type: number
                            nullable: true
                          counts_basis:
                            type: string
                            nullable: true
                            enum:
                            - complete_window
                            - null
                      data_status:
                        type: object
                        description: Per-block read status. `unavailable` = that lookup failed; its fields are null (unknown), never a neutral default like 0 KOLs or not-blacklisted.
                        properties:
                          market:
                            type: string
                            enum:
                            - ok
                            - unavailable
                          deployer:
                            type: string
                            enum:
                            - ok
                            - unavailable
                          kol_activity:
                            type: string
                            enum:
                            - ok
                            - unavailable
                          first_seen:
                            type: string
                            enum:
                            - ok
                            - unavailable
                          blacklist:
                            type: string
                            enum:
                            - ok
                            - unavailable
                          metadata:
                            type: string
                            enum:
                            - ok
                            - unavailable
                          launch_cohort:
                            type: string
                            enum:
                            - ok
                            - unavailable
                          sniper_footprint:
                            type: string
                            enum:
                            - ok
                            - unavailable
                          volume_candles:
                            type: string
                            enum:
                            - ok
                            - unavailable
                          twitter_reuse:
                            type: string
                            enum:
                            - ok
                            - unavailable
                      mc_change_pct:
                        type: object
                        nullable: true
                        description: 'Present only when history exists. Keys: 5m, 15m, 1h, 2h, 4h'
                        additionalProperties:
                          type: number
                          nullable: true
                      volume_usd:
                        type: object
                        nullable: true
                        description: 'Present only when history exists. Keys: 5m, 15m, 1h, 2h, 4h'
                        additionalProperties:
                          type: number
                      mev_volume_pct:
                        type: object
                        nullable: true
                        description: 'Present only when history exists. Keys: 5m, 15m, 1h, 2h, 4h'
                        additionalProperties:
                          type: number
                          nullable: true
                      history_age_seconds:
                        type: integer
                        nullable: true
                        description: Present only when history exists
                  as_of:
                    type: string
                    format: date-time
                    description: Snapshot assembly time — NOT the observation time of any field (see price_observed_at, kol_activity.computed_at, deployer.stats_computed_at)
                  buyer_quality:
                    type: object
                    description: Present when include=buyer_quality — see /tokens/{mint}/buyer-quality
                  deployer_profile:
                    type: object
                    description: Present when include=deployer — see /deployer-hunter/{wallet}
                  include_errors:
                    type: object
                    nullable: true
                    description: 'Per-key errors for requested includes that failed. include=deployer: 404 when the token has no known creator, 503 (retryable) when the creator lookup failed (deployer_identity.identity_status = lookup_failed)'
                  included:
                    type: array
                    items:
                      type: string
                    nullable: true
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '400':
          description: 'Invalid mint. Body includes `code: invalid_mint`, `reason` (specific cause), `received`, `received_length`, `expected_length`, `example`, and `docs` URL.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-madeonsol-tier: FREE
      x-badges:
      - name: FREE
        position: after
        color: '#64748b'
      operationId: getTokenByMint
      x-operation-id-source: derived
  /tokens:
    get:
      tags:
      - Tokens
      summary: Filtered token directory (PRO+)
      description: 'Browse tokens by market-cap band, liquidity floor, recent-activity window, primary DEX, authority/safety flags, computed 1h volume, MEV-share ceiling, and MC change. Momentum sorts surface movers (`mc_change_5m_desc`, `mc_change_1h_desc`, `volume_1h_desc`) and a composite `trending` board. Complements `/token/{mint}` (single lookup), `/tokens/almost-bonded` (pre-bond pump.fun), and the KOL-scoped `/kol/tokens/{hot,trending}`.


        **Default `min_liq` is 2000 USD** to filter the long tail of phantom-MC tokens from low-liquidity pools. Pass `min_liq=0` to opt out.


        **Default `max_mc` is 100,000,000,000 USD ($100B)** — a sanity ceiling that drops phantom market caps (a genuine ~1e12 token supply trading near $1, or a thin-pool price blow-up). No real tracked memecoin approaches it. Pass a higher explicit `max_mc` to opt out.


        **Momentum sorts + filters are DB-native** (via the `token_prices_trending` view): `min_volume_1h_usd`, `max_mev_share_pct`, `min_liq_mc_ratio`, `max_liq_mc_ratio`, `mc_change_1h_min_pct`, `mc_change_1h_max_pct` and the momentum sorts paginate correctly with no over-fetch. The `trending` sort = recent-volume × positive-momentum composite, recency-bounded to the last 1h, and echoes `filters.trending_version: "v1"`.


        **Only `deployer_tier` and `launchpad`** remain post-filters (joined from `deployer_tokens`, not the view). They are served by a bounded SCAN: candidates are walked in pages until `limit` matches, the candidates run out, or the scan budget is spent. `has_more:false` only when the candidates ran out; `pagination.scan_truncated:true` = the budget ran out first and more matches MAY exist — continue with `offset = pagination.next_offset` (a RAW candidate offset, not a match count). Offset pages walk a LIVE order (`pagination.order_is_live: true`): MC and activity move between calls, so rows can shift across pages — treat the screener as a ranking, not a ledger.


        **LP burn (2026-09-21):** `lp_burned` / `lp_burn_status` come from LP-custody evidence only (`lp_burnt_pct`). No Solana writer populates it yet, so `lp_burn_status` is `unknown` and `lp_burned` null for every token, and `lp_burned=true|false` currently matches nothing. `lp_burned` is DEPRECATED: `true` = verified burned/locked, `false` = verified NOT burned, and a token with unknown LP custody matches neither (false never turns unknown into "unburned"); a request that sends it gets a `deprecations` entry. The old `lp_burned` flag was the token-SUPPLY burn — filter that with `supply_burn` and read it as `token_supply_burn_detected`.'
      parameters:
      - name: min_mc
        in: query
        schema:
          type: number
          minimum: 0
        description: Minimum market_cap_usd
      - name: max_mc
        in: query
        schema:
          type: number
          minimum: 0
          default: 100000000000
        description: Maximum market_cap_usd. Default 100000000000 ($100B) — pass a higher value to surface phantom thin-pool caps.
      - name: min_liq
        in: query
        schema:
          type: number
          minimum: 0
          default: 2000
        description: Minimum liquidity_usd. Default 2000 — set 0 to disable.
      - name: active_h
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 8760
          default: 168
        description: Only tokens with a trade within the last N hours. Default 168 (7 d) — a screener ranks what is tradeable; 0 = no freshness bound (not applied to sort=trending, which has its own 1 h window)
      - name: primary_dex
        in: query
        schema:
          type: string
          enum:
          - pumpfun
          - pumpswap
          - raydium
          - meteora
          - orca
          - raydium_clmm
          - launchlab
        description: Filter by primary trading venue (`launchlab` = on-curve bonk/LetsBonk tokens)
      - name: deployer_tier
        in: query
        schema:
          type: string
          enum:
          - elite
          - good
          - moderate
          - rising
          - cold
          - unranked
        description: Filter to pump.fun tokens whose deployer carries this reputation tier (post-filter; non-pump tokens have a null tier and are dropped)
      - name: launchpad
        in: query
        schema:
          type: string
          enum:
          - pumpfun
          - launchlab
          - bags
        description: 'Filter by launchpad of origin (post-filter, from `deployer_tokens.launchpad`). Distinct from `primary_dex`: bags tokens trade on meteora, so only this tag identifies them.'
      - name: authority_revoked
        in: query
        schema:
          type: boolean
        description: true = require both mint + freeze authority revoked; false = at least one not revoked
      - name: exclude_token2022
        in: query
        schema:
          type: boolean
          default: false
        description: Drop Token-2022 mints (commonly used for transfer-fee scams)
      - name: lp_burned
        in: query
        deprecated: true
        schema:
          type: boolean
        description: 'DEPRECATED — use `lp_burn_status` on each token, or `supply_burn` for the token-supply burn flag. Filter on VERIFIED LP-burn evidence only: `true` = lp_burnt_pct ≥ 99; `false` = lp_burnt_pct measured AND below it. A token with unknown LP custody matches NEITHER value (false never means "unknown"). Sending it adds a `deprecations` entry to the response. No writer populates LP evidence yet, so this matches no token today — it never matches a token-supply burn (use `supply_burn`). See `filters.lp_burned_source`.'
      - name: supply_burn
        in: query
        schema:
          type: boolean
        description: Filter on the token-SUPPLY burn flag (the mint's on-chain supply decreased). This is what `lp_burned` used to filter on; it is not LP evidence.
      - name: min_volume_1h_usd
        in: query
        schema:
          type: number
          minimum: 0
        description: Computed organic-volume floor in the last 1 hour (DB-native; tokens with insufficient history are dropped)
      - name: max_mev_share_pct
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 100
        description: Computed MEV/bot volume ceiling as a % of total cumulative volume (DB-native)
      - name: min_liq_mc_ratio
        in: query
        schema:
          type: number
          minimum: 0
          default: 2.0e-05
        description: Minimum liquidity_to_mc_ratio (liquidity ÷ market cap). Default 0.00002 (= MC at most 50,000× pool liquidity) — a plausibility gate against price × nominal-supply blowups off dust pools; pass 0 to opt out. Low values = thin liquidity relative to MC (DB-native)
      - name: max_liq_mc_ratio
        in: query
        schema:
          type: number
          minimum: 0
        description: Maximum liquidity_to_mc_ratio — drops over-collateralised thin-MC tokens (DB-native)
      - name: mc_change_1h_min_pct
        in: query
        schema:
          type: number
        description: Minimum 1h MC change % (DB-native; use for momentum scans)
      - name: mc_change_1h_max_pct
        in: query
        schema:
          type: number
        description: Maximum 1h MC change % (DB-native; use for dip scans)
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - mc_desc
          - mc_asc
          - last_trade_desc
          - liquidity_desc
          - cumulative_volume_desc
          - mc_change_5m_desc
          - mc_change_1h_desc
          - volume_1h_desc
          - trending
          default: mc_desc
        description: '`trending` = recent-volume × positive-momentum composite, recency-bounded to the last 1h; echoes `filters.trending_version: "v1"`.'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      responses:
        '200':
          description: 'OK. Returns `tokens[]` (with `liquidity_to_mc_ratio`, `deployer_tier`, `launchpad` (`pumpfun`/`launchlab`/`bags`, null when unknown), `mev_share_pct`, `organic_volume_1h_usd`, `mc_change_5m_pct`, `mc_change_1h_pct`, `is_token_2022`, `authorities_revoked`, etc.), `pagination` (with `post_filtered` flag), and a `filters` echo (with `min_liq_default_applied`; `trending_version: "v1"` when `sort=trending`).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        mint:
                          type: string
                        symbol:
                          type: string
                          nullable: true
                        name:
                          type: string
                          nullable: true
