      description: Upcoming **unlock events** across all active lock / vesting contracts inside a window — cliffs, periodic releases (hourly or coarser) and final unlocks — i.e. *which tokens have locked supply hitting the market this week, how much, from whose lock*. One entry per active contract = its **next** unlock event in the window ('event' = cliff | period | final | tranche), plus 'window_amount_*' = that contract's total release over the whole window. Continuous per-second streams (Streamflow payroll) contribute only their cliff/final events. Sort by soonest (default), largest_usd or largest_pct; filter by mint / program / kind / min_usd / min_pct_of_supply. PRO+.
