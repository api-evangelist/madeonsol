      description: 'Every **on-chain token lock / vesting contract** on a mint — Streamflow streams, Jupiter Lock vesting escrows and Bonfida token-vesting accounts, plus Smithii vesting and Sablier Lockup streams while they are listed in ''meta.programs'' (rows are admitted only after per-account verification; Sablier''s ''recipient'' is the current proven stream-NFT holder or null, see ''holder_status'') — decoded from the locker programs'' account state (Yellowstone account subscription + daily getProgramAccounts reconciliation, mig 326). Each contract carries the schedule (start / cliff / period / end, cliff and per-period amounts), the terms (cancelable by sender/recipient, transferable, top-up) and a **live-derived** view computed at request time: what is still locked right now, what has unlocked, what is claimable, and the ''next_unlock'' event. The ''summary'' rolls up locked / deposited totals (raw, ui, usd, % of supply), the **7d / 30d forward unlock schedule**, the nearest next unlock across all contracts, distinct lockers and how many active contracts the sender can still cancel. Answers *did the team lock, how much, until when, and can they pull it*. **LP locks are not included** (this is token/vesting locks). Amounts are base-unit strings; ui/usd/pct are null when decimals/price are unknown (''token.facts_resolved''). PRO+.'
