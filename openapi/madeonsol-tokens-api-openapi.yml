  /tokens/{mint}/trades:
    get:
      tags:
      - Tokens
      summary: Mint-scoped trade tape (cursor-paginated raw trades)
      description: 'Every captured trade for one token, newest first — the backfill complement to the live firehose (seed history, then keep current via the stream). Per trade: tx_signature, wallet_address, action, sol_amount, token_amount, price_sol/price_usd, market_price_sol/market_price_usd, early_buyer_rank, slot, block_time.


        **Two different prices, on purpose.** `price_sol` is *this trade''s executed price* — `sol_amount / token_amount`, so it reconciles exactly with the amounts on the same row and with the PnL endpoints. `sol_amount` is the wallet''s net SOL movement, so that price is the trader''s all-in effective rate: it includes the swap fee and any account rent paid in the same transaction, and it is not the pool mid. `market_price_sol` is our market-cap tracker''s canonical pool price sampled near that trade''s slot — one value per token per update, so every trade in the same slot shares it. Use `price_sol` for cost basis, fills and PnL; use `market_price_sol` when you want a per-token price series independent of trade size and direction.


        *Changed 2026-08-16*: `price_sol`/`price_usd` previously carried the canonical value, which disagreed with the row''s own amounts by a 7.9% median (and far more on fast-moving mints, where one slot can span a 60% price swing). The canonical number did not disappear — it moved to `market_price_*`.


        **Coverage honesty**: capture starts 2026-04-12 and is pump.fun-pipeline scoped — the `coverage` response object carries both markers. **Size floor**: Buys under 0.05 SOL (under $3.50 when paid in USDC/USDT) are not stored; sells that receive SOL are kept at any size. (`coverage.size_floor`). Default window is full history. PRO+.


        **Where the rows come from** (*added 2026-08-29*): closed months older than the newest three move from Postgres to a Parquet archive; pages are split at `history.postgres_from` (Unix seconds) — rows at/after it are served from Postgres, older rows from the archive reader — with the same ordering and cursor. `history.archive_used` says whether this page touched the archive (`archive_months` lists which), `history.archive_available` whether the archive could be reached (`null` = not configured), and `history.truncated: true` means older history was requested but the archive did not answer — retry later rather than treating `has_more:false` as the end of the tape. Response header `X-Read-Source`: `core`, `core+archive` or `archive`.'
      parameters:
      - name: mint
        in: path
        required: true
        schema:
          type: string
          example: FfuWjhMm5LP3anZ5zq8SG4iqzYVvhM4LoyNMM957pump
        description: Solana token mint address
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque pagination cursor from next_cursor
      - name: action
        in: query
        schema:
          type: string
          enum:
          - buy
          - sell
      - name: wallet
        in: query
        schema:
          type: string
        description: Filter to one wallet's trades on this token
      - name: since
        in: query
        schema:
          type: integer
        description: 'Unix seconds lower bound (default: full history)'
      - name: until
        in: query
        schema:
          type: integer
        description: 'Unix seconds upper bound (default: now)'
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
            X-Read-Source:
              schema:
                type: string
                enum:
                - core
                - core+archive
                - archive
              description: 'Where this page''s rows came from: Postgres only, Postgres plus the Parquet archive (page straddles `history.postgres_from`), or the archive only.'
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mint:
                    type: string
                  trades:
                    type: array
                    items:
                      type: object
                      properties:
                        tx_signature:
                          type: string
                        wallet_address:
                          type: string
                        action:
                          type: string
                          enum:
                          - buy
                          - sell
                        sol_amount:
                          type: number
                        token_amount:
                          type: number
                        price_sol:
                          type: number
                          nullable: true
                          description: This trade's executed price (sol_amount / token_amount)
                        price_usd:
                          type: number
                          nullable: true
                        market_price_sol:
                          type: number
                          nullable: true
                          description: mc-tracker's canonical pool price sampled near this trade's slot — not this trade's price
                        market_price_usd:
                          type: number
                          nullable: true
                        early_buyer_rank:
                          type: integer
                          nullable: true
                        slot:
                          type: integer
                          nullable: true
                        block_time:
                          type: integer
                          description: Unix seconds
                        traded_at:
                          type: string
                          format: date-time
                  next_cursor:
                    type: string
                    nullable: true
                  has_more:
                    type: boolean
                  filters:
                    type: object
                    properties:
                      action:
                        type: string
                        nullable: true
                        enum:
                        - buy
                        - sell
                        - null
                      wallet:
                        type: string
                        nullable: true
                      since:
                        type: integer
                      until:
                        type: integer
                  history:
                    type: object
                    description: Postgres/archive split for this page (added 2026-08-29)
                    properties:
                      postgres_from:
                        type: integer
                        description: Unix seconds — rows at/after this come from Postgres, older from the archive
                      archive_used:
                        type: boolean
                      archive_months:
                        type: array
                        items:
                          type: string
                      archive_available:
                        type: boolean
                        nullable: true
                        description: null = archive reader not configured
                      truncated:
                        type: boolean
                        description: true = older history was requested but the archive did not answer — do not treat has_more:false as the end of the tape
                      note:
                        type: string
                        description: Present when the archive could not be reached or is not configured
                  coverage:
                    $ref: '#/components/schemas/TradeCoverage'
        '400':
          description: Invalid mint or params
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: getTokensByMintTrades
      x-operation-id-source: derived
  /tokens/{mint}/candles:
    get:
      tags:
      - Tokens
      summary: OHLCV candles for a token
      description: 'Open/high/low/close + volume candles aggregated from the 1-minute base series. PRO gets all timeframes with the last 30 days of history measured from now (`history_floor`): a window entirely older returns 200 with zero candles and `history_outside_plan: true`, a partly older one is clamped (`history_clamped: true`). ULTRA (and BUSINESS) adds net-flow/liquidity fields and full retained history. This tier split applies to Solana candles only; RHC candles are full-history on PRO+. Windows over 999 buckets are paged newest-first on the timeframe grid; `truncated` reports a page budget that ran out.'
      parameters:
      - name: mint
        in: path
        required: true
        schema:
          type: string
          example: FfuWjhMm5LP3anZ5zq8SG4iqzYVvhM4LoyNMM957pump
        description: Solana token mint address
      - name: tf
        in: query
        schema:
          type: string
          enum:
          - 1m
          - 5m
          - 15m
          - 1h
          - 4h
          - 1d
          default: 1h
        description: Candle timeframe. Also accepted as `timeframe`; `tf` wins if both are sent.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1500
          default: 200
        description: Max candles to return (1500 = one full day of 1m bars with margin)
      - name: from
        in: query
        schema:
          type: string
          format: date-time
        description: 'ISO8601 window start, inclusive (defaults to limit×tf back). PRO: floored at now minus 30 days'
      - name: to
        in: query
        schema:
          type: string
          format: date-time
        description: ISO8601 window end, exclusive (defaults to now)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mint:
                    type: string
                  timeframe:
                    type: string
                    enum:
                    - 1m
                    - 5m
                    - 15m
                    - 1h
                    - 4h
                    - 1d
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  count:
                    type: integer
                  net_flow_included:
                    type: boolean
                    description: true on ULTRA — signals whether the net-flow/liquidity fields below are present
                  truncated:
                    type: boolean
                    description: true when the 3-page budget (up to 999 buckets each) ran out before `limit` candles or `from` were reached
                  covered_from:
                    type: string
                    format: date-time
                    description: Oldest instant actually searched; equals `from` when the whole window was scanned
                  history_floor:
                    type: string
                    format: date-time
                    nullable: true
                    description: 'PRO: now minus 30 days, rounded up to the tf grid (oldest bucket served). null on ULTRA/BUSINESS (no floor)'
                  history_clamped:
                    type: boolean
                    description: 'PRO: part of the requested window was older than history_floor and was cut; `from` echoes the clamped start'
                  history_outside_plan:
                    type: boolean
                    description: 'PRO: the whole requested window is older than history_floor, so 200 with zero candles'
                  candles:
                    type: array
                    items:
                      type: object
                      properties:
                        t:
                          type: string
                          description: Bucket start (ISO timestamp as returned by the OHLC rollup)
                        open:
