      summary: pump.fun fee-claim feed (distributions to shareholders, social-handle claims…
      description: 'Every decoded pump.fun fee event, newest first: **distribution** (creator fees paid out pro-rata to the SharingConfig shareholders — fees redirected to others — with payouts[] per address), **social_claim** (fees earmarked for a platform identity — platform 2 = X, user_id = the platform-native numeric id — claimed to a recipient wallet), **shares_created / shares_updated / shares_reset** (config changes), **creator_transferred** (creator role moved), **creator_claim** (the plain creator vault claim — per creator, no mint; excluded unless requested), and **holder_distribution** (pump.fun DistributeFeeToHolders — creator fees airdropped pro-rata to the coin''s token holders; amount = the total, payload.recipients = holder count; excluded unless requested, not pushed on WS; history from 2026-09-13 is retained, archive policy pending). Default 100%-to-creator configs and zero-amount distributions are not stored. Poll with since= (cursor = pagination.next_since) or subscribe to WS channel token:fee_claims. History starts 2026-08-17. PRO+.'
