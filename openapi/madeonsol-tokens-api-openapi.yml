  /tokens/{mint}/risk:
    get:
      tags:
      - Tokens
      summary: Token risk / safety score
      description: 'Transparent 0–100 rug-risk score (higher = riskier) with a per-factor breakdown — mint/freeze authority, liquidity depth & thinness, Token-2022 transfer fee, LP burn, bundled/sniped open, deployer track record, KOL distribution, supply inflation (on-chain supply grown above expected = stealth-mint/dilution), and blacklist. Composed from the same data layer as `GET /token/{mint}` (no extra latency). Returns `band` (safe/caution/danger), `factors[]` (each with `status` + `points` + `detail`), and the raw `inputs` (including `supply_inflation_pct` and `sniper_footprint`). The top-level `dev` block (nullable) is the deployer self-activity read: create-tx self-buy (`buy_sol`/`buy_tokens`/`buy_supply_pct`), post-create own-mint trading (`bought_tokens_after`, `sold_tokens`, `sold_sol`, `first_sell_at`/`last_sell_at`), and live on-chain holdings (`holdings_tokens`, `holdings_supply_pct`, `wallet_empty`), each with its own observation time (`holdings_observed_at`, `activity_rollup_through`), plus `transfer_status` (`none_detected` | `suspected` | `unknown`): a balance below what the dev''s own recorded trades explain is only ever SUSPECTED (a sell on an uncaptured venue looks identical), and misaligned or missing observations are `unknown`; `transferred_out` is its deprecated boolean view. Carries `score_version` (now `v2`) and `as_of` (response time — not an observation time).


        **Score v2 (2026-09-21):** the LP factor no longer credits a token-SUPPLY burn (mc-tracker''s burn flag) — LP custody is not observed for Solana pools, so `lp_burn` is warn/8 with `inputs.lp_burn_status: unknown` unless verified LP evidence exists; an unknown transfer fee is warn/4, not "No transfer fee"; deployer reputation scores only an established history. `assessment` says whether every input was observed: `incomplete` lists `unknown_inputs` and the band is never `safe`; a failed lookup of a score-critical input is a retryable 503 (`code: risk_inputs_unavailable`), never a score computed without it. **Same loader on every transport:** `POST /tokens/batch/risk` and x402 return identical scores for identical evidence; batch skips only the live dev-holdings RPC (`dev.holdings_*` null, `transfer_status: unknown`). The `coverage` object (shared TradeCoverage shape) discloses whether the mint sits inside the launchpad trade capture, with a note naming which sub-fields are trade-derived (cohort/sniper/bundle factors, dev sell rollup) vs pure on-chain reads (authorities, liquidity, live holdings) that are unaffected. PRO+.'
      parameters:
      - name: mint
        in: path
        required: true
        schema:
          type: string
          example: FfuWjhMm5LP3anZ5zq8SG4iqzYVvhM4LoyNMM957pump
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolved_from:
                    type: object
                    description: Present only when the path address was a liquidity pool that we resolved to its token mint (2026-09-05). Absent otherwise.
                    properties:
                      address:
                        type: string
                        description: The pool address you sent.
                      kind:
                        type: string
                        enum:
                        - pool
                      dex:
                        type: string
                        example: pumpswap
                      source:
                        type: string
                        enum:
                        - token_pools
                        - chain
                        description: 'How the pool was resolved: from our pool index, or decoded live on-chain (PumpSwap).'
                  mint:
                    type: string
                    description: The mint scored. Equals the path value unless the path was a PumpSwap pool address, in which case this is the pool's resolved mint and `resolved_from` is set.
                  risk_score:
                    type: integer
                    minimum: 0
                    maximum: 100
                  band:
                    type: string
                    enum:
                    - safe
                    - caution
                    - danger
                    description: Never `safe` while assessment.status is `incomplete`, or with an un-revoked mint/freeze authority
                  score_version:
                    type: string
                    enum:
                    - v2
                    description: 'v2 (2026-09-21): a token-supply burn no longer earns the LP-burn credit (v1: burn_detected=true → 0, every other token → 8; v2: every token without verified LP evidence → 8, burned or not — no burn penalty); unknown transfer fee is warn(4) not "No transfer fee"; deployer reputation scores only an established history; unknown inputs keep the band off `safe`.'
                  factors:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        label:
                          type: string
                        status:
                          type: string
                          enum:
                          - ok
                          - warn
                          - danger
                          - unknown
                          - not_assessed
                          description: ok/warn/danger = evidence read and scored. unknown = the input should exist but could not be read or is insufficient (0 points; listed in assessment.unknown_inputs; band never safe). not_assessed = no evidence source applies to this token (0 points; listed in assessment.not_assessed). Neither is ever positive evidence.
                        points:
                          type: integer
                        detail:
                          type: string
                  inputs:
                    type: object
                    description: Every scorer input. Enrichment fields are null when unobserved — unknown, not false/0.
                    properties:
                      mint_authority_revoked:
                        type: boolean
                        nullable: true
                      freeze_authority_revoked:
                        type: boolean
                        nullable: true
                      liquidity_usd:
                        type: number
                        nullable: true
                      liquidity_to_mc_ratio:
                        type: number
                        nullable: true
                      transfer_fee_bps:
                        type: integer
                        nullable: true
                      is_token_2022:
                        type: boolean
                        nullable: true
                      token_supply_burn_detected:
                        type: boolean
                        nullable: true
                        description: The mint's supply decreased (token burn). Not LP evidence.
                      burn_detected:
                        type: boolean
                        nullable: true
                        description: DEPRECATED alias of token_supply_burn_detected
                      lp_burn_status:
                        type: string
                        enum:
                        - verified
                        - not_verified
                        - unknown
                        description: 'LP burn/lock evidence: `verified` only with measured LP-token custody (lp_burnt_pct ≥ 99). No Solana writer populates LP custody yet, so today every token is `unknown`. A token-supply burn is never promoted to an LP claim.'
                      launch_cohort_sol:
                        type: number
                        nullable: true
                      launch_cohort_size:
                        type: integer
                        nullable: true
                      sniper_footprint:
                        type: object
                        nullable: true
                      deployer_bonding_rate:
                        type: number
                        nullable: true
                      deployer_total_deployed:
                        type: integer
                        nullable: true
                      deployer_history_status:
                        type: string
                        nullable: true
                        enum:
                        - new_in_our_index
                        - limited_history
                        - reputation_pending
                        - established
                        - null
                        description: null when there is no deployer
                      deployer_reputation_scored:
                        type: boolean
                        description: Whether the bonding rate moved the score (established history only)
                      liquidity_observed_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: When the liquidity figure was last observed (mc-tracker last trade). With the creator not assessed, band safe requires this within the last 6 h (null or more than 5 min in the future = not fresh). 6 h is a policy threshold, not proof that the liquidity is still there.
                      kol_signal:
                        type: string
                        nullable: true
                      is_blacklisted:
                        type: boolean
                        nullable: true
                      supply_inflation_pct:
                        type: number
                        nullable: true
                  assessment:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                        - complete
                        - incomplete
                        description: incomplete = at least one score input is unknown; the score is a lower bound
                      unknown_inputs:
                        type: array
                        items:
                          type: string
                        description: Inputs not observed for this token (e.g. transfer_fee, mint_authority, liquidity, kol_activity, deployer_reputation, blacklist, supply_inflation, launch_cohort). deployer_reputation is unknown when a creator lookup failed, when a LAUNCHPAD mint's creator was not recorded (a coverage gap), or when a known creator has no established history.
                      explanations:
                        type: object
                        additionalProperties:
                          type: string
                        description: Why each unknown / not-assessed input is listed, keyed by input name, plus band_cap when the band was capped (creator not assessed and liquidity / liquidity-to-MC not both ok, or the liquidity figure older than 6 h — a policy threshold, not proof of safety). Missing required creator information never yields band safe, for any token.
                      not_assessed:
                        type: array
                        items:
                          type: string
                        description: 'Dimensions not measured for this token that are NOT a failed lookup: lp_custody (never observed for Solana pools) and deployer_reputation only when the token has no launchpad origin in our capture (no deploy row, no bonding-curve pool, not PumpSwap-primary, no pump/bonk/BAGS vanity suffix). A launchpad mint with an unrecorded creator, or a failed origin lookup, is an unknown input instead.'
                  dev_status:
                    type: string
                    enum:
                    - ok
                    - not_found
                    - unavailable
                    description: ok = dev block present · not_found = no pending_deploys row (not a launchpad deploy we saw) · unavailable = the lookup failed
                  dev:
                    type: object
                    nullable: true
                    description: Dev-wallet activity (migration 225). Trade-derived fields are accurate THROUGH activity_rollup_through; holdings are observed at holdings_observed_at — never at as_of.
                    properties:
                      wallet:
                        type: string
                        nullable: true
                      launchpad:
                        type: string
                        nullable: true
                      deployed_at:
                        type: string
                        format: date-time
                        nullable: true
                      buy_sol:
                        type: number
                        nullable: true
                      buy_tokens:
                        type: number
                        nullable: true
                      buy_supply_pct:
                        type: number
                        nullable: true
                      bought_tokens_after:
                        type: number
                        nullable: true
                      sold_tokens:
                        type: number
                        nullable: true
                      sold_sol:
                        type: number
                        nullable: true
                      first_sell_at:
                        type: string
                        format: date-time
                        nullable: true
                      last_sell_at:
                        type: string
                        format: date-time
                        nullable: true
                      holdings_tokens:
                        type: number
                        nullable: true
                        description: Live on-chain balance (60 s cache); null = RPC unavailable or not checked (batch)
                      holdings_supply_pct:
                        type: number
                        nullable: true
                      wallet_empty:
                        type: boolean
                        nullable: true
                      holdings_observed_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: When the RPC balance was observed (cache fetch time)
                      activity_rollup_through:
                        type: string
                        format: date-time
                        nullable: true
                        description: Dev trades are rolled up through this time (dev_activity cursor)
                      activity_rollup_ran_at:
                        type: string
                        format: date-time
                        nullable: true
                      expected_tokens_from_trades:
                        type: number
                        nullable: true
                        description: Balance the dev's own recorded trades explain, aligned to holdings_observed_at
                      transfer_status:
                        type: string
                        enum:
                        - none_detected
                        - suspected
                        - unknown
                        description: suspected = balance below what recorded trades explain (a sell on an uncaptured venue looks identical) — never a verified transfer; unknown = observations misaligned, rollup stale, no coverage, or holdings not checked
                      transfer_reason:
                        type: string
                      transferred_out:
