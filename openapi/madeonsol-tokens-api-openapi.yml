  /tokens/search:
    get:
      tags:
      - Tokens
      summary: Resolve a ticker or name to candidate mints
      description: 'Search our token universe by **symbol or name** and get back candidate mints ranked so the right one is first: exact ticker match, then symbol prefix, then name prefix, then fuzzy — and *inside* each tier by liquidity, so `bonk` returns the $2M-liquidity Bonk before ten thousand squats named BONK. Each result carries `market_cap_usd`, `liquidity_usd`, `primary_dex` and `last_trade_at` so you can disambiguate in one hop and pass the `mint` on to `/token/{mint}` and friends.


        **Why this exists (2026-08-16):** 73% of all API 400s were tickers sent to mint routes (`/token/SOL`, `/token/WORLDCUP`). Those routes now answer a ticker with `code: ticker_not_mint` and a `search_url` pointing here.


        **Honesty:** this searches the memecoin/launchpad universe our market-cap tracker has seen (pump.fun, PumpSwap, LaunchLab/bonk, Raydium, Meteora, Orca). Native SOL and blue-chips are deliberately not in it — `q=SOL` returns tokens *named* SOL and the response says so in `note`. Any authenticated key, including Free.'
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          example: bonk
        description: Ticker or name fragment. 1 char matches exact symbol only; 2+ enables symbol prefix; 3+ name prefix; 4+ fuzzy.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  q:
                    type: string
                  count:
                    type: integer
                  note:
                    type: string
                    nullable: true
                    description: Present when q is a blue-chip ticker (results are namesakes) or when nothing matched.
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        mint:
                          type: string
                        symbol:
                          type: string
                          nullable: true
                        name:
                          type: string
                          nullable: true
                        match:
                          type: string
                          enum:
                          - symbol_exact
                          - symbol_prefix
                          - name_prefix
                          - fuzzy
                        market_cap_usd:
                          type: number
                          nullable: true
                        liquidity_usd:
                          type: number
                          nullable: true
                        primary_dex:
                          type: string
                          nullable: true
                        last_trade_at:
                          type: string
                          format: date-time
                          nullable: true
                        image_url:
                          type: string
                          nullable: true
                          description: From token_metadata; null when not known.
                        twitter:
                          type: string
                          nullable: true
                          description: From token_metadata; null when not known.
                        website:
                          type: string
                          nullable: true
                          description: From token_metadata; null when not known.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '400':
          description: Missing/invalid q or limit
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
