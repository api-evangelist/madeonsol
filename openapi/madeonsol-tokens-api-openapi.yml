  /tokens/{mint}/depth:
    get:
      tags:
      - Tokens
      summary: Token depth / price impact (per pool)
      description: 'Per-pool **price-impact / slippage** — "how much SOL to move price N%" and the impact + tokens received for each buy size. For every pool: `spot_price_sol`, `quotes[]` per requested SOL size (`tokens_out`, `avg_price_sol`, `price_impact_pct`), and `to_move_price` (SOL to move price 1%/5%/10%). Exact for constant-product AMMs (PumpSwap, Raydium v4/CPMM, Meteora DAMM — served from streamed reserves, `source: "stream"`); pump.fun / bonk bonding curves priced from one live read of the curve''s virtual reserves (`source: "live_rpc"`). Impact is per-pool, not router-optimal; concentrated-liquidity pools (Raydium CLMM, Orca, Meteora DLMM) and unclassified pools return under `unsupported_pools[]` with a `reason` instead of a wrong number. PRO+.'
      parameters:
      - name: mint
        in: path
        required: true
        schema:
          type: string
          example: FfuWjhMm5LP3anZ5zq8SG4iqzYVvhM4LoyNMM957pump
      - name: sizes
        in: query
        required: false
        schema:
          type: string
          example: 0.5,1,5,10
        description: Comma-separated SOL buy sizes to quote (max 8, each >0 and ≤10000). Default 0.5,1,5,10.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mint:
                    type: string
                  found:
                    type: boolean
                    description: false = no depth-computable pool (pools may still appear in unsupported_pools)
                  sol_usd:
                    type: number
                    nullable: true
                  sizes_sol:
                    type: array
                    items:
                      type: number
                  primary_pool:
                    type: string
                    nullable: true
                    description: Deepest depth-available pool
                  pools:
                    type: array
                    items:
                      type: object
                      properties:
                        pool_address:
                          type: string
                        dex:
                          type: string
                        quote_mint:
                          type: string
                        pool_model:
                          type: string
                          description: constant_product | curve
                        liquidity_usd:
                          type: number
                          nullable: true
                        is_active:
                          type: boolean
                        depth_available:
                          type: boolean
                        model:
                          type: string
                        fee_pct:
                          type: number
                        source:
                          type: string
                          description: stream (DB reserves) | live_rpc (curve virtual reserves)
                        reserves_age_ms:
                          type: number
                        spot_price_sol:
                          type: number
                        quotes:
                          type: array
                          items:
                            type: object
                            properties:
                              size_sol:
                                type: number
                              tokens_out:
                                type: number
                              avg_price_sol:
                                type: number
                              price_impact_pct:
                                type: number
                        to_move_price:
                          type: object
                          properties:
                            1pct:
                              type: number
                              description: SOL to move price +1%
                            5pct:
                              type: number
                            10pct:
                              type: number
                  universe:
                    type: object
                    description: Only the deepest max_pools pools by stored liquidity are evaluated (audit F19); pools past that cut are not listed. truncated=true = the cut dropped pools.
                    properties:
                      kind:
                        type: string
                        enum:
                        - top_by_liquidity
                      max_pools:
                        type: integer
                      evaluated:
                        type: integer
                      truncated:
                        type: boolean
                  unsupported_pools:
                    type: array
                    items:
                      type: object
                      properties:
                        pool_address:
                          type: string
                        dex:
                          type: string
                        quote_mint:
                          type: string
                        pool_model:
                          type: string
                          nullable: true
                        liquidity_usd:
                          type: number
                          nullable: true
                        is_active:
                          type: boolean
                        reason:
                          type: string
                          description: e.g. concentrated_liquidity_depth_not_supported, pool_model_unknown, curve_graduated_use_amm_pool, reserves_unavailable
                  note:
                    type: string
          headers:
            X-Request-Id:
