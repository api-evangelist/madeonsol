  /rhc/wallet/{address}:
    get:
      tags:
      - Robinhood Chain
      summary: Wallet profile on Robinhood Chain (PRO+)
      description: 'Any Robinhood Chain wallet''s 90-day trading profile: FIFO cost-basis PnL, per-token breakdown, recent trades, and a reputation block (tracked KOL, known deployer + tier, alpha-ranked, dump-cluster membership, early-buyer count).


        **Denomination is ETH**, matching the rest of the RHC tree (`eth_amount`, `net_eth`) — not USD. A USD cost basis would silently mix in the tokenized-stock quote assets some flap bonding curves price in.


        **Sourced from `trader_eoa` — the effective trading account, never the swap-log `trader`**, which is the router address on any aggregated swap.


        `stats.analyzed_trades + stats.unattributed_trades + stats.unsized_trades === stats.total_trades` always holds — no trade silently vanishes from the accounting. The two exclusions mean different things: **`unattributed_trades`** is swaps with no token side at all (token↔token exotic pools, unclassified pools) and is routine, often large for MM bots; **`unsized_trades`** is a token-side trade whose quantity could not be reconstructed from `rhc_trades`'' raw uint256 leg amounts, which is the actual quality signal and should be ~0.


        **Attribution floor:** analysis starts at `notes.attribution_complete_from` (2026-07-18) rather than the full 90 days — `trader_eoa` was written for under half of earlier trades, and a partial view produces positions the wallet no longer holds.


        A wallet exceeding the 50,000-trade analysis cap returns `stats.partial: true`. Heavy wallets that blow the query budget return the reputation block with `stats_unavailable: true` rather than a 500. Responses are cached 60s per address. Tier: **PRO+**.'
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        description: EVM wallet address (0x, 40 hex). Case-insensitive; echoed lowercase.
      responses:
        '200':
          description: OK. `stats` is null only when the wallet is known solely through a reputation table (e.g. a deployer that has never traded).
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  address:
                    type: string
                  stats:
                    type: object
                    nullable: true
                    properties:
                      first_seen:
                        type: string
                        format: date-time
                        nullable: true
                      last_seen:
                        type: string
                        format: date-time
                        nullable: true
                      total_trades:
                        type: integer
                      analyzed_trades:
                        type: integer
                        description: Trades that entered the FIFO computation.
                      unattributed_trades:
                        type: integer
                        description: Swaps with no token side or direction — token↔token exotic pools and pools our resolver has not classified. Routine, and a large share for MM bots (47% on one 512k-trade fleet wallet). NOT a data-quality signal.
                      unsized_trades:
                        type: integer
                        description: Token-side trades whose QUANTITY could not be reconstructed — excluded from PnL entirely. This IS the quality signal and should be ~0 (measured 0 across a 512k-trade wallet).
                      buys:
                        type: integer
                      sells:
                        type: integer
                      bought_eth:
                        type: number
                      sold_eth:
                        type: number
                      realized_pnl_eth:
                        type: number
                      unrealized_pnl_eth:
                        type: number
                        description: 'Mark-to-market on FIFO-open positions using rhc_token_prices.last_price_native. Unpriced positions contribute 0. **FIFO figure, not a holding**: it includes lots transferred out since the buy. For PnL on what is actually held use `holdings.unrealized_known_eth`.'
                      total_pnl_eth:
                        type: number
                        description: realized_pnl_eth + unrealized_pnl_eth (FIFO).
                      held_value_eth:
                        type: number
                        description: 'FIFO-unmatched DEX buys x current price. **Not an on-chain balance**: a token sent out by transfer still counts here. The proven current value is `holdings.verified_value_eth`.'
                      unique_tokens:
                        type: integer
                      open_positions:
                        type: integer
                        description: FIFO-open positions (unmatched DEX buys). How many are actually still held is in `holdings`.
                      window_days:
                        type: integer
                        example: 90
                      partial:
                        type: boolean
                        description: Present only when the 50,000-trade cap was hit.
                  flags:
                    type: object
                    properties:
                      is_kol:
                        type: boolean
                      kol_name:
                        type: string
                        nullable: true
                      is_deployer:
                        type: boolean
                      deployer_tier:
                        type: string
                        nullable: true
                        enum:
                        - elite
                        - good
                        - neutral
                        - spammer
                      deployer_tokens:
                        type: integer
                        nullable: true
                      deployer_runner_rate:
                        type: number
                        nullable: true
                      is_alpha_tracked:
                        type: boolean
                      alpha_win_rate:
                        type: number
                        nullable: true
                      alpha_net_eth:
                        type: number
                        nullable: true
                      alpha_tokens_traded:
                        type: integer
                        nullable: true
                      likely_bot:
                        type: boolean
                        nullable: true
                        description: Atomic-arb / MM signature from mv_rhc_alpha_wallets.
                      is_dumper:
                        type: boolean
                        description: ≥5 dump cohorts AND 0 runner cohorts, rolling 42d. Rebuilt daily — up to ~48h stale. Absence means NOT OBSERVED, not verified clean.
                      dump_cluster:
                        type: object
                        nullable: true
                      early_buyer_tokens:
                        type: integer
                        description: Tokens where this wallet was in the first-20 buyer cohort.
                  top_tokens:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      properties:
                        still_holding:
                          type: boolean
                          description: 'FIFO meaning: an unmatched DEX buy exists. NOT an on-chain balance; see holding_status.'
                        holding_status:
                          type: string
                          nullable: true
                          enum:
                          - HELD
                          - PARTIALLY_REDUCED
                          - TRANSFERRED_OR_DISPOSED
                          - EXTERNAL_INFLOW
                          - BALANCE_UNVERIFIED
                          description: On-chain status of a FIFO-open token; null when the token is FIFO-closed.
                  holdings:
                    type: object
                    nullable: true
                    description: 'On-chain verification of every FIFO-open position: balanceOf + decimals read from our own Robinhood Chain node in one Multicall3 batch (cached 30 s). `complete: false` means at least one position is BALANCE_UNVERIFIED (node unreachable, call reverted, non-standard token, decimals mismatch) and contributes NO value.'
                    properties:
                      balance_source:
                        type: string
                        enum:
                        - rhc_node_multicall3
                      checked_at:
                        type: string
                        format: date-time
                      complete:
                        type: boolean
                      fifo_open_positions:
                        type: integer
                      held:
                        type: integer
                      partially_reduced:
                        type: integer
                      transferred_or_disposed:
                        type: integer
                      external_inflow:
                        type: integer
                      unverified:
                        type: integer
                      verified_value_eth:
                        type: number
                        description: 'PROVEN balances x current price: the current value of the tokens this wallet bought on a DEX and still holds. Unverified and unpriced positions contribute nothing.'
                      unpriced_held:
                        type: integer
                      cost_basis_held_eth:
                        type: number
                        description: Cost basis of the FIFO-known portion still in the wallet.
                      unrealized_known_eth:
                        type: number
                        description: Unrealized PnL on the portion whose cost basis is known AND still held. External inflows never add trading profit.
                      cost_basis_not_held_eth:
                        type: number
                        description: 'Cost basis of FIFO lots no longer in the wallet (transferred out or disposed outside indexed swaps). Outcome unknown: neither realized nor unrealized.'
                  recent_trades:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                  derived:
                    type: object
                    nullable: true
                    properties:
                      win_rate:
                        type: number
                        nullable: true
                      wins:
                        type: integer
                      losses:
                        type: integer
                      avg_trade_size_eth:
                        type: number
                        nullable: true
                      is_active:
                        type: boolean
                  stats_unavailable:
                    type: boolean
                    description: Present when the trade aggregation was skipped on a timeout. Absence of stats is then UNPROVEN — do not read it as an inactive wallet.
                  cache_hit:
                    type: boolean
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '400':
          description: Invalid EVM address.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Requires Pro or Ultra tier.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No recorded Robinhood Chain activity for this address as a trading account (`trader_eoa`). The body carries `address_type` (`eoa` / `eoa_7702` / `contract` / `unknown`, from eth_getCode); for a contract also `contract_trader_swaps_last_hour` (swaps where it is the swap-log trader; null = not measured) and a `note`. A contract cannot sign transactions, so its own swaps are never attributed to a wallet here; identities are not merged.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
