  /rhc/kol/first-touches:
    get:
      tags:
      - Robinhood Chain
      summary: Earliest KOL entry per token on Robinhood Chain (BASIC+)
      description: 'The **first time any tracked KOL bought** each token on Robinhood Chain — an early-entry / discovery signal. Computed read-time from `rhc_kol_trades` (a DISTINCT-ON per token yielding the global earliest KOL buy), enriched with token metadata and current/peak MC. EVM-native fields (`eth_amount`, `evm_address`, `tx_hash`, 0x). Tier: **BASIC** — but below the API-access tiers (PRO/ULTRA/BUSINESS) `limit` is clamped to 20, and the first KOL''s `evm_address` is revealed only to **ULTRA/BUSINESS**.'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        description: Clamped to 20 for keys below the API-access tiers.
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: Only first-touches at/after this ISO8601 timestamp.
      - name: before
        in: query
        schema:
          type: string
          format: date-time
        description: 'Cursor: only first-touches before this ISO8601 timestamp. Pass `next_before` to page.'
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 200
        description: 'PREFERRED pagination (audit F09 follow-up): the `next_cursor` from a previous page — an opaque strict (first_buy_at, id) keyset, so paging never repeats or skips rows that share a timestamp and progresses with limit=1 through runs of identical timestamps. Malformed or tampered → 400. Cannot be combined with `before=` (400); `before=` stays supported as the legacy bound.'
      - name: min_eth
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 100000
        description: 'Minimum ETH size of the first KOL buy (alias: `min_sol`).'
      - name: token_age_max_min
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 43200
        description: Only tokens younger than N minutes at first touch.
      - name: launchpad
        in: query
        schema:
          type: string
          pattern: ^[a-zA-Z0-9._-]{1,32}$
        description: Filter to one launchpad.
      - name: min_mc_usd
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 1000000000000
        description: Minimum MC at first buy (USD).
      - name: max_mc_usd
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 1000000000000
        description: 'Maximum MC at first buy (USD; alias: `mc_max`). Must be ≥ min_mc_usd.'
      responses:
        '200':
          description: '`next_before` is the pagination cursor (oldest first_buy_at on the page); `data_age_seconds` is the age of the newest event.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        token_address:
                          type: string
                        token_symbol:
                          type: string
                          nullable: true
                        token_name:
                          type: string
                          nullable: true
                        launchpad:
                          type: string
                          nullable: true
                        is_graduated:
                          type: boolean
                          nullable: true
                        first_buy_at:
                          type: string
                          format: date-time
                        eth_amount:
                          type: number
                          nullable: true
                          description: Size of the first KOL buy in ETH.
                        token_amount:
                          type: number
                          nullable: true
                        tx_hash:
                          type: string
                        token_age_minutes:
                          type: integer
                          nullable: true
                          description: Token age at first touch.
                        market_cap_usd_at_first_buy:
                          type: number
                          nullable: true
                        price_usd_at_first_buy:
                          type: number
                          nullable: true
                        current_mc_usd:
                          type: number
                          nullable: true
                        peak_mc_usd:
                          type: number
                          nullable: true
                        first_kol:
                          type: object
                          properties:
                            evm_address:
                              type: string
                              description: The KOL's Robinhood-Chain wallet (0x). Present only for ULTRA/BUSINESS keys.
                            name:
                              type: string
                              nullable: true
                            twitter_url:
                              type: string
                              nullable: true
                  count:
                    type: integer
                  next_before:
                    type: string
                    format: date-time
                    nullable: true
                  next_cursor:
                    type: string
                    nullable: true
                    description: 'Opaque keyset cursor for the next (older) page — pass as `cursor=`. PREFERRED over next_before, which is a strict timestamp bound that skips same-timestamp siblings of the boundary row. null on a server that predates the rhc_kol_first_touches_page migration (legacy path: no id tiebreak).'
                  has_more:
                    type: boolean
                    nullable: true
                    description: Exact (limit+1 probe). null when the server is on the legacy path and cannot tell — page on next_before until an empty page.
                  data_age_seconds:
                    type: integer
                    nullable: true
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
