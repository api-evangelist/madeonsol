openapi: 3.2.0
info:
  title: MadeOnSol Robinhood Chain API
  version: 1.20.0
  description: Real-time Solana & Robinhood Chain trading intelligence — KOL wallet trades, deployer reputation, token buyer-quality scoring, wallet tracking, and copy-trade signals across both chains (Robinhood Chain paths under `/rhc/*`).
  contact:
    name: MadeOnSol
    url: https://madeonsol.com/contact
  license:
    name: Proprietary
    url: https://madeonsol.com/terms
servers:
- url: https://madeonsol.com/api/v1
  description: Production
security:
- BearerAuth: []
tags:
- name: Robinhood Chain
  description: Robinhood Chain (chain id 4663) coverage — same intel, EVM-native contracts (0x addresses, eth_amount, tx_hash). Bundled into existing tiers at no extra cost.
paths:
  /rhc/kol/feed:
    get:
      tags:
      - Robinhood Chain
      summary: KOL trade feed on Robinhood Chain (BASIC+; 5-min delay on free)
      description: 'Every buy/sell from tracked Solana KOLs'' verified EVM wallets on Robinhood Chain (chain id 4663), attributed to the effective trading account from our self-hosted node (tx.from normally, or the ERC-4337 userOp sender when bundled — never the bundler) — DEX swaps and launchpad curve snipes, within seconds of execution on PRO and up (the free tier serves this feed on a 5-minute delay). The KOL→EVM mapping is recovered by tracing each KOL''s Solana→EVM bridge deposits (deBridge / Relay / Mayan / Wormhole) — a dataset unique to MadeOnSol. Every row is enriched with the token''s current MC/liquidity/peak, the deployer''s reputation tier, and `mc_multiple_since_trade` (current MC ÷ MC when the KOL bought — ''did the call run''). Tier: **BASIC** (any valid key).'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - name: before
        in: query
        schema:
          type: string
          format: date-time
        description: 'Cursor: return trades strictly older than this ISO timestamp. Pass `next_before` from the previous response to page backwards.'
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 200
        description: 'PREFERRED pagination (audit F09 follow-up): the `next_cursor` from a previous page — an opaque strict (traded_at, id) keyset, so paging never repeats or skips rows that share a timestamp and progresses with limit=1 through runs of identical timestamps. Malformed or tampered → 400. Cannot be combined with `before=` (400); `before=` stays supported as the legacy bound.'
      - name: action
        in: query
        schema:
          type: string
          enum:
          - buy
          - sell
        description: Only buys or only sells.
      - name: kol
        in: query
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        description: Filter to a single KOL by their EVM wallet address (0x, 40 hex).
      - name: min_eth
        in: query
        schema:
          type: number
          minimum: 0
        description: Minimum trade size in ETH.
      - name: exclude_sells
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - '1'
          - '0'
        description: Convenience alias for `action=buy` — drops sells from the feed. Ignored if `action` is set explicitly.
      - name: min_mc_usd
        in: query
        schema:
          type: number
          minimum: 0
        description: Only trades where the token's market cap at trade time was at least this (USD).
      - name: max_mc_usd
        in: query
        schema:
          type: number
          minimum: 0
        description: Only trades where the token's market cap at trade time was at most this (USD). Combine with `min_mc_usd` for a band; `min_mc_usd` must be <= `max_mc_usd` or the request 400s.
      - name: token_age_max_min
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 43200
        description: Only trades on tokens first seen at most this many minutes ago — the 'fresh launches KOLs are buying' filter. Tokens with unknown first-seen time are excluded.
      - name: min_kol_winrate
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 1
        description: 'Only trades by KOLs whose 7-day win rate (mv_rhc_kol_scores.winrate_7d, CLOSED positions only — sold ≥ 90 % of bought) is at least this (0–1). KOLs with no closed positions have a NULL win rate and are dropped, so `min_kol_winrate=0` is NOT a no-op: it means "scored".'
      - name: strategy
        in: query
        schema:
          type: string
          enum:
          - scalper
          - day_trader
          - swing
          - inactive
          - unscored
        description: Only trades by KOLs in this hold-time bucket (mv_rhc_kol_scores.strategy). An RHC-specific bucket, not Solana's auto_strategy_tag.
      responses:
        '200':
          description: '`chain` echoes `robinhood`; `next_before` is the pagination cursor; `data_age_seconds` is the age of the newest row.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  trades:
                    type: array
                    items:
                      type: object
                      properties:
                        evm_address:
                          type: string
                          description: The KOL's Robinhood-Chain wallet (0x).
                        kol_name:
                          type: string
                          nullable: true
                        kol_twitter:
                          type: string
                          nullable: true
                        token_address:
                          type: string
                        token_symbol:
                          type: string
                          nullable: true
                        token_name:
                          type: string
                          nullable: true
                        launchpad:
                          type: string
                          nullable: true
                          description: pons | flap | clanker | hood.fun | virtuals | null.
                        is_graduated:
                          type: boolean
                          nullable: true
                        deployer_tier:
                          type: string
                          nullable: true
                          enum:
                          - elite
                          - good
                          - neutral
                          - spammer
                          description: Reputation tier of the token's deployer.
                        token_age_minutes:
                          type: integer
                          nullable: true
                          description: Token age at request time (first-seen → now).
                        action:
                          type: string
                          enum:
                          - buy
                          - sell
                        eth_amount:
                          type: number
                          nullable: true
                          description: Trade size in ETH.
                        token_amount:
                          type: number
                          nullable: true
                        price_usd_at_trade:
                          type: number
                          nullable: true
                        market_cap_usd_at_trade:
                          type: number
                          nullable: true
                          description: Token market cap when the KOL traded.
                        current_mc_usd:
                          type: number
                          nullable: true
                          description: Token market cap now.
                        peak_mc_usd:
                          type: number
                          nullable: true
                          description: All-time-high market cap observed since ingestion.
                        liquidity_usd:
                          type: number
                          nullable: true
                        liquidity_basis:
                          type: string
                          enum:
                          - v4_virtual_ceiling
                          - measured
                          description: How liquidity_usd was derived. uniswap-v4 has no per-pool balances, so its figure is virtual reserves clamped to the PoolManager's total holdings — a provable CEILING, not measured per-pool TVL. All other venues are measured from real balances.
                        risk:
                          $ref: '#/components/schemas/RhcTokenRiskSummary'
                        mc_multiple_since_trade:
                          type: number
                          nullable: true
                          description: current_mc_usd ÷ market_cap_usd_at_trade — how far the token ran after the KOL's trade.
                        dex:
                          type: string
                          description: uniswap-v2/v3/v4 or the launchpad name for curve trades.
                        pool:
                          type: string
                          nullable: true
                        tx_hash:
                          type: string
                        block_number:
                          type: integer
                        traded_at:
                          type: string
                          format: date-time
                        kol_score:
                          type: object
                          nullable: true
                          description: The KOL's row in mv_rhc_kol_scores. null = no row yet (too few closed positions), never "not looked up".
                          properties:
                            winrate_7d:
                              type: number
                              nullable: true
                              description: 0–1, CLOSED positions only (sold ≥ 90 % of bought).
                            winrate_30d:
                              type: number
                              nullable: true
                            strategy:
                              type: string
                              nullable: true
                              description: 'Hold-time bucket: scalper | day_trader | swing | inactive | unscored.'
                            closed_positions_30d:
                              type: integer
                              nullable: true
                  count:
                    type: integer
                  filtered_by:
                    type: object
                    description: Echo of the KOL-score filters (null = not applied).
                    properties:
                      min_kol_winrate:
                        type: number
                        nullable: true
                      strategy:
                        type: string
                        nullable: true
                  matched_kols:
                    type: integer
                    nullable: true
                    description: KOLs matching min_kol_winrate/strategy; null when neither filter is set.
                  data_age_seconds:
                    type: integer
                    nullable: true
                  next_before:
                    type: string
                    format: date-time
                    nullable: true
                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque keyset cursor for the next (older) page — pass as `cursor=`. PREFERRED over next_before, which is a strict timestamp bound that skips same-timestamp siblings of the boundary row.
                  has_more:
                    type: boolean
                    description: false only when the feed is exhausted (not merely when the page is short).
                  scan:
                    type: object
                    description: 'Present when a filter had to be applied after the candidate fetch (audit F09): has_more is then false only when the candidates ran out, and scan_truncated=true means the per-request scan budget ran out first — more matches MAY exist past next_cursor.'
                    properties:
                      post_filtered:
                        type: boolean
                      scanned:
                        type: integer
                        description: Candidate rows examined
                      scan_truncated:
                        type: boolean
                        description: The per-request scan budget ran out before `limit` matches — more matches MAY exist past the cursor/offset
                      scan_budget:
                        type: integer
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-madeonsol-tier: FREE
      x-badges:
      - name: FREE
        position: after
        color: '#64748b'
      operationId: getRhcKolFeed
      x-operation-id-source: derived
  /rhc/kol/leaderboard:
    get:
      tags:
      - Robinhood Chain
      summary: KOL activity leaderboard on Robinhood Chain (BASIC+)
      description: 'KOLs on Robinhood Chain ranked by trade count, then net ETH flow, over the chosen window. Tier: **BASIC**. (Net ETH is buy−sell flow, not realized PnL — cost-basis PnL is a planned addition.)'
      parameters:
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 24h
          - 7d
          - 30d
          default: 24h
        description: Rolling window.
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  period:
                    type: string
                    enum:
                    - 24h
                    - 7d
                    - 30d
                  leaderboard:
                    type: array
                    items:
                      type: object
                      properties:
                        kol_name:
                          type: string
                          nullable: true
                        kol_twitter:
                          type: string
                          nullable: true
                        trades:
                          type: integer
                        buys:
                          type: integer
                        sells:
                          type: integer
                        buy_eth:
                          type: number
                          description: Total ETH bought in the window.
                        sell_eth:
                          type: number
                          description: Total ETH sold in the window.
                        net_eth:
                          type: number
                          description: buy_eth − sell_eth (flow, not realized PnL).
                        tokens_traded:
                          type: integer
                          description: Distinct tokens traded in the window.
                        last_trade_at:
                          type: string
                          format: date-time
                  count:
                    type: integer
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-madeonsol-tier: FREE
      x-badges:
      - name: FREE
        position: after
        color: '#64748b'
      operationId: getRhcKolLeaderboard
      x-operation-id-source: derived
  /rhc/kol/hot-tokens:
