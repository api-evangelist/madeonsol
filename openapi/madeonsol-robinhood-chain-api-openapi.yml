      description: 'Robinhood Chain deployers ranked by reputation, from a 5-min-refresh rollup over every launchpad token we''ve indexed (160K+ ranked deployers). Most RHC launchpads are direct-to-DEX (no bonding curve), so "graduation" is a market-cap milestone: `graduation_rate` = share of the deployer''s tokens that reached a $40K+ peak MC; `runner_rate` = share that reached $100K+. **`tier` is earned on `runner_rate`, NOT `graduation_rate`:** elite = 5+ launches, 24h+ of deployer history and runner_rate >= 0.50; good = same but >= 0.25; spammer = 20+ launches with graduation_rate < 0.05 (the only tier still keyed on the $40K bar). The $40K bar is cheap enough to manufacture — operators mass-relaunch one ticker across rotating wallets — so it is reported but no longer sets the tier. Tier: **BASIC** (any valid key).'
      parameters:
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - graduation_rate
          - runner_rate
          - tokens_deployed
          - best_peak_mc_usd
