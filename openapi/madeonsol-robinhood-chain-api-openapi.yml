  /rhc/tokens/{address}/holders:
    get:
      tags:
      - Robinhood Chain
      summary: Holder set and concentration for a Robinhood Chain token (PRO+)
      description: 'Holder balances and concentration metrics. **Not trade-derived** — balances are folded from ERC-20 `Transfer` logs, which our node retains in full, so they are exact rather than estimated. The Solana counterpart is `GET /tokens/{mint}/holders` — a live on-chain census via mint-scoped getProgramAccounts (shipped 2026-08-16).


        **Every token carries a reconciliation.** `verified` is true only when the reconstructed `sum(balance)` equals on-chain `totalSupply()` at a pinned block. A token that fails, or has not been swept yet, returns `verified: false` with a stated `unverified_reason` — never as though it were exact.


        **Concentration excludes pools and burn addresses.** The largest holder of a token is normally its own liquidity pool, so counting it would make `top1_share` meaningless; pools and burns are reported separately as `pool_held_pct` / `burned_pct` and excluded from the circulating denominator. Balances are raw uint256 and are returned as **strings** to preserve precision. Holder addresses may be ERC-4337 smart accounts, so `holder_count` is not a headcount of people.


        **Holder growth (2026-08-17).** `holder_growth.{1h,24h,7d}` reports `entered` (first Transfer at-or-after the window''s `cutoff_block`), `entered_still_holding`, `exited` (pre-existing holders whose last movement in the window left them at zero) and `net` ≈ Δ holder_count — possible because the fold keeps first_seen_block/last_block and retains zero-balance rows. The Solana census has no history and cannot answer this.'
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        description: Token address (0x, 40 hex).
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: Capped at 50 on PRO, 200 on ULTRA/BUSINESS.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        description: Position paging, capped at 10,000 (OFFSET is O(n)). For a full walk use `after`.
      - name: after
        in: query
        schema:
          type: string
        description: 'Keyset cursor (2026-09-05): pass the previous page''s `next_after` unchanged to continue past the offset cap. Same order (balance DESC, holder ASC); supersedes offset. `next_after` is null on the last page.'
      responses:
        '200':
          description: OK. Check `verified` before relying on the numbers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  token_address:
                    type: string
                  verified:
                    type: boolean
                    description: True only when reconstructed supply matches on-chain totalSupply().
                  unverified_reason:
                    type: string
                    nullable: true
                  holders:
                    type: array
                    items:
                      type: object
                      properties:
                        holder:
                          type: string
                        balance:
                          type: string
                          description: Raw uint256 as a decimal STRING — not a number.
                        share:
                          type: number
                          nullable: true
                          description: Share of circulating (pools/burns excluded), [0,1].
                        last_block:
                          type: integer
                          nullable: true
                        is_pool:
                          type: boolean
                        is_burn:
                          type: boolean
                        is_deployer:
                          type: boolean
                  count:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  has_more:
                    type: boolean
                  next_after:
                    type: string
                    nullable: true
                    description: 'Keyset cursor for the next page — pass it unchanged as `after`. null on the last page (or when the last row has no balance). Preferred over `offset` for full walks: offset is capped at 10,000, `after` is not.'
                  after:
                    type: string
                    nullable: true
                    description: Echo of the `after` cursor this page was read from (null on the first page).
                  concentration:
                    type: object
                    nullable: true
                    properties:
                      holder_count:
                        type: integer
                        nullable: true
                      circulating:
                        type: string
                        nullable: true
                      top1_share:
                        type: number
                        nullable: true
                      top10_share:
                        type: number
                        nullable: true
                      top50_share:
                        type: number
                        nullable: true
                      hhi:
                        type: number
                        nullable: true
                        description: Herfindahl index over circulating shares.
                      pool_held_pct:
                        type: number
                        nullable: true
                      burned_pct:
                        type: number
                        nullable: true
                      deployer_pct:
                        type: number
                        nullable: true
                  holder_growth:
                    type: object
                    nullable: true
                    description: Entered / exited holders per window, read from first_seen_block + last_block of the Transfer-log fold (mig 325). null only if the growth read failed; a single window is null when the chain had no ingested trades in it (cutoff unresolvable).
                    properties:
                      1h:
                        $ref: '#/components/schemas/RhcHolderGrowthWindow'
                      24h:
                        $ref: '#/components/schemas/RhcHolderGrowthWindow'
                      7d:
                        $ref: '#/components/schemas/RhcHolderGrowthWindow'
                      note:
                        type: string
                  reconciliation:
                    type: object
                    nullable: true
                    description: recon_supply vs chain_supply at recon_block.
                  source:
                    type: object
                    description: Method, sweep cursor and completeness.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '400':
          description: Invalid EVM token address.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: PRO tier required.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: getRhcTokensByAddressHolders
      x-operation-id-source: derived
  /rhc/deployer-hunter/leaderboard:
