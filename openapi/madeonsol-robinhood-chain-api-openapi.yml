      description: 'The first buyers of a Robinhood Chain token, in order, joined to what happened next. `rhc_early_buyers` ranks the first 20 buyers of 437k tokens and is recomputed daily; until now it was read only as a per-wallet COUNT, never exposed as a per-token list. The Solana counterpart is `GET /kol/tokens/{mint}/entry-order`.


