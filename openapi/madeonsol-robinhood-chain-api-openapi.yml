      description: Catch-up path for a consumer that missed a webhook or was disconnected from the WebSocket channel. Retained 7 days.
      parameters:
      - name: subscription_id
        in: query
        schema:
          type: integer
        description: Scope to one of your rules. 404 if you do not own it.
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      responses:
        '200':
          description: OK — { chain, signals[], count }.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  signals:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        subscription_id:
                          type: integer
                        fired_at:
                          type: string
                          format: date-time
                        source_wallet:
                          type: string
                          description: Lowercase 0x wallet whose trade matched the rule.
                        action:
                          type: string
                          enum:
                          - buy
                          - sell
                        token_address:
                          type: string
                        token_symbol:
                          type: string
                          nullable: true
                        token_name:
                          type: string
                          nullable: true
                        source_eth_amount:
                          type: number
                          description: Size of the source wallet's trade, in ETH.
                        suggested_eth_amount:
                          type: number
                          nullable: true
                          description: Sized amount per the rule's sizing_mode/sizing_amount.
                        price_usd:
                          type: number
                          nullable: true
                        dex:
                          type: string
                          nullable: true
                        tx_hash:
                          type: string
                        delivered:
                          type: boolean
                          description: True once the signal was actually written to one of your live sockets or accepted by your webhook. A frame that was only queued for a socket still running a replay and then dropped (queue overflow or a 4008 close) is NOT delivered and records delivery_error 'ws_replay_dropped'.
                        delivered_at:
                          type: string
                          format: date-time
                          nullable: true
