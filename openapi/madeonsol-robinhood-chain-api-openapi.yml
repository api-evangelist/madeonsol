      summary: Top traders of a Robinhood Chain token, ranked by realized ETH (PRO+)
      description: 'Lifetime per-trader performance on one token, ranked by realized ETH flow, enriched with alpha-wallet reputation (win-rate, bot heuristic, KOL identity), dump-cluster membership and early-buyer rank.


