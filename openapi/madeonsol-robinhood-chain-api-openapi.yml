                        - both
                      webhook_url:
                        type: string
                        format: uri
                        nullable: true
                      is_active:
                        type: boolean
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                  webhook_secret:
                    type: string
                    nullable: true
                    description: One-time HMAC secret — only present when webhook delivery is configured.
                  scoring:
                    type: object
                    properties:
                      score_version:
                        type: string
                        example: v1
                      quality:
                        type: string
                        description: Real component, from mv_rhc_kol_scores winrate_7d.
                      earliness:
