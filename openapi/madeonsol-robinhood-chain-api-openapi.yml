  /rhc/tokens:
    get:
      tags:
      - Robinhood Chain
      summary: Robinhood Chain token discovery (PRO+)
      description: 'Live-priced Robinhood Chain tokens with market cap, liquidity, peak MC + drawdown, launchpad, and deployer reputation tier. Sortable and filterable. Filters the candidate query cannot express are served by a bounded scan (`scan` block) — a short or empty page never implies exhaustion unless has_more is false. Tier: **PRO+**.'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - last_trade
          - market_cap
          - liquidity
          - peak_mc
          - newest
          - oldest
          default: last_trade
        description: 'Ordering (all descending unless noted): most recent trade, market cap, current liquidity, all-time-high MC, newest (first_seen_at DESC — the launch feed; unpriced tokens list with null price fields; response adds next_since), or oldest (first_seen_at ASC — a resumable backfill walk through the full historical token set; response adds next_after + has_more).'
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: 'Only with sort=newest: tokens first seen at or after this ISO8601 time (inclusive — first_seen_at is block-second granularity and several tokens can share one second, so the cursor row repeats; dedupe on token_address). Feed back the response''s next_since to poll for launches.'
      - name: after
        in: query
        schema:
          type: string
          format: date-time
        description: 'LEGACY — prefer cursor=. Only with sort=oldest: tokens first seen at or after this ISO8601 time (inclusive). With more same-second tokens than `limit` it cannot advance — use cursor=. Feed back next_after (dedupe on token_address); stop when has_more is false.'
      - name: cursor
        in: query
        schema:
          type: string
        description: 'Only with sort=oldest (PREFERRED over after=): the next_cursor from a previous page — a strict compound (first_seen_at, address) keyset, so the walk never repeats or skips a row and progresses with limit=1 through runs of identical timestamps. Malformed → 400; cannot be combined with after=.'
      - name: has_pool
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Filter on whether the token has a discovered pool (primary_pool from rhc_token_prices non-null). A token can be listed (first_seen_at set) before its pool is found — pair with sort=oldest&has_pool=true for a one-time backfill of every RHC token with a pool.
      - name: asset_class
        in: query
        schema:
          type: string
          enum:
          - equity
          - other
        description: equity = beacon-verified Robinhood tokenized stock/ETF (issuer beacon read from our node — never the name); other = everything else.
      - name: min_mc_usd
        in: query
        schema:
          type: number
          minimum: 0
        description: Minimum current market cap (USD).
      - name: min_liquidity_usd
        in: query
        schema:
          type: number
          minimum: 0
        description: Minimum current liquidity (USD).
      - name: launchpad
        in: query
        schema:
          type: string
        description: 'Filter by launchpad: pons, flap, clanker, hood.fun, noxa, virtuals.'
      - name: max_age_days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        description: 'Value sorts only (market_cap / liquidity / peak_mc): exclude tokens whose last trade is older than this many days. Default 30 — a screener ranks what is tradeable; widen explicitly for dormant tokens.'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        token_address:
                          type: string
                        symbol:
                          type: string
                          nullable: true
                        name:
                          type: string
                          nullable: true
                        decimals:
                          type: integer
                          nullable: true
                          description: From rhc_tokens. Added 2026-09-08 — needed to parse on-chain raw amounts correctly.
                        asset_class:
                          type: string
                          nullable: true
                          enum:
                          - equity
                          description: '`equity` = beacon-verified Robinhood tokenized stock/ETF (issuer beacon read from our node — never the name); null = everything else.'
                        first_seen_at:
                          type: string
                          format: date-time
                          nullable: true
                          description: When OUR node first saw the token trade or get a pool — not the contract creation block.
                        launchpad:
                          type: string
                          nullable: true
                        is_graduated:
                          type: boolean
                          nullable: true
                        deployer_address:
                          type: string
                          nullable: true
                        deployer_tier:
                          type: string
                          nullable: true
                          enum:
                          - elite
                          - good
                          - neutral
                          - spammer
                        price_usd:
                          type: number
                          nullable: true
                        market_cap_usd:
                          type: number
                          nullable: true
                        fdv_usd:
                          type: number
                          nullable: true
                        peak_mc_usd:
                          type: number
                          nullable: true
                        peak_mc_at:
                          type: string
                          format: date-time
                          nullable: true
                        drawdown_from_peak_pct:
                          type: integer
                          nullable: true
                          description: Percent below all-time-high MC.
                        liquidity_usd:
                          type: number
                          nullable: true
                        liquidity_basis:
                          type: string
                          enum:
                          - v4_virtual_ceiling
                          - measured
                          description: How liquidity_usd was derived. uniswap-v4 has no per-pool balances, so its figure is virtual reserves clamped to the PoolManager's total holdings — a provable CEILING, not measured per-pool TVL. All other venues are measured from real balances.
                        primary_dex:
                          type: string
                          nullable: true
                        primary_pool:
                          type: string
                          nullable: true
                        last_trade_time:
                          type: string
                          format: date-time
                          nullable: true
                  count:
                    type: integer
                  sort:
                    type: string
                  since:
                    type: string
                    format: date-time
                    nullable: true
                    description: sort=newest only — echoes the request's since=.
                  next_since:
                    type: string
                    format: date-time
                    nullable: true
                    description: sort=newest only. Feed back as since= to poll for newer launches.
                  note:
                    type: string
                    description: sort=newest / sort=oldest only — constant explanation of the first_seen_at semantics and the cursor contract.
                  after:
                    type: string
                    format: date-time
                    nullable: true
                    description: sort=oldest only — echoes the request's after=.
                  has_more:
                    type: boolean
                    description: sort=oldest only — false ONLY when the candidates ran out (never inferred from a short filtered page).
                  cursor:
                    type: string
                    nullable: true
                    description: sort=oldest only — echoes the request's cursor=.
                  next_cursor:
                    type: string
                    nullable: true
                    description: sort=oldest only (PREFERRED). Feed back as cursor= — strict (first_seen_at, address) keyset; null = walk complete.
                  next_after:
                    type: string
                    format: date-time
                    nullable: true
                    description: sort=oldest only, LEGACY inclusive cursor. Feed back as after= (dedupe on token_address). When a scanned page matched nothing it advances to the last scanned row.
                  scan:
                    type: object
                    description: 'Present when a filter (launchpad / has_pool / price criteria) had to be scanned after the candidate fetch (audit F09): has_more is then false only when the candidates ran out, and scan_truncated=true means the per-request budget ran out first — more matches MAY exist.'
                    properties:
                      post_filtered:
                        type: boolean
                      scanned:
                        type: integer
                        description: Candidate rows examined
                      scan_truncated:
                        type: boolean
                        description: The per-request scan budget ran out before `limit` matches — more matches MAY exist past the cursor/offset
                      scan_budget:
                        type: integer
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: PRO+ tier required.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: getRhcTokens
      x-operation-id-source: derived
  /rhc/tokens/{address}:
    get:
      tags:
      - Robinhood Chain
      summary: Robinhood Chain token bundle (BASIC+)
      description: 'Full snapshot for one token: metadata, live price/MC/FDV, peak MC + drawdown, graduation status, deployer reputation block (+ other tokens by the same deployer), KOL activity summary, and pool inventory with reserves. Tier: **BASIC**.'
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        description: Token address (0x, 40 hex).
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  token_address:
                    type: string
                  symbol:
                    type: string
                    nullable: true
                  name:
                    type: string
                    nullable: true
                  decimals:
                    type: integer
                    nullable: true
                  launchpad:
                    type: string
                    nullable: true
                  is_graduated:
                    type: boolean
                    nullable: true
                  graduated_pool:
                    type: string
                    nullable: true
                  graduated_at:
                    type: string
                    format: date-time
                    nullable: true
                  deployer_address:
                    type: string
                    nullable: true
                  deployer_identity_status:
                    type: string
                    enum:
                    - known
                    - unresolved
                    - unavailable
                    description: known = the token row names its creator (identity does not depend on reputation); unresolved = no creator recorded; unavailable = the token lookup failed
                  first_seen_at:
                    type: string
                    format: date-time
                    nullable: true
                  token_age_minutes:
                    type: integer
                    nullable: true
                  price_usd:
                    type: number
                    nullable: true
                  price_native:
                    type: number
                    nullable: true
                  price_observed_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: The last trade that set the native price — the price's own age anchor (same stale-price contract as GET /token/{mint})
                  price_age_seconds:
                    type: integer
                    nullable: true
                  price_is_stale:
                    type: boolean
                    description: true when price_age_seconds > 900
                  price_updated_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Row write time — can move without a trade (USD re-derivation); not a price-age anchor
                  market_cap_usd:
                    type: number
                    nullable: true
                  fdv_usd:
                    type: number
                    nullable: true
                  peak_mc_usd:
                    type: number
                    nullable: true
                  peak_mc_at:
                    type: string
                    format: date-time
                    nullable: true
                  drawdown_from_peak_pct:
                    type: integer
                    nullable: true
                  total_supply_raw:
                    type: string
                    nullable: true
                  liquidity_usd:
                    type: number
                    nullable: true
                  liquidity_basis:
                    type: string
                    enum:
                    - v4_virtual_ceiling
                    - measured
                    description: How liquidity_usd was derived. uniswap-v4 has no per-pool balances, so its figure is virtual reserves clamped to the PoolManager's total holdings — a provable CEILING, not measured per-pool TVL.
                  liquidity_note:
                    type: string
                    description: Human-readable statement of the uniswap-v4 ceiling semantics; constant.
                  primary_dex:
                    type: string
                    nullable: true
                  primary_pool:
                    type: string
                    nullable: true
                  last_trade_time:
                    type: string
                    format: date-time
                    nullable: true
                  deployer:
                    type: object
                    nullable: true
                    description: Deployer identity + reputation. Non-null whenever the creator address is known, even before the reputation view has it (history_status pending).
                    properties:
                      identity_status:
                        type: string
                        enum:
                        - known
                      history_status:
                        type: string
                        enum:
                        - computed
                        - pending
                        - unavailable
                        description: computed = in the reputation view · pending = known creator, reputation not computed yet (NOT "new") · unavailable = the reputation lookup failed
                      address:
                        type: string
                      tier:
                        type: string
                        enum:
                        - elite
                        - good
                        - neutral
                        - spammer
                      tokens_deployed:
                        type: integer
                      graduation_rate:
                        type: number
                        nullable: true
                      runner_rate:
                        type: number
                        nullable: true
                      runners:
                        type: integer
                      best_peak_mc_usd:
                        type: number
                        nullable: true
                      launchpads:
                        type: array
                        items:
                          type: string
                  deployer_other_tokens:
                    type: array
                    items:
                      type: string
                    description: Up to 10 other tokens by the same deployer (symbol or address).
                  kol_activity:
                    type: object
                    description: Complete aggregate over the token's whole KOL history (rhc_token_kol_activity), keyed on the stable KOL id — two KOLs sharing a display name no longer collapse. If the aggregate is unavailable it falls back to a LABELLED newest-200 sample (basis latest_200_trades, complete=false when truncated, sample_size).
                    properties:
                      distinct_kols:
                        type: integer
                        description: Distinct KOL ids (not display names)
                      names:
                        type: array
                        items:
                          type: string
                      buys:
                        type: integer
                      sells:
                        type: integer
                      net_eth:
                        type: number
                      distinct_wallets:
                        type: integer
                      buy_eth:
                        type: number
                      sell_eth:
                        type: number
                      participants:
                        type: array
                        description: Up to 20 KOLs, most recent first
                        items:
                          type: object
                          properties:
                            kol_id:
                              type: string
                            name:
                              type: string
                              nullable: true
                            twitter_url:
                              type: string
                              nullable: true
                            buys:
                              type: integer
                            sells:
                              type: integer
                            last_trade_at:
                              type: string
                              format: date-time
                      identity:
                        type: string
                        enum:
                        - kol_wallet_id
                      window:
                        type: object
                        properties:
                          kind:
                            type: string
                            enum:
                            - all_time
                            - latest_trades
                          first_trade_at:
                            type: string
                            format: date-time
                            nullable: true
                          last_trade_at:
                            type: string
                            format: date-time
                            nullable: true
                      basis:
                        type: string
                        description: all_trades (complete aggregate) or latest_N_trades (fallback sample)
                      complete:
                        type: boolean
                      sample_size:
                        type: integer
                        description: Fallback sample only
                  degraded_fields:
                    type: array
                    items:
                      type: string
                    description: Blocks whose lookup failed (e.g. deployer_other_tokens) — their values are unknown, not empty
                  pools:
                    type: array
                    description: Up to 20 pools with reserves/liquidity/sqrt_price. Each entry carries `liquidity_basis` (`v4_virtual_ceiling` | `measured`) for its own `liquidity_usd`.
                    items:
                      type: object
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '404':
          description: Token not found on Robinhood Chain.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
