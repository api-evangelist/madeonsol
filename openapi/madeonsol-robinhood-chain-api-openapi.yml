                        type: number
                        nullable: true
                      avg_recovery_tokens:
                        type: number
                        nullable: true
                        description: Launches burned between a miss and the next hit.
                      best_stretch:
                        type: object
                        nullable: true
                      worst_stretch:
                        type: object
                        nullable: true
