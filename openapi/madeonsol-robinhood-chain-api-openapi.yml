      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: getRhcPriceAlerts
      x-operation-id-source: derived
    post:
      tags:
      - Robinhood Chain
      summary: Create an RHC price alert (PRO+)
      description: 'Market-cap drop alert with an optional recovery leg, baselined against the token''s market cap **at creation**. One-shot state machine: `watching → dipped → recovered`; `dip_low` ratchets down while dipped; terminal on the dip when no `recovery_pct` is set.


        ⚠️ **Latency differs from the Solana price alerts.** Solana alerts are evaluated inside a live in-memory price loop every 250 ms. RHC alerts are **event-driven**: each trade on the chain''s trade feed (`rhc:dex_trade`) is checked against the alerted token set, with price-table polls (every 5 s while the feed is degraded or a trade carried no market cap, 60 s otherwise) and a trade-tape replay after a feed outage as safety nets. Latency is a few seconds (the chain trade flush is about 2 s), not sub-second. Every create response carries an `evaluation` block restating this. Do not size a strategy on the Solana figure. `token_address`, `drop_pct` and `recovery_pct` are immutable after creation.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token_address
              - drop_pct
              properties:
                name:
                  type: string
                  maxLength: 64
                token_address:
                  type: string
                  description: Lowercase 0x token address, must be tracked with a market cap
                drop_pct:
                  type: number
                  minimum: 0.01
                  maximum: 99.99
                recovery_pct:
                  type: number
                  minimum: 0.01
                  maximum: 1000
                  description: Omit for a dip-only, terminal alert
                delivery_mode:
                  type: string
                  enum:
                  - webhook
                  - websocket
                  - both
                  default: webhook
                webhook_url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Created — includes one-time webhook_secret and an `evaluation` block describing how the alert is evaluated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  alert:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                        nullable: true
                      token_address:
                        type: string
                      token_symbol:
                        type: string
                        nullable: true
                      baseline_mc_usd:
                        type: number
                      drop_pct:
                        type: number
                      recovery_pct:
                        type: number
                        nullable: true
                      status:
                        type: string
                        enum:
                        - watching
                        - dipped
                        - recovered
                        - expired
                        description: '`expired` = the rule outlived its window and was deactivated (terminal, like `recovered`).'
                      dip_low_mc_usd:
                        type: number
                        nullable: true
                      dip_fired_at:
                        type: string
                        format: date-time
                        nullable: true
                      delivery_mode:
                        type: string
                        enum:
                        - webhook
                        - websocket
                        - both
                      webhook_url:
                        type: string
                        format: uri
                        nullable: true
                      is_active:
                        type: boolean
                      expires_at:
                        type: string
                        format: date-time
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                  webhook_secret:
                    type: string
                    nullable: true
                    description: One-time HMAC secret — only present when webhook delivery is configured.
                  evaluation:
                    type: object
                    properties:
                      mode:
                        type: string
                        enum:
                        - event_driven
                        - polled
                        description: '`event_driven` since 2026-09-15 (`polled` before).'
                      trigger:
                        type: string
                        example: rhc:dex_trade
                      interval_seconds:
                        type: integer
                        example: 5
                        description: 'Kept for compatibility: the fast fallback table-poll interval.'
                      fallback_poll_seconds:
                        type: object
                        properties:
                          fast:
                            type: integer
                            example: 5
                          slow:
                            type: integer
                            example: 60
                      note:
                        type: string
                  note:
                    type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '400':
          description: Invalid body, or token not tracked / has no market cap to baseline against.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
