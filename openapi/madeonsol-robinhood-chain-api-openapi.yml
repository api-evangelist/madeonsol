  /rhc/lp-events:
    get:
      tags:
      - Robinhood Chain
      summary: Liquidity REMOVALS feed — the rug signal (PRO+)
      description: 'Liquidity removals on Robinhood Chain from our own node''s log subscription: Uniswap v2/v3 Burn and v4 ModifyLiquidity with a negative delta, for tracked pools. **By default removals only** — a request without `action` returns exactly what it always did, so an empty default page means ''no removals seen'', never ''no liquidity activity''. Amounts are RAW on-chain integers as strings; token0/token1 say which side is which and token_amount_raw/quote_amount_raw pre-resolve the token side. v4 rows carry liquidity only (the pool manager emits no token amounts). provider_is_token_deployer is the classic rug tell. Cursor via next_before (same opaque (block_time,id) keyset as /rhc/trades). Data since 2026-08-05. **Adds, pool creations and depth fields (2026-09-23):** `action=add|pool_created|all` opts into liquidity adds (v2/v3 Mint, v4 positive ModifyLiquidity; kept 7 days) and live pool creations (kept 30 days like removals), persisted since the WS Phase 3 producer — earlier windows hold removals only. Every row also carries `tick_lower`, `tick_upper`, `liquidity_delta`, `in_range`, `active_liquidity_delta`, `active_share` (v3/v4, a share of liquidity at the current price, not of TVL), `share_of_reserves` (v2) and `material` (a removal of at least 25 % of reserves / active liquidity), null where the pool state was unknown and on older rows. `provider` is the log''s sender/owner — usually the router or position manager on v3/v4, not the beneficial owner. The same events are pushed live on WS channel `rhc:lp_events` (ULTRA+). Tier: **PRO+**.'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: Rows per page (1-200, default 50).
      - name: token
        in: query
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        description: Filter to one token address.
      - name: pool
        in: query
        schema:
          type: string
        description: Pool address (v2/v3) or bytes32 poolId (v4).
      - name: provider
        in: query
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        description: Filter to one liquidity provider (the wallet that pulled).
      - name: dex
        in: query
        schema:
          type: string
          enum:
          - uniswap-v2
          - uniswap-v3
          - uniswap-v4
      - name: action
        in: query
        schema:
          type: string
          enum:
          - remove
          - add
          - pool_created
          - all
          default: remove
        description: Which liquidity actions to return (2026-09-23). Default `remove` = the historical removals-only feed, unchanged. `add` (kept 7 days), `pool_created` or `all` opt into the rows persisted since the WS Phase 3 producer.
      - name: before
        in: query
        schema:
          type: string
        description: Opaque cursor from next_before.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        event:
                          type: string
                          enum:
                          - remove
                          - add
                          - pool_created
                          description: The row's action. Always `remove` on a request without `action`.
                        pool:
                          type: string
                        dex:
                          type: string
                          enum:
                          - uniswap-v2
                          - uniswap-v3
                          - uniswap-v4
                        fee_tier:
                          type: integer
                          nullable: true
                        token_address:
                          type: string
                        token_symbol:
                          type: string
                          nullable: true
                        token_name:
                          type: string
                          nullable: true
                        token_decimals:
                          type: integer
                          nullable: true
                        launchpad:
                          type: string
                          nullable: true
                        provider:
                          type: string
                          nullable: true
                          description: Wallet that removed liquidity.
                        provider_is_token_deployer:
                          type: boolean
                          description: True when the provider is the token's own deployer — the classic rug shape.
                        provider_deployer_tier:
                          type: string
                          nullable: true
                        provider_kol_name:
                          type: string
                          nullable: true
                        liquidity:
                          type: string
                          nullable: true
                          description: Raw liquidity units removed (v3/v4). String — uint256.
                        amount0:
                          type: string
                          nullable: true
                          description: Raw token0 amount (v2/v3 only). String.
                        amount1:
                          type: string
                          nullable: true
                          description: Raw token1 amount (v2/v3 only). String.
                        token0:
                          type: string
                          nullable: true
                        token1:
                          type: string
                          nullable: true
                        token_amount_raw:
                          type: string
                          nullable: true
                          description: amount0 or amount1, whichever is the token side.
                        quote_token:
                          type: string
                          nullable: true
                        quote_amount_raw:
                          type: string
                          nullable: true
                        block_number:
                          type: integer
                        block_time:
                          type: string
                          format: date-time
                          description: Exact block header timestamp.
                        tx_hash:
                          type: string
                        log_index:
                          type: integer
                        tick_lower:
                          type: integer
                          nullable: true
                          description: Position range lower tick (v3/v4); null on v2 (full range) and on rows written before 2026-09-23.
                        tick_upper:
                          type: integer
                          nullable: true
                          description: Position range upper tick (v3/v4).
                        liquidity_delta:
                          type: string
                          nullable: true
                          description: Signed liquidity change (+ add, - remove), v3/v4. String — int256.
                        in_range:
                          type: boolean
                          nullable: true
                          description: tick_lower <= current tick < tick_upper just before the event; null when the pool's tick was unknown.
                        active_liquidity_delta:
                          type: string
                          nullable: true
                          description: 'Change to ACTIVE liquidity: liquidity_delta when in range, "0" out of range, null when unknown.'
                        active_share:
                          type: number
                          nullable: true
                          description: '|active delta| / active liquidity before (v3/v4). 0 for an out-of-range change; adds can exceed 1; null when unknown.'
                        share_of_reserves:
                          type: number
                          nullable: true
                          description: 'v2 only: amount / reserve before, from the pair''s Sync; null for a pair''s first liquidity or when the Sync was not found.'
                        material:
                          type: boolean
                          nullable: true
                          description: true = a REMOVAL of at least 25 % of reserves (v2) or active liquidity (v3/v4); false = a removal with a known smaller share; null for adds, pool creations and unknown shares.
                  count:
                    type: integer
                  has_more:
                    type: boolean
                  next_before:
                    type: string
                    nullable: true
                  coverage:
                    type: object
                    description: 'Honesty block: events (the actions this response covers — [remove] by default), adds_persisted (true since 2026-09-23), adds_retention_days (7), note, since.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '400':
          description: Invalid query parameters (code invalid_query).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: PRO+ required.
          headers:
