      summary: Peak market cap, drawdown and high-water curve for a Robinhood Chain token…
      description: 'Peak market cap, current drawdown from peak, and a running high-water curve.


        **Two peaks are returned, and they can disagree.** `peak_mc_usd_recorded` is the stored high-water mark every other Robinhood Chain surface keys off (deployer runner-rate, the $40K graduation bar). `peak_mc_usd_observed` is the maximum of the 1-minute candle highs — trade-level truth, and always ≥ the recorded value. The recorded figure is sampled from write batches so it can undercount an intra-batch spike; both are surfaced rather than silently swapping one for the other, which would desync this endpoint from deployer tiering.


        Candle history begins 2026-07-15, so a token that peaked earlier cannot have its peak reconstructed — `observed_covers_full_history` tells you whether the observed figure spans the token''s whole life. Curve binning is chosen server-side (1m→4h) to keep the series bounded.'
