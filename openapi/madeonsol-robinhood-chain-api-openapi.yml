  /rhc/tokens/{address}/bundle:
    get:
      tags:
      - Robinhood Chain
      summary: Launch-bundle detection on a Robinhood Chain token (BASIC+)
      description: 'Detects a coordinated launch bundle in a token''s earliest-buyer cohort and measures how much of what the bundle bought it still holds. Mirrors the Solana `/tokens/{mint}/bundle` detector: rank the first 20 distinct buyers by on-chain order, flag a bundle when 3+ of them make their first buy in the **same block**, then report the cohort''s current-held %. Robinhood Chain is an Arbitrum Orbit L2 with no atomic multi-signer transaction, so there is no `atomic_tx` kind — a detected bundle is `same_block` (else `none`). Scores tokens ingested live (the near-launch window where bundling happens). Field-gated by tier: **BASIC** gets the scalar `bundle` signal only; **PRO** adds the top-10 wallets; **ULTRA** returns the full cohort enriched with alpha-wallet identity (win-rate, bot, KOL).'
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        description: Token address (0x, 40 hex).
      responses:
        '200':
          description: 'OK. `wallet_count` 0 with `bundle_kind: none` when no same-block early-buyer cluster is present.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  token_address:
                    type: string
                  bundle:
                    type: object
                    properties:
                      wallet_count:
                        type: integer
                        description: Bundle-cohort size (0 when none).
                      bundle_kind:
                        type: string
                        enum:
                        - same_block
                        - none
                        description: '`same_block` = 3+ early buyers first-bought in one block; `none` = no cluster. `atomic_tx` does not exist on EVM.'
                      held_ratio:
                        type: number
                        nullable: true
                        description: Net tokens still held ÷ tokens bought, [0,1]. The primary signal.
                      held_pct_of_supply:
                        type: number
                        nullable: true
                        description: Net tokens held ÷ total supply, [0,1]; null when supply is unknown.
                      fully_exited:
                        type: boolean
                        description: True when the cohort holds ≤0.5% of what it bought.
                      buy_volume:
                        type: number
                        description: Cohort cumulative buy-side token volume (human-scaled).
                      tokens_held:
                        type: number
                        description: Cohort net position (Σbuys − Σsells, human-scaled).
                  wallets:
                    type: array
                    description: Empty for BASIC; top-10 for PRO; full cohort for ULTRA.
                    items:
                      type: object
                      properties:
                        rank:
                          type: integer
                          description: Early-buyer rank (1 = first buyer).
                        wallet:
                          type: string
                          description: Buyer wallet (lowercase 0x).
                        held_ratio:
                          type: number
                          nullable: true
                        has_sold:
                          type: boolean
                        is_kol:
                          type: boolean
                          description: Wallet is a tracked RHC KOL.
                        win_rate:
                          type: number
                          nullable: true
                          description: ULTRA only — historical win-rate [0,1].
                        likely_bot:
                          type: boolean
                          description: ULTRA only — bot heuristic from mv_rhc_alpha_wallets.
                        tokens_held:
                          type: number
                          description: ULTRA only — net position, human-scaled.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '400':
