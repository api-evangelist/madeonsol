      summary: Activity summary across your tracked Robinhood Chain wallets (PRO+)
      description: 'Per-wallet buy/sell/volume rollup over the chosen period.


        **Sourced from `rhc_trades` directly, not from a capture log.** The Solana tracker needs a per-subscriber event log because Solana trades are only recorded for wallets somebody asked for; on RHC every swap is already persisted with its trader. Two consequences: a wallet added today reports its **full history** in the period rather than only what happens after you subscribe, and these numbers agree with `/rhc/wallet/{address}` by construction. Tier: **PRO+**.'
      parameters:
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 24h
          - 7d
          - 30d
          default: 7d
      - name: wallet
        in: query
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        description: Restrict to one watched wallet.
      responses:
        '200':
          description: 'OK. `stats_unavailable: true` means the rollup failed and the zeroes are not measurements.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  period:
                    type: string
                  interval:
                    type: string
                  stats_unavailable:
                    type: boolean
                  wallets:
                    type: array
                    items:
