  /rhc/wallet/{address}/positions:
    get:
      tags:
      - Robinhood Chain
      summary: Open positions on Robinhood Chain (PRO+)
      description: 'Only what the wallet is still holding, marked to the current price — the same FIFO pass as `/pnl` without the curve and closed-position payload, for clients polling "what is this wallet in right now".


        **"Open" means FIFO-unmatched buys inside the window: a TRADING position, NOT an on-chain balance.** This cuts both ways and the second direction is the dangerous one: a token acquired by transfer or bridge does not appear, and a token **disposed of by plain ERC-20 transfer rather than sold on a DEX still appears as held**, because only swaps are indexed. Since 2026-10-02 every position is **checked against the chain**: `current_onchain_balance` (balanceOf from our own node, Multicall3, cached 30 s) sits next to `fifo_unmatched_amount`, and `holding_status` says which applies: `HELD` (balance within 0.5 % of FIFO), `PARTIALLY_REDUCED` (0 FIFO; the excess has no cost basis), `BALANCE_UNVERIFIED` (read failed, non-standard token, or our decimals differ from on-chain decimals: fail closed, no value). The pre-existing fields (`token_amount`, `current_value_eth`, `unrealized_eth`, the `summary` totals) keep their FIFO meaning; `summary.holdings` and the `current_holding_value_eth` / `unrealized_known_eth` fields are the proven-holdings view.


        **Attribution floor:** analysis starts at `notes.attribution_complete_from` (2026-07-18), not the full 90 days — `trader_eoa` was written for under half of earlier trades, and a partial view yields positions the wallet no longer holds. `notes.window_clamped` flags when this is what bounds the result. `total_unrealized_eth` is computed against the cost basis of the PRICED subset only — `unpriced_positions` counts what is missing from the totals, so a zero is never mistaken for worthless. Tier: **PRO+**.'
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
      responses:
        '200':
          description: OK. Sorted by current value, then cost basis.
