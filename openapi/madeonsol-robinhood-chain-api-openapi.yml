  /rhc/kol/coordination:
    get:
      tags:
      - Robinhood Chain
      summary: KOL coordination / consensus clustering on Robinhood Chain (BASIC+)
      description: 'Tokens being bought by **multiple distinct tracked KOLs** inside a time window on Robinhood Chain (chain id 4663) — the coordination / consensus signal. Computed read-time from `rhc_kol_trades`: window buys grouped by token, distinct KOL wallets counted, then enriched with in-window sells (net-flow / exit math), token metadata, current price/MC/liquidity and the deployer''s reputation tier. EVM-native fields (`eth_amount`, `evm_address`, 0x). Ranked by distinct KOL count, then buy ETH, then recency. Tier: **BASIC** (any valid key).'
      parameters:
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 1h
          - 6h
          - 24h
          - 7d
          default: 24h
        description: 'Rolling window (alias: `window`). Filters on `traded_at`.'
      - name: min_kols
        in: query
        schema:
          type: integer
          minimum: 2
          maximum: 50
          default: 2
        description: Minimum distinct KOL buyers for a token to qualify.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: min_mc_usd
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 1000000000000
        description: Filter on market cap at the first KOL buy (USD). Tokens with unknown MC at first buy are excluded when a band is set.
      - name: max_mc_usd
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 1000000000000
        description: Upper bound on MC at first KOL buy (USD). Must be ≥ min_mc_usd.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  coordination:
                    type: array
                    items:
                      type: object
                      properties:
                        token_address:
                          type: string
                        token_symbol:
                          type: string
                          nullable: true
                        token_name:
                          type: string
                          nullable: true
                        launchpad:
                          type: string
                          nullable: true
                        is_graduated:
                          type: boolean
                          nullable: true
                        deployer_tier:
                          type: string
                          nullable: true
                          enum:
                          - elite
                          - good
                          - neutral
                          - spammer
                        token_age_minutes:
                          type: integer
                          nullable: true
                        kol_count:
                          type: integer
                          description: Distinct KOL buyers in the window (≥ min_kols).
                        total_buys:
                          type: integer
                        buy_eth:
                          type: number
                          description: Total ETH bought by KOLs in the window.
                        sell_eth:
                          type: number
                          description: Total ETH sold by those KOLs in the window.
                        net_eth:
                          type: number
                          description: buy_eth − sell_eth.
                        signal:
                          type: string
                          enum:
                          - accumulating
                          - distributing
                          description: accumulating when net_eth ≥ 0, else distributing.
                        exited_count:
                          type: integer
                          description: KOLs whose in-window sells exceed their buys.
                        holders_count:
                          type: integer
                          description: kol_count − exited_count.
                        first_buy_at:
                          type: string
                          format: date-time
                        last_buy_at:
                          type: string
                          format: date-time
                        time_to_consensus_sec:
                          type: integer
                          description: Seconds between the first and last KOL buy.
                        market_cap_usd_at_first_buy:
                          type: number
                          nullable: true
                        current_mc_usd:
                          type: number
                          nullable: true
                        peak_mc_usd:
                          type: number
                          nullable: true
                        liquidity_usd:
                          type: number
                          nullable: true
                        liquidity_basis:
                          type: string
                          enum:
                          - v4_virtual_ceiling
                          - measured
                          description: How liquidity_usd was derived. v4_virtual_ceiling = uniswap-v4 virtual reserves clamped to the PoolManager's total holdings — a provable ceiling, not measured per-pool TVL.
                        kols:
                          type: array
                          items:
                            type: object
                            properties:
                              evm_address:
                                type: string
                                description: The KOL's Robinhood-Chain wallet (0x).
                              name:
