    post:
      tags:
      - Robinhood Chain
      summary: Create an RHC first-touch subscription (ULTRA+)
      description: 'Push the moment a token receives its **first** buy from a tracked KOL — the earliest signal available. A second KOL buying the same token produces nothing; dedup is structural (one first-touch row per token, ever).


        **Filters are `.strict()`** — an unknown key is a 400, not a silently ignored filter. ⚠️ There is deliberately **no `min_scout_tier` / `min_n_touches`** as on Solana: RHC has no scout scoring, and a filter that silently matched nothing would be worse than its absence. `min_kol_winrate` and `strategy` are the quality gates instead. An unknown market cap is dropped by the MC band, never passed.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 64
                filters:
                  type: object
                  additionalProperties: false
                  properties:
                    kol:
                      type: string
                      description: Lowercase 0x EVM address
                    min_first_buy_eth:
                      type: number
                      minimum: 0
                    min_kol_winrate:
                      type: number
                      minimum: 0
                      maximum: 1
                      description: Win-rate on CLOSED positions. A KOL who has never sold is unscored and is dropped, not treated as a loser.
                    strategy:
                      type: string
                      enum:
                      - scalper
                      - day_trader
                      - swing
                      - inactive
                      - unscored
                    min_mc_usd:
                      type: number
                    max_mc_usd:
                      type: number
                delivery_mode:
                  type: string
                  enum:
                  - websocket
                  - webhook
                  - both
                  default: websocket
                webhook_url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Created — includes one-time webhook_secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  subscription:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                        nullable: true
                      filters:
                        type: object
                        properties:
                          kol:
                            type: string
                            nullable: true
                          min_first_buy_eth:
                            type: number
                            nullable: true
                          min_kol_winrate:
                            type: number
                            nullable: true
                          strategy:
                            type: string
                            nullable: true
                            enum:
                            - scalper
                            - day_trader
                            - swing
                            - inactive
                            - unscored
                          min_mc_usd:
                            type: number
                            nullable: true
                          max_mc_usd:
                            type: number
                            nullable: true
                      delivery_mode:
                        type: string
                        enum:
                        - websocket
                        - webhook
                        - both
                      webhook_url:
                        type: string
                        format: uri
                        nullable: true
                      is_active:
                        type: boolean
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                  webhook_secret:
                    type: string
                    nullable: true
                    description: One-time HMAC secret — only present when webhook delivery is configured.
                  note:
                    type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
