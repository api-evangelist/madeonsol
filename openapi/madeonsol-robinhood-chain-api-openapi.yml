      summary: One wallet's Robinhood Chain trade tape (PRO+)
      description: 'A single wallet''s swaps, newest first, cursor-paginated (opaque `next_before` keyset). Distinct from `/rhc/trades?token=` — that filters the global tape by TOKEN, this filters by WALLET, which is a different index path (`idx_rhc_trades_trader_eoa_bt`).


        `token_amount` is reconstructed from raw uint256 leg amounts and is **null when it cannot be** — never zero, and never a guess. Tier: **PRO+**.


        **Where the rows come from** (*added 2026-08-29*): closed months older than the newest three move from Postgres to a Parquet archive; pages are split at `history.postgres_from` (ISO) — rows at/after it from Postgres, older rows from the archive reader, same ordering and `before` cursor. `history.archive_used`, `archive_months`, `archive_available` (`null` = not configured) and `truncated` (older history requested but the archive did not answer — retry rather than treating `has_more:false` as the end) mirror `/tokens/{mint}/trades`. Header `X-Read-Source`: `core`, `core+archive` or `archive`.'
