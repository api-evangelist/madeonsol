    get:
      tags:
      - Robinhood Chain
      summary: List RHC price alerts (PRO+)
      description: 'List every Robinhood Chain market-cap price alert you own, active and paused, newest first. Each alert carries its token, the baseline market cap captured at creation, the `drop_pct` / `recovery_pct` thresholds, its current `status` (watching, then dipped, then recovered), the dip low, delivery config and expiry. Alerts are evaluated as trades land (event-driven off the chain trade feed, a few seconds of latency), with periodic table polls as a safety net. The quota counts active alerts only and is separate from Solana: PRO 5, ULTRA 25, BUSINESS 125.'
      responses:
        '200':
          description: OK — { chain, alerts[] }.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          nullable: true
                        token_address:
                          type: string
                        token_symbol:
                          type: string
                          nullable: true
                        baseline_mc_usd:
                          type: number
                          description: Market cap captured at rule creation — the baseline drop_pct is measured against.
                        drop_pct:
                          type: number
                        recovery_pct:
                          type: number
                          nullable: true
                        status:
                          type: string
                          enum:
                          - watching
                          - dipped
                          - recovered
                          - expired
                          description: '`expired` = the rule outlived its window and was deactivated (terminal, like `recovered`).'
                        dip_low_mc_usd:
                          type: number
                          nullable: true
                          description: Lowest MC seen while dipped; ratchets down.
                        dip_fired_at:
                          type: string
                          format: date-time
                          nullable: true
                        delivery_mode:
                          type: string
                          enum:
                          - webhook
                          - websocket
                          - both
                        webhook_url:
                          type: string
                          format: uri
                          nullable: true
                        is_active:
                          type: boolean
                        expires_at:
                          type: string
                          format: date-time
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
          headers:
