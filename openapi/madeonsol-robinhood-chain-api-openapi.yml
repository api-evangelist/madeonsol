  /rhc/trades:
    get:
      tags:
      - Robinhood Chain
      summary: Robinhood Chain DEX trade tape (PRO+)
      description: 'Every Uniswap v2/v3/v4 swap on chain 4663 from our self-hosted node, within seconds of execution. Each row carries the **real trader wallet** (`trader_eoa` — the userOp sender on ERC-4337 transactions, never the router or the bundler), gas/ordering for MEV analysis, pool state, and flags for whether the trader is a tracked KOL or a known deployer. Cursor via `next_before`. Tier: **PRO+**.


        **Where the rows come from** (*added 2026-08-29*): closed months older than the newest three move from Postgres to a Parquet archive; pages are split at `history.postgres_from` (ISO) — rows at/after it from Postgres, older rows from the archive reader, same ordering and `before` cursor. `history.archive_used`, `archive_months`, `archive_available` (`null` = not configured) and `truncated` (older history requested but the archive did not answer — retry rather than treating `has_more:false` as the end) mirror `/tokens/{mint}/trades`. Header `X-Read-Source`: `core`, `core+archive` or `archive`.'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: token
        in: query
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        description: Filter to one token address.
      - name: dex
        in: query
        schema:
          type: string
          enum:
          - uniswap-v2
          - uniswap-v3
          - uniswap-v4
        description: Filter by DEX version.
      - name: action
        in: query
        schema:
          type: string
          enum:
          - buy
          - sell
      - name: min_eth
        in: query
        schema:
          type: number
          minimum: 0
        description: Minimum trade size in ETH.
      - name: before
        in: query
        schema:
          type: string
        description: Opaque cursor from next_before; a bare ISO block_time is also accepted for backward compatibility (loses intra-second position).
      responses:
        '200':
          description: OK. `next_before` is the opaque pagination cursor — pass it back as `before` to page losslessly; `has_more` says whether another page exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  trades:
                    type: array
                    items:
                      type: object
                      properties:
                        block_number:
                          type: integer
                        block_time:
                          type: string
                          format: date-time
                        tx_hash:
                          type: string
                        log_index:
                          type: integer
                        dex:
                          type: string
                        pool:
                          type: string
                        trader:
                          type: string
                          nullable: true
                          description: Swap-log recipient — the ROUTER for aggregated swaps. Use trader_eoa for wallet analytics.
                        trader_eoa:
                          type: string
                          nullable: true
                          description: Authoritative trader wallet. Normally tx.from; on ERC-4337 transactions this is the userOp sender (the account that actually traded) and tx.from — the bundler — is not returned.
                        router:
                          type: string
                          nullable: true
                          description: Router/aggregator contract (tx.to).
                        token_address:
                          type: string
                          nullable: true
                        action:
                          type: string
                          enum:
                          - buy
                          - sell
                          nullable: true
                        eth_amount:
                          type: number
                          nullable: true
                        price_native:
                          type: number
                          nullable: true
                        price_usd:
                          type: number
                          nullable: true
                        mc_usd_at_trade:
                          type: number
                          nullable: true
                        gas_price:
                          type: number
                          nullable: true
                          description: Effective gas price, gwei.
                        tx_index:
                          type: integer
                          nullable: true
                          description: Transaction position within the block (ordering / sandwich detection).
                        method_selector:
                          type: string
                          nullable: true
                          description: 4-byte calldata selector.
                        liquidity:
                          type: number
                          nullable: true
                          description: v3/v4 in-range liquidity at the trade.
                        launchpad:
                          type: string
                          nullable: true
                        is_kol:
                          type: boolean
                          description: True if trader_eoa is a tracked KOL wallet.
                        kol_name:
                          type: string
                          nullable: true
                        deployer_tier:
                          type: string
                          nullable: true
                          enum:
                          - elite
                          - good
                          - neutral
                          - spammer
                          description: Set if trader_eoa is a known deployer.
                  count:
                    type: integer
                  has_more:
                    type: boolean
                    description: True when another page exists beyond this one.
                  next_before:
                    type: string
                    nullable: true
                    description: Opaque (block_time, id) keyset cursor for the next page; null when has_more is false.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
