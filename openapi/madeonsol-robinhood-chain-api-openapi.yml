          - elite
          - good
          - neutral
          - spammer
        description: Filter to one deployer reputation tier (post-filter over the peak-MC-ordered set).
      - name: min_peak
        in: query
        schema:
          type: number
          minimum: 0
        description: Raise the peak-MC floor above the $40K graduation milestone (USD). Never lowers it below $40K.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 200
        description: 'PREFERRED pagination (audit F09 follow-up): the `next_cursor` from a previous page — an opaque strict (peak_mc_at, token_address) keyset, so paging never repeats or skips rows that share a sort value and progresses with limit=1 through runs of identical timestamps. Malformed or tampered → 400.'
      responses:
        '200':
          description: '`graduation_mc` echoes the $40K milestone; `next_peak_mc_at` is the newest peak timestamp on the page.'
