  /rhc/alpha-wallets:
    get:
      tags:
      - Robinhood Chain
      summary: Smart-money wallet ranking on Robinhood Chain (PRO+)
      description: 'Robinhood Chain trader wallets ranked by realized on-chain performance — the reverse of KOL discovery: instead of tracing Solana wallets onto RHC, we rank the wallets we already watch trade. `net_eth` is realized net flow (sell − buy, honest about ignoring unrealized holdings); `win_rate` is the share of traded tokens taken out profitably; `likely_bot` flags atomic-arb/MM fleets (near-perfect win rate across many tokens). Because RHC is dual-natured (launchpad memecoins vs tokenized stocks/stables), `memecoin_share` = launchpad-token trade share — filter with `min_memecoin_share` to isolate memecoin traders, or `max_avg_mc_usd` for low-caps. Derived from our self-hosted node, refreshed every 15 min.


        **Zero-cost-basis dumps, filtered by default** (*added 2026-08-29*): `net_eth` is `sell_eth − buy_eth` per wallet, and for a token a wallet never bought (its own on-chain buy leg unattributed — almost always a deployer/insider allocation sold with no purchase), the whole sale counts as "profit" even though it isn''t trading skill. `zero_cost_share` is the fraction of a wallet''s gross ETH extracted (sell-side) that came from such tokens; wallets at or above 0.5 are excluded from this listing by default (~23% of tracked wallets, concentrated at the very top of a raw net_eth sort) since their ranking and win_rate are inflated by dumps, not performance. The row still exists in the underlying dataset — pass `include_zero_cost_dumps=true` for the unfiltered ranking, and read `zero_cost_share` on each row either way; do not treat a high `net_eth` from this endpoint as trading profit without checking it. Tier: **PRO+**.'
      parameters:
      - name: classification
        in: query
        schema:
          type: string
          enum:
          - all
          - human
          - bot
          - smart_money
          default: all
        description: human = not likely_bot; smart_money = human + net_eth ≥ 2 + win_rate ≥ 0.45.
      - name: identity
        in: query
        schema:
          type: string
          enum:
          - all
          - known_kol
          - unknown
          default: all
        description: known_kol = already mapped to a tracked Solana KOL; unknown = net-new RHC smart money.
      - name: min_memecoin_share
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 1
        description: Minimum share of trades in launchpad memecoins (0.7 ≈ mostly-memecoin traders). Excludes tokenized-stock/stablecoin traders.
      - name: max_avg_mc_usd
        in: query
        schema:
          type: number
