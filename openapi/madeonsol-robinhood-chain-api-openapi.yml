      description: 'Robinhood Chain tokens bought by **2 or more distinct tracked KOLs** inside the window (a consensus signal), ranked by KOL-buyer count then buy volume. Each row is enriched with launchpad, deployer reputation tier, graduation status and current market cap. Tier: **BASIC**.'
      parameters:
      - name: window
        in: query
        schema:
          type: string
          enum:
          - 5m
          - 15m
          - 1h
          - 6h
          - 24h
          default: 1h
        description: Rolling consensus window.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  window:
                    type: string
                    enum:
                    - 5m
                    - 15m
                    - 1h
                    - 6h
                    - 24h
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        token_address:
                          type: string
                        token_symbol:
                          type: string
                          nullable: true
                        token_name:
                          type: string
                          nullable: true
                        launchpad:
                          type: string
                          nullable: true
                          description: noxa | flap | pons | hood.fun | clanker | null.
                        is_graduated:
                          type: boolean
                          nullable: true
                        deployer_tier:
                          type: string
                          nullable: true
                          description: elite | good | neutral | spammer | null.
                        kols_buying:
                          type: integer
                          description: Distinct KOL buyers in the window (>= 2).
                        buys:
                          type: integer
                        sells:
                          type: integer
                        buy_eth:
                          type: number
                        net_eth:
                          type: number
                          description: buy_eth − sell_eth.
                        market_cap_usd:
                          type: number
                          nullable: true
                          description: Current market cap.
                        last_trade_at:
                          type: string
                          format: date-time
                  count:
                    type: integer
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
