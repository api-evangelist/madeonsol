  /rhc/deployer-hunter/alerts:
    get:
      tags:
      - Robinhood Chain
      summary: Deployer signal alert feed on Robinhood Chain (BASIC+)
      description: 'The deployer alert feed on Robinhood Chain (from `rhc_deployer_alerts`) — new deploys and graduations from tracked deployers, newest first. RHC domain values differ from Solana: `tier` is elite | good | neutral | spammer, `priority` is high | medium, `alert_type` is new_deploy | graduated (RHC has no bonded/kol_buy alert types, and no KOL-buy enrichment).


        **Two behaviours changed 2026-07-25.** (1) A tradability filter is now applied **BY DEFAULT** (`liquidity_usd >= $100`; unknown liquidity fails it) — the feed was serving alerts on tokens that had pumped and drained, one at $45K MC against $68 of liquidity. Pass `include_untradeable=true` for the raw tape; the active filter is echoed as `tradability_filter`. (2) `tier` and the `message` explaining it are now resolved at **READ time** from the live deployer rollup instead of being frozen at insert, so a demoted deployer can no longer be advertised as good-tier indefinitely. The original snapshot is preserved as `tier_at_alert`, with `tier_is_stale` flagging disagreement. Rows also carry `liquidity_usd` and `current_mc_usd`.


        **Paging (2026-09-21, audit F09 follow-up):** the tradability and tier gates are served by a bounded SCAN over (event_at DESC, id DESC) — `has_more` is false only at the real end, `scan.scan_truncated` says the budget ran out first; page with `cursor=` (`next_cursor`). Alerts with a NULL event_at (none in production) are excluded.


        Tier: **BASIC** (any valid key) — **ULTRA** gets the full requested `limit`, while BASIC/PRO share a 50-alert cap per request.'
      parameters:
      - name: deployer_tier
        in: query
        schema:
          type: string
          enum:
          - elite
          - good
          - neutral
          - spammer
        description: Filter to one deployer reputation tier. Applied to the RESOLVED (read-time) tier, not the stored snapshot, so the filter and the reported `tier` always agree.
      - name: include_untradeable
        in: query
        schema:
          type: boolean
          default: false
        description: Set true to disable the default liquidity_usd >= $100 tradability filter and receive the raw alert tape.
      - name: priority
        in: query
        schema:
          type: string
          enum:
          - high
          - medium
        description: Filter by alert priority.
      - name: alert_type
        in: query
        schema:
          type: string
          enum:
          - new_deploy
          - graduated
      - name: launchpad
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 32
        description: Filter to one launchpad.
      - name: min_mc
        in: query
        schema:
          type: number
          minimum: 0
        description: Minimum market cap at alert time (USD).
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
        description: Capped at 50 for BASIC/PRO; ULTRA gets the full requested value.
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: 'Incremental polling: return only alerts with `event_at` strictly newer than this ISO timestamp. Pass back `next_event_at` from the previous response to receive just what is new.'
      - name: before
        in: query
        schema:
          type: string
          format: date-time
        description: 'Cursor: return only alerts with `event_at` strictly older than this ISO timestamp. Pass `next_before` from the previous response to page backwards. Takes precedence over `offset`.'
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        description: Offset pagination (RAW rows, before the gates), used when no cursor is supplied. Prefer `cursor` for stable paging over a live feed.
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 200
        description: 'PREFERRED pagination (audit F09 follow-up): the `next_cursor` from a previous page — an opaque strict (event_at, id) keyset, so paging never repeats or skips rows that share a sort value and progresses with limit=1 through runs of identical timestamps. Malformed or tampered → 400. Cannot be combined with `before=` or `offset=` (400).'
      responses:
        '200':
          description: '`next_event_at` is the newest event_at on the page (poll cursor); `data_age_seconds` is the age of the newest alert.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        deployer_address:
                          type: string
                          description: Deployer wallet (0x).
                        token_address:
                          type: string
                        token_symbol:
                          type: string
                          nullable: true
                        token_name:
                          type: string
                          nullable: true
                        alert_type:
                          type: string
                          enum:
                          - new_deploy
                          - graduated
                        title:
                          type: string
                          nullable: true
                        message:
                          type: string
                          nullable: true
                        launchpad:
                          type: string
                          nullable: true
                        tier:
                          type: string
                          nullable: true
                          enum:
                          - elite
                          - good
                          - neutral
                          - spammer
                          description: Deployer reputation tier resolved at READ time from the live deployer rollup (falls back to the snapshot when the deployer is not in the rollup).
                        tier_at_alert:
                          type: string
                          nullable: true
                          enum:
                          - elite
                          - good
                          - neutral
                          - spammer
                          description: Snapshot of the tier written when the alert fired.
                        tier_is_stale:
                          type: boolean
                          description: true when the read-time tier differs from tier_at_alert.
                        mc_at_alert:
                          type: number
                          nullable: true
                          description: Market cap when the alert fired (USD).
                        liquidity_usd:
                          type: number
                          nullable: true
                          description: Token liquidity now (USD).
                        liquidity_basis:
                          type: string
                          enum:
                          - v4_virtual_ceiling
                          - measured
                          description: 'How liquidity_usd was derived. A uniswap-v4 row passing the $100 tradability filter is a CEILING-pass: its figure is virtual reserves clamped to the PoolManager''s total holdings, not measured per-pool TVL.'
                        current_mc_usd:
                          type: number
                          nullable: true
                          description: Token market cap now (USD).
                        risk:
                          $ref: '#/components/schemas/RhcTokenRiskSummary'
                        priority:
                          type: string
                          enum:
                          - high
                          - medium
                        is_active:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                        event_at:
                          type: string
                          format: date-time
                          nullable: true
                  limit:
                    type: integer
                  offset:
                    type: integer
                  tradability_filter:
                    type: string
                    description: 'The active tradability gate, echoed: `liquidity_usd >= $100`, or `off (include_untradeable=true)`.'
                  liquidity_note:
                    type: string
                    description: Constant statement of the uniswap-v4 ceiling semantics — a v4 row passing the tradability filter is a ceiling-pass; per-row `liquidity_basis` says which rows that applies to.
                  next_event_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Newest event_at on this page — pass as ?since= to poll forward.
                  next_before:
                    type: string
                    format: date-time
                    nullable: true
                    description: 'Legacy cursor — event_at of the last row consumed (returned or gated out); pass as ?before= to page backward. Strict: skips alerts sharing that event_at. Prefer next_cursor.'
                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque keyset cursor for the next (older) page — pass as `cursor=`. null = end of feed. PREFERRED over the strict-timestamp legacy cursor, which skips same-timestamp siblings of the boundary row.
                  has_more:
                    type: boolean
                    description: false only when the candidate feed is exhausted (not merely when the page is short).
                  scan:
                    type: object
                    description: 'Present when a filter had to be applied after the candidate fetch (audit F09): has_more is then false only when the candidates ran out, and scan_truncated=true means the per-request scan budget ran out first — more matches MAY exist past next_cursor.'
                    properties:
                      post_filtered:
                        type: boolean
                      scanned:
                        type: integer
                        description: Candidate rows examined
                      scan_truncated:
                        type: boolean
                        description: The per-request scan budget ran out before `limit` matches — more matches MAY exist past the cursor/offset
                      scan_budget:
                        type: integer
                  data_age_seconds:
                    type: integer
                    nullable: true
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '400':
          description: Invalid query parameters.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-madeonsol-tier: FREE
      x-badges:
      - name: FREE
        position: after
        color: '#64748b'
      operationId: getRhcDeployerHunterAlerts
      x-operation-id-source: derived
  /rhc/deployer-hunter/recent-bonds:
    get:
      tags:
      - Robinhood Chain
      summary: Recent graduations on Robinhood Chain (BASIC+)
      description: 'Recently graduated tokens on Robinhood Chain, newest first. On RHC a "graduation" is the **$40K peak-MC milestone**, not a bonding-curve completion — most RHC launchpads are direct-to-DEX. The set is defined purely by `peak_mc_usd ≥ $40,000` (independent of the sometimes-unreliable `is_graduated` flag), then enriched with token metadata and the deployer''s reputation tier. Ordered by (peak_mc_at DESC, token_address DESC); page with `cursor=` (`next_cursor`, added 2026-09-21). `deployer_tier` is served by a bounded scan — see `has_more` / `scan`. Tier: **BASIC** (any valid key).'
      parameters:
      - name: deployer_tier
