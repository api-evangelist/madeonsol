    post:
      tags:
      - Robinhood Chain
      summary: Create an RHC copy-trade rule (PRO+)
      description: 'Mirror chosen Robinhood Chain wallets to a webhook or the `rhc:copytrade:signals` WebSocket channel. Any valid 0x source wallet fires, KOL or not (`source_admission: any_wallet`, production since 2026-10-04; KOL membership is enrichment only and copy-trade sources do not use Wallet Tracker quota); `operational_state` says whether the rule can fire right now. A source trade must be at most 5 s old by chain time. Addresses are **lowercased on write** — the evaluator matches the lowercased event address, so a checksummed rule would never fire. Amounts are ETH. Idempotency is `(subscription_id, tx_hash)`, so a replayed event can never double-fire.


        **No `min_mc_usd`/`max_mc_usd`**: the RHC trade event carries no market cap, so an MC band could only be a per-event database lookup on a ~3.3M trades/day chain or a filter that silently never matches. Returns `webhook_secret` once, never again.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source_wallets
              - sizing_amount
              properties:
                name:
                  type: string
                  maxLength: 64
                source_wallets:
                  type: array
                  minItems: 1
                  maxItems: 250
                  items:
                    type: string
                    description: Lowercase 0x EVM address
                min_trade_eth:
                  type: number
                  minimum: 0
                  default: 0
                only_action:
                  type: string
                  enum:
                  - buy
                  - sell
                  - both
                  default: buy
                sizing_mode:
                  type: string
                  enum:
                  - fixed
                  - proportional
                  - percent_source
                  default: fixed
                sizing_amount:
                  type: number
                  exclusiveMinimum: 0
                  description: ETH when sizing_mode=fixed, else a multiplier of the source trade
                delivery_mode:
                  type: string
                  enum:
                  - webhook
                  - websocket
                  - both
                  default: webhook
                webhook_url:
                  type: string
                  format: uri
                  description: HTTPS only. Required unless delivery_mode is websocket.
      responses:
        '200':
          description: Created — includes one-time webhook_secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  subscription:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                        nullable: true
                      source_wallets:
                        type: array
                        items:
                          type: string
                      min_trade_eth:
                        type: number
                      only_action:
                        type: string
                        enum:
                        - buy
                        - sell
                        - both
                      sizing_mode:
                        type: string
                        enum:
                        - fixed
                        - proportional
                        - percent_source
                      sizing_amount:
                        type: number
                      delivery_mode:
                        type: string
                        enum:
                        - webhook
                        - websocket
                        - both
                      webhook_url:
                        type: string
                        format: uri
                        nullable: true
                      is_active:
                        type: boolean
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                      source_wallets_tracked:
                        $ref: '#/components/schemas/RhcCopytradeTrackedWallets'
                      source_wallets_untracked:
                        $ref: '#/components/schemas/RhcCopytradeUntrackedWallets'
                      operational_state:
                        $ref: '#/components/schemas/RhcCopytradeOperationalState'
                      source_admission:
                        $ref: '#/components/schemas/RhcCopytradeSourceAdmission'
                      monitoring_reasons:
                        $ref: '#/components/schemas/RhcCopytradeMonitoringReasons'
                      warnings:
                        $ref: '#/components/schemas/RhcCopytradeRuleWarnings'
                  warnings:
                    $ref: '#/components/schemas/RhcCopytradeRuleWarnings'
                  webhook_secret:
                    type: string
                    nullable: true
