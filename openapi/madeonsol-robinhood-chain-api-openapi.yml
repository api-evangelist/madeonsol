              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  is_deployer:
                    type: boolean
                  address:
                    type: string
                  deployer:
                    type: object
                    nullable: true
                  success_metric:
                    type: string
                    example: graduated ($40K+ peak market cap)
                  trajectory:
                    type: object
                    nullable: true
                    properties:
                      current_streak:
                        type: object
                        properties:
                          type:
                            type: string
