    post:
      tags:
      - Robinhood Chain
      summary: Create an RHC coordination rule (PRO+)
      description: 'Fires when `min_kols` distinct tracked KOLs buy the same Robinhood Chain token inside `window_minutes` and the cluster scores at least `min_score`. `cooldown_min` suppresses repeats per (rule, token); `score_jump_break` is an **early exit from that cooldown** when the score climbs by at least that many points (the re-fire is flagged `is_rearm`). An unknown market cap is **dropped** by the MC band, never treated as inside it.


        **Scoring** uses the same v1 scorer as the Solana coordination alerts, so the number is comparable — with two differences recorded per-signal in `score_inputs`: `quality` is real (from the RHC KOL win-rate matview) while `earliness` is **defaulted**, because RHC has no early-entry measure. `density` is 1.0 by construction inside a rule''s own window, so live scores start at 30.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 64
                min_kols:
                  type: integer
                  minimum: 2
                  maximum: 50
                  default: 3
                window_minutes:
                  type: integer
                  minimum: 1
                  maximum: 60
                  default: 15
                min_score:
                  type: integer
                  minimum: 0
                  maximum: 100
                  default: 0
                cooldown_min:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  default: 30
                score_jump_break:
                  type: integer
                  minimum: 0
                  maximum: 100
                  default: 20
                min_mc_usd:
                  type: number
                  nullable: true
                max_mc_usd:
                  type: number
                  nullable: true
                delivery_mode:
                  type: string
                  enum:
                  - websocket
                  - webhook
                  - both
                  default: websocket
                webhook_url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Created — includes one-time webhook_secret and a `scoring` block.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  rule:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                        nullable: true
                      min_kols:
                        type: integer
                      window_minutes:
                        type: integer
                      min_score:
                        type: integer
                      cooldown_min:
                        type: integer
                      score_jump_break:
                        type: integer
                      min_mc_usd:
                        type: number
                        nullable: true
                      max_mc_usd:
                        type: number
                        nullable: true
                      delivery_mode:
                        type: string
                        enum:
                        - websocket
