  /rhc/tokens/{address}/buyer-quality:
    get:
      tags:
      - Robinhood Chain
      summary: Early-buyer quality on a Robinhood Chain token (BASIC+)
      description: 'A 0–100 quality read on a token''s earliest distinct buyer cohort (first 20), derived live from `rhc_trades` and enriched with `mv_rhc_alpha_wallets` history. Full parity with the Solana scorer: win-rate, KOL-presence, bot-domination and **bundle-buyer** legs (a bundled early buyer in the top 10 costs −5; a heavily bundled cohort of >10 costs −15), plus the **dump-cluster ensemble** — `dump_cluster_count` counts early buyers that repeatedly sit in launches that crashed off their own peak (rolling 42-day model, out-of-sample validated on RHC). Dump-cluster is **informational**: it flags the pattern but does not move the score. Tier: **BASIC** (any valid key).'
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        description: Token address (0x, 40 hex).
      responses:
        '200':
          description: OK. Neutral score (50) with `note` when the token has no buyer history yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  token_address:
                    type: string
                  current_mc_usd:
                    type: number
                    nullable: true
                  cohort_selection:
                    type: string
                    enum:
                    - distinct_first_buy
                    - legacy_row_window
                    description: distinct_first_buy = the first 20 DISTINCT buyer EOAs by their first buy (block, tx index, log index), selected before the limit. legacy_row_window = pre-rhc/011 fallback (oldest 300 buy rows, deduped — a repeat buyer can crowd out later distinct buyers); served only until that migration is applied.
                  quality:
                    type: object
                    properties:
                      score:
                        type: integer
                        minimum: 0
                        maximum: 100
                      confidence:
                        type: string
                        enum:
                        - insufficient_data
                        - low
                        - medium
                        - high
                        description: 'Confidence in the PREDICTIVE inputs: counts only buyers whose win rate fed the score (≥3 tokens of history, not bot-flagged, not zero-cost-dump dominated). insufficient_data = none did — the score is the neutral-50 default plus penalties. 1 → low, 5+ → medium, 11+ → high.'
                      signal:
                        type: string
                        enum:
                        - positive
                        - neutral
                        - negative
                      breakdown:
                        type: object
                        properties:
                          wallets_with_history:
                            type: integer
                            description: Buyers with ≥3 tokens of history (cohort identification — not predictive)
                          qualified_win_rate_wallets:
                            type: integer
                            description: Buyers whose win rate fed the score — the basis of confidence
                          early_buyers_analyzed:
                            type: integer
                          alpha_wallet_count:
                            type: integer
                          kol_count:
                            type: integer
                          bundle_buyer_count:
                            type: integer
                            description: Early buyers flagged as part of a same-block launch bundle (mig 255).
                          dump_cluster_count:
                            type: integer
                            description: Early buyers on the rolling dump-cluster list (≥5 crashed-off-peak cohorts, 0 runner cohorts, trailing 42d, OOS-validated). Informational — high count = strong dump signal.
                          recycled_early_buyer_count:
                            type: integer
                            description: Early buyers with ≥5 recent early-buyer appearances of any kind (dump_cluster_count is a subset).
                          avg_historical_win_rate:
                            type: number
                            nullable: true
                            description: Percent (0–100), non-bot buyers with ≥3 tokens of history.
                          bot_dominated:
                            type: boolean
                  coverage:
                    type: object
                    description: Signal availability. Dump-cluster is available but informational (does not move the score).
                    properties:
                      bundle_detection:
                        type: string
                        enum:
                        - available
                      dump_cluster_signal:
                        type: string
                        enum:
                        - available
                      note:
                        type: string
                      earliest_buyers_caveat:
                        type: string
                        description: For launches before 2026-07-18 the earliest-buyers cohort is the earliest 20 ATTRIBUTED buyers (trader_eoa backfill pending), not necessarily the first 20 buyers.
                  note:
                    type: string
                    description: Present only when buyer data is insufficient.
          headers:
