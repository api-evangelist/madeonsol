  /rhc/tokens/{address}/risk:
    get:
      tags:
      - Robinhood Chain
      summary: EVM-native risk assessment for a Robinhood Chain token (PRO+)
      description: 'Risk assessment computed **live** against our own Robinhood Chain node at the chain head.


        **This is not the Solana risk model.** EVM has no mint or freeze authority. Measured across 300 random Robinhood Chain tokens, only 2.3% even expose an `owner()` function and 0% expose `mint` in their own bytecode — so an absent flag is the norm, not a safety signal. The axes that actually discriminate here are proxy upgradeability, LP custody, and sellability.


        **Sellability is the strongest signal.** A sell is simulated through the router at head using state overrides, which detects a token that can be bought but not sold. It is computed live, never cached — whether a token is sellable can change the moment an owner flips a setting.


        Proxies are resolved before capability scanning: EIP-1167 minimal proxies (14% of tokens) carry zero selectors of their own, and the tokenized equities are beacon proxies whose *implementation* is what exposes `mint`/`pause`/`upgradeTo`. `lp_custody` is only read for uniswap-v2 pools; v3/v4 liquidity sits in an LP NFT whose custody needs a position-manager trace, and is reported `unknown` rather than guessed.'
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        description: Token address (0x, 40 hex).
      responses:
        '200':
          description: OK. Absent capability flags are the norm on this chain and are not a safety guarantee.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: string
                    enum:
                    - robinhood
                  token_address:
                    type: string
                  checked_at:
                    type: string
                    format: date-time
                    description: Computed live; always current.
                  code_size:
                    type: integer
                    description: Runtime bytecode length in bytes.
                  is_contract:
                    type: boolean
                  proxy:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - none
                        - eip1167_minimal
                        - eip1967
                        - eip1967_beacon
                        - legacy
                      implementation:
                        type: string
                        nullable: true
                      admin:
                        type: string
                        nullable: true
                      upgradeable:
                        type: boolean
                        description: False for eip1167_minimal — the target is baked into immutable code.
                  owner:
                    type: object
                    properties:
                      model:
                        type: string
                        enum:
                        - none
                        - renounced
                        - eoa
                        - contract
                        description: '`none` = no owner function at all, which is NOT the same as renounced.'
                      address:
                        type: string
                        nullable: true
                  capabilities:
                    type: object
                    properties:
                      can_mint:
                        type: boolean
                      can_pause:
                        type: boolean
                      has_access_control:
                        type: boolean
                      selectors_found:
                        type: array
                        items:
                          type: string
                  liquidity:
                    type: object
                    properties:
                      primary_pool:
                        type: string
                        nullable: true
                      dex:
                        type: string
                        nullable: true
                      lp_custody:
                        type: string
                        enum:
                        - burned
                        - locked
                        - at_risk
                        - unknown
                      lp_burned_pct:
                        type: number
                        nullable: true
                      last_removed_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: Most recent LP withdrawal observed on this token (uniswap-v2/v3 `Burn`, uniswap-v4 negative `ModifyLiquidity`). `null` means none seen since removal capture began on 2026-08-05 — not that none ever happened.
                  sellability:
                    type: object
                    properties:
                      sellable:
                        type: string
                        enum:
                        - 'yes'
                        - 'no'
                        - unknown
                      reason:
                        type: string
                        nullable: true
                  flags:
                    type: array
                    items:
                      type: string
                    description: Derived from the fields above. Includes `lp_removed_24h` when liquidity was withdrawn from this token in the last 24 hours.
                  score:
                    type: integer
                    nullable: true
                    description: 0–100, conservative. Absence of evidence is not evidence of safety.
                  assessment:
                    type: object
                    description: 'Whether every input was actually read (2026-09-21). A failed read is an UNKNOWN input, never a silent all-clear: e.g. lp_removal_history unknown ⇒ the absence of `lp_removed_24h` proves nothing; observed_sells unknown ⇒ a simulated sell revert is reported sellable=unknown, not a honeypot.'
                    properties:
                      status:
                        type: string
                        enum:
                        - complete
                        - incomplete
                      unknown_inputs:
                        type: array
                        items:
                          type: string
                          enum:
                          - lp_removal_history
                          - pools
                          - holder_probes
                          - observed_sells
                  coverage:
                    type: object
                    description: What this model does and does not read — see the endpoint description.
                    properties:
                      model:
                        type: string
                        enum:
                        - evm_native
                      liquidity_basis:
                        type: string
                        enum:
                        - v4_virtual_ceiling
                        - measured
                        description: 'Basis of any liquidity_usd figure quoted for this token: uniswap-v4 values are virtual reserves clamped to the PoolManager''s total holdings — a provable ceiling, not measured per-pool TVL.'
                      liquidity_note:
                        type: string
                      note:
                        type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
