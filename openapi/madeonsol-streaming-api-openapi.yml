openapi: 3.2.0
info:
  title: MadeOnSol Streaming API
  version: 1.20.0
  description: Real-time Solana & Robinhood Chain trading intelligence — KOL wallet trades, deployer reputation, token buyer-quality scoring, wallet tracking, and copy-trade signals across both chains (Robinhood Chain paths under `/rhc/*`).
  contact:
    name: MadeOnSol
    url: https://madeonsol.com/contact
  license:
    name: Proprietary
    url: https://madeonsol.com/terms
servers:
- url: https://madeonsol.com/api/v1
  description: Production
security:
- BearerAuth: []
tags:
- name: Streaming
  description: WebSocket stream tokens and live session management — 30 channels (16 Solana + 14 Robinhood Chain) on one socket, with seq/id on event frames and resume (memory, then up to 60 minutes of backfill from storage). PRO+.
paths:
  /stream/token:
    post:
      tags:
      - Streaming
      summary: Get your WebSocket stream token
      description: Returns your stream token plus the WebSocket URL for the realtime stream.
      responses:
        '200':
          description: 'OK — { token, ws_url, expires_at: null, next_refresh_at: null, rotated, lifetime, dex_ws_url?, channels[], token_prices: { ... }, named_subscriptions: { ... } }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    nullable: true
                    description: Always null — tokens do not expire, kept for wire compatibility
                  next_refresh_at:
                    type: string
                    nullable: true
                    description: Always null
                  rotated:
                    type: boolean
                    description: true when this call replaced a previous token (rotate:true was sent, or an existing token was minted fresh)
                  lifetime:
                    type: string
                    description: Human-readable explanation of the non-expiring token lifecycle
                  ws_url:
                    type: string
                    format: uri
                  dex_ws_url:
                    type: string
                    format: uri
                    description: 'Present for ULTRA/BUSINESS only — the DEX firehose socket (wss://madeonsol.com/ws/v1/dex-stream). Frames: `dex:trades` (one normalized trade per transaction, the signer''s net effect; dedupe by tx_signature), in-band `dex:graduations` on mint-scoped subscriptions, and, since 2026-09-22, the opt-in per-pool view: subscribe with `legs: true` (or `"only"`) to receive per transaction one `dex:route` {signature, slot, signer, hop_count, leg_ids[], shape, decoded_complete, undecoded_program_ids[], liquidity_actions[], router_program, signer_net[], trade_mint} and one `dex:leg` per decoded pool swap {leg_id = `<signature>:<instruction_index>[.<inner_index>]` (stable live and on replay), program, venue, pool_model, pool, pool_kind, pool_authority, vault_in, vault_out, token_in/token_out {mint, amount_raw (integer string), decimals, amount_ui, native}, side, amount_basis, is_route_member}, followed by the unchanged `dex:trades` frame exactly once (omitted with `legs: "only"`). Liquidity deposits/withdrawals are never a leg (listed on the route). The `subscribed` ack of a legs subscription carries `coverage.decodable_programs`; a route touching a program we do not decode says `decoded_complete: false` and names it. **Liquidity events (2026-09-23):** subscribe with `liquidity: true` (in addition to trades) or `"only"` (liquidity frames only; cannot be combined with `legs`) to receive `dex:liquidity` {id = `<signature>:<ix>[.<inner>]`, action pool_created | add | remove, program, venue, instruction, pool, pool_kind, pool_model, mints[{mint, amount_raw, decimals, side in|out}], lp_mint, owner, signer, amount_basis, reserves_before[] / reserves_after[] (raw vault balances), share_of_reserves (constant-product only), depth_effect, material (a removal of at least 25 % of reserves)}. Filters per subscription: token_mint(s), wallet(s), pool(s), dex, program (one of them is required with `"only"`), actions, min_share_of_reserves, material_only. Only liquidity instructions proven by a real transaction fixture are emitted (listed with `emits_events` in the ack''s `liquidity_coverage`); other recognised ones appear on the route as `event: false`. Concentrated pools (CLMM, Whirlpool, DLMM) report share and depth as unknown; Meteora DAMM v1, Raydium LaunchLab and Moonshot are not emitted; there is no USD field and `min_usd` is rejected. Replay from the in-memory ring only; no durable resume (`not_reconstructable`). Full protocol in docs/api.md § DEX Firehose.'
                  usage:
                    type: string
                  subscribe_example:
                    type: object
                    properties:
                      type:
                        type: string
                      channels:
                        type: array
                        items:
                          type: string
                  channels:
                    type: array
                    items:
                      type: string
                    description: The full registry of subscribable channel names
                  token_prices:
                    type: object
                    description: Details for the token:prices channel, the one channel requiring a subscribe filter
                    properties:
                      subscribe_example:
                        type: object
                      mint_cap:
                        type: integer
                        nullable: true
                        description: Max mints per connection for the caller's tier
                      note:
                        type: string
                  rhc_token_prices:
                    type: object
                    description: Details for the rhc:token_prices channel (address-scoped Robinhood Chain price ticks; filters.addresses required)
                    properties:
                      subscribe_example:
                        type: object
                      address_cap:
                        type: integer
                        nullable: true
                        description: Max addresses per connection for the caller's tier (counted across named subscriptions)
                      coalesce_ms:
                        type: integer
                        description: At most one tick per address per this many ms
                      note:
                        type: string
                  named_subscriptions:
                    type: object
                    description: 'Named subscriptions: several independent channel + filter sets on one socket (subscribe with sub_id; update / unsubscribe / list)'
                    properties:
                      subscribe_example:
                        type: object
                      max_per_connection:
                        type: integer
                        nullable: true
                        description: Max subscriptions per connection for the caller's tier, the default one included (PRO 5, ULTRA 10, BUSINESS 20)
                      note:
                        type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: postStreamToken
      x-operation-id-source: derived
  /stream/sessions:
    get:
      tags:
      - Streaming
      summary: List your live WebSocket sessions
      description: List your live WebSocket sessions across both stream services (event stream + DEX firehose). Each entry's `id` can be passed to DELETE /stream/sessions/{id} to free its connection slot — useful when a deploy overlap leaves a half-open socket holding a slot and reconnects hit the 4002 connection limit. Reflects live in-memory state, not historical logs. PRO/ULTRA only.
      responses:
        '200':
          description: 'OK — { sessions: [{ id, service, tier, channels, connected_at, remote_ip, messages_sent }], count }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          nullable: true
                        service:
                          type: string
                          enum:
                          - ws-streaming
                          - dex-stream
                        tier:
                          type: string
                        channels:
                          type: array
                          items:
                            type: string
                        connected_at:
                          type: string
                          format: date-time
                        remote_ip:
                          type: string
                          nullable: true
                        messages_sent:
                          type: integer
                  count:
                    type: integer
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: getStreamSessions
      x-operation-id-source: derived
  /stream/sessions/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        example: '48213'
      description: Session id from GET /stream/sessions
    delete:
      tags:
      - Streaming
      summary: Terminate a stream session
      description: Force-close one of your own live WebSocket sessions and release its connection slot immediately (closes the socket with code 4002). You can only terminate your own sessions. PRO/ULTRA only.
      responses:
        '200':
          description: 'OK — { evicted: true, id }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  evicted:
                    type: boolean
                  id:
                    type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '404':
          description: No live session with that id for your key
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: deleteStreamSessionsById
      x-operation-id-source: derived
components:
  headers:
    XRateLimitReset:
      description: When the window resets, as a Unix epoch in SECONDS (next 00:00 UTC for the daily quota; about 60 s ahead for a per-minute bucket).
      schema:
        type: integer
      example: 1791158400
    XRateLimitRemaining:
      description: Calls left in that window. `0` on a quota 429.
      schema:
        type: integer
        minimum: 0
      example: 9412
    XDataDelay:
      description: 'Free-tier only: the feed in this body is delayed by this many seconds (same value as the body''s `delay_seconds`). Absent on real-time responses.'
      schema:
        type: integer
        minimum: 1
      example: 300
    XRateLimitLimit:
      description: 'Size of the rate-limit window this call was counted against: the daily quota for your tier on data endpoints, the per-minute bucket on `/stream/token` (10) and `/stream/sessions` (30), the hourly allowance for the public demo key. Sent once the key has been authenticated and rate-limited, so it is absent on authentication-stage errors.'
      schema:
        type: integer
        minimum: 0
      example: 10000
    XMadeOnSolQuotaWarning:
      description: 'Free-tier only, past about 70 % of the daily quota: a human-readable usage line with an upgrade link.'
      schema:
        type: string
      example: '150/200 used - upgrade for 50x higher limits: https://madeonsol.com/checkout?tier=PRO'
    XRequestId:
      description: Unique id of this response. On responses built after authentication it is also the `request_id` of the audit-log row for the call, so quote it in a support request. Present on every response of the keyed API.
      required: true
      schema:
        type: string
        format: uuid
      example: 3f6c1d2e-8a4b-4f7e-9c21-5b0d7e6a9f13
    XRateLimitUsed:
      description: Calls used in that window (`limit − remaining`).
      schema:
        type: integer
        minimum: 0
      example: 588
    RetryAfter:
      description: Seconds to wait before retrying (RFC 9110 delay-seconds, at least 1). Sent on every 429 (quota, concurrency, authentication-failure) and every 503; when the body carries `retry_after_seconds` it is the same value.
      required: true
      schema:
        type: integer
        minimum: 1
      example: 10
  schemas:
    DemoKeyNotAllowedError:
      type: object
      description: 403 for the public demo key (`msk_demo_…`) outside its three-endpoint allow-list. `endpoint_tier` is the endpoint's real minimum plan (null when unknown).
      required:
      - error
      - message
      - allowed_endpoints
      properties:
        error:
          type: string
          enum:
          - demo_key_endpoint_not_allowed
        message:
          type: string
        endpoint_tier:
          type: string
          nullable: true
          enum:
          - FREE
          - PRO
          - ULTRA
          - BUSINESS
          - ENTERPRISE
          - null
        allowed_endpoints:
          type: array
          items:
            type: string
        signup_url:
          type: string
          format: uri
        upgrade_url:
          type: string
          format: uri
          description: Only when the endpoint's tier can be bought at /checkout.
    ConcurrencyLimitError:
      type: object
      description: '429 from the heavy-query limiter: too many heavy requests in flight for this key (`concurrency`) or for the whole server (`capacity`). Clears as soon as in-flight requests finish.'
      required:
      - error
      - error_kind
      - retry_after_seconds
      properties:
        error:
          type: string
        error_kind:
          type: string
          enum:
          - concurrency
          - capacity
        retry_after_seconds:
          type: number
        max_concurrent:
          type: integer
        support:
          type: string
        _rid:
          type: string
    TierRequiredError:
      type: object
      description: 403 when the key's tier is below the endpoint's (or a parameter's) gate. `required_tier` matches the operation's `x-madeonsol-tier` or `x-madeonsol-feature-tiers`. ENTERPRISE gates return `contact` instead of `upgrade`.
      required:
      - error
      - message
      - your_tier
      - required_tier
      properties:
        error:
          type: string
          enum:
          - tier_required
        message:
          type: string
        feature:
          type: string
        your_tier:
          type: string
          enum:
          - BASIC
          - PRO
          - ULTRA
          - BUSINESS
          - ENTERPRISE
        required_tier:
          type: string
          enum:
          - PRO
          - ULTRA
          - BUSINESS
          - ENTERPRISE
        upgrade:
          type: object
          description: The plan that lifts this limit, with price and a checkout link.
          properties:
            tier:
              type: string
              enum:
              - PRO
              - ULTRA
              - BUSINESS
              - ENTERPRISE
            price_eur_per_month:
              type: number
            price_usdc_per_month:
              type: number
            daily_limit:
              type: integer
            burst_limit:
              type: integer
            pitch:
              type: string
            url:
              type: string
            upgrade_url:
              type: string
              format: uri
            reactivate:
              type: boolean
              description: Present (true) when the key's paid subscription has just lapsed and `tier` is the plan it held.
            prior_tier:
              type: string
              enum:
              - PRO
              - ULTRA
              - BUSINESS
        contact:
          type: object
          properties:
            url:
              type: string
            contact_url:
              type: string
            pitch:
              type: string
        support:
          type: string
        _rid:
          type: string
    ServiceUnavailableError:
      type: object
      description: '503: a temporary capacity or maintenance condition (e.g. a Postgres statement timeout during a partition move, or the API-key lookup itself being unavailable). Retry after `Retry-After` seconds.'
      required:
      - error
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable code where one exists, e.g. `auth_backend_unavailable`.
        error_kind:
          type: string
          description: e.g. `statement_timeout`, `auth_backend`
        retry_after_seconds:
          type: number
        retryable:
          type: boolean
        support:
          type: string
        _rid:
          type: string
    RateLimitError:
      type: object
      description: '429 when a quota is exhausted: the daily quota, the per-minute burst, or a free-tier network/key-rotation cap. `datasets` is added on `daily` only.'
      required:
      - error
      - error_kind
      - message
      - tier
      - limit
      - resets_at
      properties:
        error:
          type: string
          enum:
          - rate_limit_exceeded
        error_kind:
          type: string
          enum:
          - daily
          - burst
          - ip_cap
          - ip_rotation
        message:
          type: string
        tier:
          type: string
          enum:
          - BASIC
          - PRO
          - ULTRA
          - BUSINESS
          - ENTERPRISE
        limit:
          type: integer
        resets_at:
          type: string
          format: date-time
        upgrade:
          type: object
          description: The plan that lifts this limit, with price and a checkout link.
          properties:
            tier:
              type: string
              enum:
              - PRO
              - ULTRA
              - BUSINESS
              - ENTERPRISE
            price_eur_per_month:
              type: number
            price_usdc_per_month:
              type: number
            daily_limit:
              type: integer
            burst_limit:
              type: integer
            pitch:
              type: string
            url:
              type: string
            upgrade_url:
              type: string
              format: uri
            reactivate:
              type: boolean
              description: Present (true) when the key's paid subscription has just lapsed and `tier` is the plan it held.
            prior_tier:
              type: string
              enum:
              - PRO
              - ULTRA
              - BUSINESS
        datasets:
          type: object
          properties:
            pitch:
              type: string
            url:
              type: string
              format: uri
    Error:
      type: object
      description: Generic error envelope. `error` is always present (SDKs match on it). Errors returned after authentication also carry `_rid` and, on paid tiers, `support`; authentication-stage errors (missing/invalid key, origin) carry neither.
      properties:
        error:
          type: string
          description: Error message or machine code (e.g. `tier_required`, `rate_limit_exceeded`). Never changed once shipped.
        message:
          type: string
          description: Human-readable explanation, when `error` is a machine code.
        code:
          type: string
          description: Machine-readable sub-code on some errors (e.g. `invalid_query`, `invalid_wallet`, `origin_not_allowed`).
        error_kind:
          type: string
          description: Machine-readable category on some errors (e.g. `statement_timeout`, `concurrency`, `daily`).
        detail:
          type: string
          description: Extra human-readable context.
        hint:
          type: string
        retry_after_seconds:
          type: number
          description: When present on a 429/503, the same value is sent as the `Retry-After` header.
        signup_url:
          type: string
          format: uri
          description: 'On the missing-key / bad-format 401: where to get a free key.'
        docs_url:
          type: string
          format: uri
        support:
          type: string
          description: 'Paid tiers, errors after authentication: priority support contact.'
        _rid:
          type: string
          description: Request ID — include when reporting issues
      required:
      - error
  responses:
    TierForbidden:
      description: 'Forbidden. One of: the key''s tier is below this endpoint''s or parameter''s gate (`tier_required` with an `upgrade` block); the public demo key used outside its allow-list (`demo_key_endpoint_not_allowed`); an invalid or revoked key; an origin-restricted key called from a disallowed origin (`code` `origin_not_allowed` / `origin_required`). `X-RateLimit-*` headers are present only on `tier_required`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Used:
          $ref: '#/components/headers/XRateLimitUsed'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/TierRequiredError'
            - $ref: '#/components/schemas/DemoKeyNotAllowedError'
            - $ref: '#/components/schemas/Error'
          examples:
            tier_required:
              summary: Tier below the gate
              value:
                error: tier_required
                message: This endpoint requires ULTRA tier — you're on PRO.
                feature: This endpoint
                your_tier: PRO
                required_tier: ULTRA
                upgrade:
                  tier: ULTRA
                  price_eur_per_month: 131
                  price_usdc_per_month: 149
                  daily_limit: 100000
                  burst_limit: 600
                  pitch: …
                  url: https://madeonsol.com/pricing
                  upgrade_url: https://madeonsol.com/checkout?tier=ULTRA
                support: 'Priority support: info@madeonsol.com'
                _rid: eyJ1IjoiZXhhbXBsZSIsInQiOjE3OTEwMDAwMDAwMDAsImgiOiIwMDAwMDAwMCJ9
            demo_key:
              summary: Demo key outside its allow-list
              value:
                error: demo_key_endpoint_not_allowed
                message: The public demo key works on /kol/feed, /deployer-hunter/alerts, and /alpha/leaderboard only. This endpoint requires the PRO plan or higher; a free API key will not unlock it. See https://madeonsol.com/pricing.
                endpoint_tier: PRO
                allowed_endpoints:
                - /api/v1/kol/feed
                - /api/v1/deployer-hunter/alerts
                - /api/v1/alpha/leaderboard
                signup_url: https://madeonsol.com/developer
                upgrade_url: https://madeonsol.com/checkout?tier=PRO
            revoked_key:
              summary: Invalid or revoked key
              value:
                error: Invalid or revoked API key
    InternalError:
      description: Unexpected server error from the route (`Internal server error`, with `_rid`). Safe to retry with backoff. A failed API-key lookup is a 503 `auth_backend_unavailable`, never a 500.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Used:
          $ref: '#/components/headers/XRateLimitUsed'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            route:
              summary: Route error
              value:
                error: Internal server error
                _rid: eyJ1IjoiZXhhbXBsZSIsInQiOjE3OTEwMDAwMDAwMDAsImgiOiIwMDAwMDAwMCJ9
    RateLimited:
      description: Too many requests. Every 429 carries `Retry-After`. A quota 429 (`rate_limit_exceeded`, with `X-RateLimit-*`), a heavy-query concurrency 429 (`error_kind` `concurrency`/`capacity`), or the per-IP authentication-failure block (30 failed auths/min; plain `error` + `retry_after_seconds`, no `X-RateLimit-*`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Used:
          $ref: '#/components/headers/XRateLimitUsed'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/RateLimitError'
            - $ref: '#/components/schemas/ConcurrencyLimitError'
            - $ref: '#/components/schemas/Error'
          examples:
