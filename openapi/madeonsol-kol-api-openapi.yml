    get:
      tags:
      - KOL
      summary: Hot tokens by KOL attention
      description: Tokens where KOL buy velocity has accelerated in the current period vs the prior baseline — each row carries an `acceleration` score, net flow and the participating KOLs. Complements `/kol/tokens/trending`, which ranks by absolute buy volume.
      parameters:
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 1h
          - 6h
          default: 6h
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: Page size (capped at 20 below ULTRA)
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        description: Page start into the ranked list — response includes a `pagination` block
      - name: min_kols
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
        description: Minimum distinct KOL buyers
      - name: min_avg_winrate
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 100
