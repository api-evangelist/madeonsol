      - name: preset
        in: query
        schema:
          type: string
          enum:
          - scout
          - fresh_launch
      - name: min_mc_usd
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 1000000000000
        description: 'v1.6: lower bound on market_cap_usd_at_first_buy. Touches with unknown MC drop out when set.'
      - name: max_mc_usd
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 1000000000000
        description: 'v1.6: upper bound on market_cap_usd_at_first_buy.'
      responses:
        '200':
          description: OK — returns `{ events, count, next_before, data_age_seconds }`. Each event has `first_kol.{name, winrate_7d, strategy, scout_tier, scout_score, n_first_touches_30d}`. ULTRA also gets `first_kol.wallet`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
