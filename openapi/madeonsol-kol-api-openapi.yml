    post:
      tags:
      - KOL
      summary: Create a first-touch webhook subscription
      description: ULTRA only. Each event matching `filters` is pushed via the `kol:first_touches` WS channel and/or POSTed to `webhook_url` with HMAC-SHA256 signing (header `X-MadeOnSol-Signature`). Returns `webhook_secret` once when delivery includes webhook — store it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 64
                filters:
                  type: object
                  properties:
                    kol:
                      type: string
                      description: Wallet address (32-44 base58 chars)
                    mint_suffix:
                      type: string
                    min_first_buy_sol:
                      type: number
                      minimum: 0
                    min_scout_tier:
                      type: string
                      enum:
                      - S
                      - A
                      - B
                      - C
                    min_n_touches:
                      type: integer
                      minimum: 1
                  additionalProperties: false
                delivery_mode:
                  type: string
                  enum:
                  - websocket
                  - webhook
                  - both
                  default: webhook
                webhook_url:
                  type: string
                  format: uri
                  description: Required if delivery_mode includes webhook. HTTPS only.
                min_mc_usd:
                  type: number
                  minimum: 0
                  maximum: 1000000000000
                  nullable: true
                  description: 'v1.6: lower bound on first-touch MC. Touches with unknown MC drop out when set.'
                max_mc_usd:
                  type: number
                  minimum: 0
                  maximum: 1000000000000
                  nullable: true
                  description: 'v1.6: upper bound on first-touch MC.'
