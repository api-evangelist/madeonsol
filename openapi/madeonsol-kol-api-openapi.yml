    post:
      tags:
      - KOL
      summary: Create a coordination alert rule
      description: 'Rule fires via pg_notify push when a token hits `min_kols` distinct KOL buys inside a rolling `window_minutes` window AND scores >= `min_score`. Cooldown per (rule, token); re-fires early if score jumps >= `score_jump_break`. Delivery: `websocket` (on the `kol:coordination` WS channel), `webhook` (per-rule HMAC), or `both`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 64
                min_kols:
                  type: integer
                  minimum: 2
                  maximum: 50
                  default: 5
                window_minutes:
                  type: integer
                  minimum: 1
                  maximum: 60
                  default: 15
                min_score:
                  type: integer
                  minimum: 0
                  maximum: 100
                  default: 0
                include_majors:
                  type: boolean
                  default: false
                cooldown_min:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  default: 30
                score_jump_break:
                  type: integer
                  minimum: 0
                  maximum: 100
                  default: 20
                  description: Re-fire during cooldown when new score ≥ last_score + this
                delivery_mode:
                  type: string
                  enum:
                  - websocket
                  - webhook
                  - both
                  default: websocket
                webhook_url:
                  type: string
                  format: uri
                  description: Required if delivery_mode includes webhook. HTTPS only.
                min_mc_usd:
                  type: number
                  minimum: 0
                  maximum: 1000000000000
                  nullable: true
                  description: 'v1.6: lower bound on entry MC (MC at the triggering trade). Triggers on tokens with unknown MC drop out when set.'
                max_mc_usd:
                  type: number
                  minimum: 0
                  maximum: 1000000000000
                  nullable: true
                  description: 'v1.6: upper bound on entry MC.'
      responses:
        '200':
          description: Rule created. Response includes `webhook_secret` (one-time) if a webhook URL was supplied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule:
                    $ref: '#/components/schemas/CoordinationAlertRule'
                  webhook_secret:
                    type: string
                    nullable: true
                    description: One-time reveal — only present when a webhook_url was supplied. Use to verify HMAC-SHA256 signatures (X-MadeOnSol-Signature).
                  note:
                    type: string
                    nullable: true
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
