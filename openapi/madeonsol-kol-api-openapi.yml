                          type: number
                          nullable: true
                        tx_signature:
                          type: string
                          nullable: true
                        token_age_minutes:
                          type: integer
                          nullable: true
                          description: Null when the token's first-seen timestamp is unknown
                        market_cap_usd_at_first_buy:
                          type: number
                          nullable: true
                        price_usd_at_first_buy:
                          type: number
                          nullable: true
                        market_cap_usd:
                          type: number
                          nullable: true
                          description: Current market cap
                        last_price_usd:
                          type: number
                          nullable: true
                          description: Current price
                        first_kol:
                          type: object
                          properties:
                            wallet:
                              type: string
                              description: ULTRA only
                            name:
                              type: string
                              nullable: true
                            twitter_url:
                              type: string
                              nullable: true
                              format: uri
                            winrate_7d:
                              type: number
                              nullable: true
                            strategy:
                              type: string
                              nullable: true
