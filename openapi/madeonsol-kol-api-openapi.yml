openapi: 3.2.0
info:
  title: MadeOnSol KOL API
  version: 1.20.0
  description: Real-time Solana & Robinhood Chain trading intelligence — KOL wallet trades, deployer reputation, token buyer-quality scoring, wallet tracking, and copy-trade signals across both chains (Robinhood Chain paths under `/rhc/*`).
  contact:
    name: MadeOnSol
    url: https://madeonsol.com/contact
  license:
    name: Proprietary
    url: https://madeonsol.com/terms
servers:
- url: https://madeonsol.com/api/v1
  description: Production
security:
- BearerAuth: []
tags:
- name: KOL
  description: KOL wallet trade feed, leaderboard, coordination, hot tokens, and per-KOL profile.
paths:
  /kol/feed:
    get:
      tags:
      - KOL
      summary: KOL trade feed (real-time on PRO+; 5-min delay on free)
      description: Stream-of-consciousness feed of every buy/sell of at least 0.05 SOL (or $3.50 in USDC/USDT) from 2,000+ tracked Solana KOL wallets. Sub-3s latency from on-chain confirmation on PRO and up (and x402 pay-per-call); the free tier serves this feed on a 5-minute delay (response carries delay/as_of).
      parameters:
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: Only trades strictly newer than this ISO8601 time — the poll cursor. Feed back the response's next_since.
      - name: include
        in: query
        schema:
          type: string
          enum:
          - token
        description: include=token embeds the /token/{mint} snapshot on each row (≤20 distinct mints per page). Runs the sibling handler in-process and embeds its body under its own key; a failing include lands in include_errors and never fails the request; counts as ONE call.
      - $ref: '#/components/parameters/Limit'
      - name: before
        in: query
        schema:
          type: string
          format: date-time
        description: 'Cursor: return trades strictly older than this ISO timestamp. Use `next_before` from the previous response.'
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 200
        description: 'PREFERRED pagination (audit F09 follow-up): the `next_cursor` from a previous page — an opaque strict (traded_at, id) keyset, so paging never repeats or skips rows that share a timestamp and progresses with limit=1 through runs of identical timestamps. Malformed or tampered → 400. Cannot be combined with `before=` (400); `before=` stays supported as the legacy bound.'
      - name: action
        in: query
        schema:
          type: string
          enum:
          - buy
          - sell
      - name: kol
        in: query
        schema:
          type: string
        description: Filter by KOL wallet address
      - name: min_sol
        in: query
        schema:
          type: number
        description: Min SOL size per trade
      - name: token_age_max_min
        in: query
        schema:
          type: integer
        description: Max token age (min) at trade time
      - name: exclude_sells
        in: query
        schema:
          type: boolean
          default: false
        description: Drop sell-side trades
      - name: min_kol_winrate
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 100
        description: Min 7d winrate of the buying KOL
      - name: strategy
        in: query
        schema:
          type: string
          enum:
          - scalper
          - day_trader
          - swing_trader
          - hodler
          - mixed
        description: Filter by auto-classified trader style
      - name: min_mc_usd
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 1000000000000
        description: 'v1.6: lower bound on market_cap_usd_at_trade. Trades with unknown MC drop out when set.'
      - name: max_mc_usd
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 1000000000000
        description: 'v1.6: upper bound on market_cap_usd_at_trade.'
      responses:
        '200':
          description: OK. Response includes `next_before` (ISO timestamp of the last row — pass to the `before` param on the next call). Every row carries `token_image_url` and `launchpad` (`pumpfun`/`launchlab`/`bags`, null for non-launchpad mints).
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      $ref: '#/components/schemas/KolTrade'
                  count:
                    type: integer
                  data_age_seconds:
                    type: integer
                    nullable: true
                    description: Seconds since the newest returned row's traded_at; null on an empty page.
                  next_before:
                    type: string
                    format: date-time
                    nullable: true
                    description: 'Page-down cursor: pass as `before=` for older rows.'
                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque keyset cursor for the next (older) page — pass as `cursor=`. PREFERRED over next_before, which is a strict timestamp bound that skips same-timestamp siblings of the boundary row.
                  has_more:
                    type: boolean
                    description: false only when the feed is exhausted (not merely when the page is short).
                  scan:
                    type: object
                    description: 'Present when a filter had to be applied after the candidate fetch (audit F09): has_more is then false only when the candidates ran out, and scan_truncated=true means the per-request scan budget ran out first — more matches MAY exist past next_cursor.'
                    properties:
                      post_filtered:
                        type: boolean
                      scanned:
                        type: integer
                        description: Candidate rows examined
                      scan_truncated:
                        type: boolean
                        description: The per-request scan budget ran out before `limit` matches — more matches MAY exist past the cursor/offset
                      scan_budget:
                        type: integer
                  next_since:
                    type: string
                    format: date-time
                    nullable: true
                    description: 'Poll cursor: traded_at of the newest row on this page (or the `since` you sent when the page is empty). Pass as `since=` to fetch only newer rows; if count === limit page down with before= until you pass your previous since.'
                  since:
                    type: string
                    format: date-time
                    nullable: true
                    description: Echo of the `since` parameter.
                  stream:
                    type: object
                    description: Pointer to the WebSocket channel that pushes the same rows (`kol:trades`) so you can stop polling.
                    properties:
                      channel:
                        type: string
                      url:
                        type: string
                      docs:
                        type: string
                  included:
                    type: array
                    items:
                      type: string
                      enum:
                      - token
                    description: Present only when `include=` was honoured.
                  include_truncated:
                    type: object
                    description: 'Present only when include=token hit the 20-distinct-mint cap: `{ token: [mints not embedded], note }` — those rows carry token:null.'
                    properties:
                      token:
                        type: array
                        items:
                          type: string
                      note:
                        type: string
                  include_errors:
                    type: object
                    description: 'Present only when an unknown `include=` value was sent: `{ <name>: { status: 400, error } }`.'
                  delay:
                    type: string
                    description: Free tier only — the applied feed delay ("5m").
                  delay_seconds:
                    type: integer
                    description: Free tier only — the delay in seconds (300).
                  as_of:
                    type: string
                    format: date-time
                    description: Free tier only — the delayed cutoff the page was served at.
                  delay_note:
                    type: string
                    description: Free tier only — plain-words note that PRO+ and x402 are real-time.
                  upgrade:
                    type: string
                    description: Free tier only — pricing URL.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-madeonsol-tier: FREE
      x-badges:
      - name: FREE
        position: after
        color: '#64748b'
      operationId: getKolFeed
      x-operation-id-source: derived
  /kol/wallets:
    get:
      tags:
      - KOL
      summary: Tracked KOL roster (all tiers)
      description: 'The set of Solana wallets every `/kol/*` route is keyed on — address, name, X handle, strategy tag, follower counts, tracked-since. Roster only: performance lives in `/kol/leaderboard` and `/kol/{wallet}`. Added 2026-09-05 (customers guessed /kol/wallets, /kol/list, /kol/roster, /kol/search). The Robinhood Chain roster is `/rhc/kol/leaderboard`.'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 5000
          default: 0
      - name: active
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - all
          default: 'true'
        description: Inactive wallets are kept for history but produce no new trades.
      - name: q
        in: query
        schema:
          type: string
          maxLength: 40
        description: Case-insensitive substring match on the KOL name.
      - name: strategy
        in: query
        schema:
          type: string
        description: Exact strategy_tag filter.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      type: object
                      properties:
                        wallet_address:
                          type: string
                        name:
                          type: string
                          nullable: true
                        twitter_url:
                          type: string
                          nullable: true
                        avatar_url:
                          type: string
                          nullable: true
                        strategy_tag:
                          type: string
                          nullable: true
                        twitter_followers:
                          type: integer
                          nullable: true
                        follow_count:
                          type: integer
                          description: MadeOnSol users following this KOL.
                        is_active:
                          type: boolean
                        tracked_since:
                          type: string
                          format: date-time
                          nullable: true
                  count:
                    type: integer
                  total:
                    type: integer
                    description: Total matching the filters (for paging).
                  limit:
                    type: integer
                  offset:
                    type: integer
                  has_more:
                    type: boolean
                  filters:
                    type: object
                    description: Echo of the applied filters.
                    properties:
                      active:
                        type: string
                        enum:
                        - 'true'
                        - 'false'
                        - all
                      q:
                        type: string
                        nullable: true
                      strategy:
                        type: string
                        nullable: true
                  note:
                    type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-madeonsol-tier: FREE
      x-badges:
      - name: FREE
        position: after
        color: '#64748b'
      operationId: getKolWallets
      x-operation-id-source: derived
  /kol/leaderboard:
    get:
      tags:
      - KOL
      summary: KOL PnL leaderboard
      description: Ranked KOL leaderboard with 180 days of trade history. PRO+ can sort by winrate / profit factor / avg ROI / early-entry share / consistency.
      parameters:
      - name: period
        in: query
        schema:
          type: string
          enum:
          - today
          - 7d
          - 30d
          - 90d
          - 180d
          default: 7d
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        description: Page start into the filtered ranking
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - pnl
          - winrate
          - volume
          - avg_roi
          - profit_factor
          - early_entry_pct
          - consistency
          default: pnl
        description: PRO+
      - name: strategy
        in: query
        schema:
          type: string
          enum:
          - scalper
          - day_trader
          - swing_trader
          - hodler
          - mixed
        description: PRO+
      - name: min_winrate
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 100
        description: PRO+
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  leaderboard:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/LeaderboardRow'
                      - type: object
                        properties:
                          entry_mc_samples:
                            type: integer
                            nullable: true
                            description: KOL buys with an MC-at-trade over the period (complete SQL aggregate). null only when that aggregate failed (entry_mc_complete=false) — never a fake 0
                          avg_entry_mc_usd:
                            type: integer
                            nullable: true
                            description: Average MC at entry over those buys; null with 0 samples or when the aggregate failed
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      returned:
                        type: integer
                      total:
                        type: integer
                        description: Rows in the filtered UNIVERSE (see universe) — not all KOLs
                      has_more:
                        type: boolean
                  universe:
                    type: object
                    description: 'Pagination walks a FIXED ranked set (audit F19), not every KOL: the top max_size KOLs by realized PnL for the period; sort/strategy/min_winrate re-rank and filter within it.'
                    properties:
                      kind:
                        type: string
                        enum:
                        - top_kols_by_realized_pnl
                      period:
                        type: string
                      max_size:
                        type: integer
                      size:
                        type: integer
                      note:
                        type: string
                  entry_mc_window_start:
                    type: string
                    format: date-time
                    nullable: true
                    description: Start of the entry-MC aggregate window (bucketed to 5 min; null = all time)
                  entry_mc_complete:
                    type: boolean
                    description: false = the entry-MC aggregate failed; per-row entry_mc_samples / avg_entry_mc_usd are null (unknown)
                  period:
                    type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: FREE
      x-badges:
      - name: FREE
        position: after
        color: '#64748b'
      operationId: getKolLeaderboard
      x-operation-id-source: derived
  /kol/{wallet}:
    get:
      tags:
      - KOL
      summary: Single KOL profile
      description: Aggregated profile for one KOL wallet — name, twitter, 7d/30d winrate, total PnL, trade count, recent activity. `include` param adds optional sections (PRO+).
      parameters:
      - name: wallet
        in: path
        required: true
        schema:
          type: string
          example: 2FxiPRPLYX3H84FZkdRiUHDgDm4U5u98etbL4yvZ3qRq
        description: Solana wallet address (32-44 base58 chars)
      - name: include
        in: query
        schema:
          type: string
        description: 'Comma-separated extras: `pnl_by_token`, `recent_winners`, `recent_losers` (PRO+)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  kol:
                    type: object
                    properties:
                      name:
                        type: string
                      wallet:
                        type: string
                      twitter_url:
                        type: string
                        nullable: true
                      strategy_tag:
                        type: string
                        nullable: true
                      auto_strategy_tag:
                        type: string
                        nullable: true
                  stats:
                    type: object
                    properties:
                      pnl:
                        type: number
                        description: SOL, sum of returned trades only (not full history)
                      buy_count:
                        type: integer
                      sell_count:
                        type: integer
                      volume:
                        type: number
                      win_rate:
                        type: number
                        description: 0-100. Present only when per-token PnL was computed (needed by `include`)
                  scores:
                    type: object
                    properties:
                      winrate_7d:
                        type: number
                        nullable: true
                      winrate_30d:
                        type: number
                        nullable: true
                      avg_roi_7d:
                        type: number
                        nullable: true
                      avg_roi_30d:
                        type: number
                        nullable: true
                      profit_factor_7d:
                        type: number
                        nullable: true
                      profit_factor_30d:
                        type: number
                        nullable: true
                      pnl_7d:
                        type: number
                        nullable: true
                      pnl_30d:
                        type: number
                        nullable: true
                      early_entry_pct_30d:
                        type: number
                        nullable: true
                      consistency_7d:
                        type: number
                        nullable: true
                      median_hold_minutes_30d:
                        type: number
                        nullable: true
                      closed_positions_7d:
                        type: integer
                      closed_positions_30d:
                        type: integer
                      is_heating_up:
                        type: boolean
                      is_cold:
                        type: boolean
                  peer_ranks:
                    type: object
                    properties:
                      percentile_pnl_7d:
                        type: number
                        nullable: true
                      percentile_winrate_7d:
                        type: number
                        nullable: true
                      percentile_pnl_30d:
                        type: number
                        nullable: true
                      percentile_winrate_30d:
                        type: number
                        nullable: true
                      percentile_early_entry_30d:
                        type: number
                        nullable: true
                  recent_trades:
                    type: array
                    description: Up to 100 most recent trades
                    items:
                      type: object
                      properties:
                        token_mint:
                          type: string
                        token_name:
                          type: string
                          nullable: true
                        token_symbol:
                          type: string
                          nullable: true
                        action:
                          type: string
                          enum:
                          - buy
                          - sell
                        sol_amount:
                          type: number
                        token_amount:
                          type: number
                        market_cap_usd_at_trade:
                          type: number
                          nullable: true
                        price_usd_at_trade:
                          type: number
                          nullable: true
                        tx_signature:
                          type: string
                        traded_at:
                          type: string
                          format: date-time
                  pnl_by_token:
                    type: array
                    description: Only when `include` contains `pnl_by_token`
                    items:
                      type: object
                      properties:
                        token_mint:
                          type: string
                        token_symbol:
                          type: string
                        token_name:
                          type: string
                        buy_count:
                          type: integer
                        sell_count:
                          type: integer
                        total_bought:
                          type: number
                        total_sold:
                          type: number
                        pnl:
                          type: number
                        result:
                          type: string
                          enum:
                          - open
                          - win
                          - loss
                        first_trade:
                          type: string
                          format: date-time
                        last_trade:
                          type: string
                          format: date-time
                  recent_winners:
                    type: array
                    description: Only when `include` contains `recent_winners` — up to 10, closed positions with pnl > 0
                    items:
                      type: object
                      properties:
                        token_mint:
                          type: string
                        token_symbol:
                          type: string
                        token_name:
                          type: string
                        pnl:
                          type: number
                        roi_pct:
                          type: number
                          nullable: true
                        buy_count:
                          type: integer
                        sell_count:
                          type: integer
                        first_trade:
                          type: string
                          format: date-time
                        last_trade:
                          type: string
                          format: date-time
                  recent_losers:
                    type: array
                    description: Only when `include` contains `recent_losers` — up to 10, closed positions with pnl <= 0
                    items:
                      type: object
                      properties:
                        token_mint:
                          type: string
                        token_symbol:
                          type: string
                        token_name:
                          type: string
                        pnl:
                          type: number
                        roi_pct:
                          type: number
                          nullable: true
                        buy_count:
                          type: integer
                        sell_count:
                          type: integer
                        first_trade:
                          type: string
                          format: date-time
                        last_trade:
                          type: string
                          format: date-time
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '404':
          description: Wallet not in KOL roster
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: FREE
      x-badges:
      - name: FREE
        position: after
        color: '#64748b'
      operationId: getKolByWallet
      x-operation-id-source: derived
  /kol/{wallet}/pnl:
    get:
      tags:
      - KOL
      summary: Per-token PnL breakdown for one KOL
      description: Trade-by-trade and per-token realised/unrealised PnL for a single KOL over a configurable period.
      parameters:
      - name: wallet
        in: path
        required: true
        schema:
          type: string
          example: 2FxiPRPLYX3H84FZkdRiUHDgDm4U5u98etbL4yvZ3qRq
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 7d
          - 30d
          - 90d
          - 180d
          default: 30d
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  kol:
                    type: object
                    properties:
                      name:
                        type: string
                      wallet:
                        type: string
                      twitter_url:
                        type: string
                        nullable: true
                      strategy_tag:
                        type: string
                        nullable: true
                  summary:
                    type: object
                    properties:
