        in: query
        schema:
          type: string
        description: Filter to one KOL wallet (32-44 base58 chars)
      - name: min_kol_winrate_7d
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 100
      - name: min_scout_tier
        in: query
        schema:
          type: string
          enum:
          - S
          - A
          - B
          - C
      - name: min_n_touches
        in: query
        schema:
          type: integer
          minimum: 1
      - name: strategy
