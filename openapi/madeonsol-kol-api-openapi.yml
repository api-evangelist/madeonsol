        '200':
          description: Subscription created. Response includes `webhook_secret` (one-time) if a webhook URL was supplied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    $ref: '#/components/schemas/FirstTouchSubscription'
                  webhook_secret:
                    type: string
                    nullable: true
                    description: One-time reveal — only present when a webhook_url was supplied. Use to verify HMAC-SHA256 signatures (X-MadeOnSol-Signature).
                  note:
                    type: string
                    nullable: true
