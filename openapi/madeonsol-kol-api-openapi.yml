components:
  headers:
    XRateLimitReset:
      description: When the window resets, as a Unix epoch in SECONDS (next 00:00 UTC for the daily quota; about 60 s ahead for a per-minute bucket).
      schema:
        type: integer
      example: 1791158400
    XRateLimitRemaining:
      description: Calls left in that window. `0` on a quota 429.
      schema:
        type: integer
        minimum: 0
      example: 9412
    XDataDelay:
      description: 'Free-tier only: the feed in this body is delayed by this many seconds (same value as the body''s `delay_seconds`). Absent on real-time responses.'
      schema:
        type: integer
        minimum: 1
      example: 300
    XRateLimitLimit:
      description: 'Size of the rate-limit window this call was counted against: the daily quota for your tier on data endpoints, the per-minute bucket on `/stream/token` (10) and `/stream/sessions` (30), the hourly allowance for the public demo key. Sent once the key has been authenticated and rate-limited, so it is absent on authentication-stage errors.'
      schema:
        type: integer
        minimum: 0
      example: 10000
    XMadeOnSolQuotaWarning:
      description: 'Free-tier only, past about 70 % of the daily quota: a human-readable usage line with an upgrade link.'
      schema:
        type: string
      example: '150/200 used - upgrade for 50x higher limits: https://madeonsol.com/checkout?tier=PRO'
    XRequestId:
      description: Unique id of this response. On responses built after authentication it is also the `request_id` of the audit-log row for the call, so quote it in a support request. Present on every response of the keyed API.
      required: true
      schema:
        type: string
        format: uuid
      example: 3f6c1d2e-8a4b-4f7e-9c21-5b0d7e6a9f13
    XRateLimitUsed:
      description: Calls used in that window (`limit − remaining`).
      schema:
        type: integer
        minimum: 0
      example: 588
    RetryAfter:
      description: Seconds to wait before retrying (RFC 9110 delay-seconds, at least 1). Sent on every 429 (quota, concurrency, authentication-failure) and every 503; when the body carries `retry_after_seconds` it is the same value.
      required: true
      schema:
        type: integer
        minimum: 1
      example: 10
  schemas:
    DemoKeyNotAllowedError:
      type: object
      description: 403 for the public demo key (`msk_demo_…`) outside its three-endpoint allow-list. `endpoint_tier` is the endpoint's real minimum plan (null when unknown).
      required:
      - error
      - message
      - allowed_endpoints
      properties:
        error:
          type: string
          enum:
          - demo_key_endpoint_not_allowed
        message:
          type: string
        endpoint_tier:
          type: string
          nullable: true
          enum:
          - FREE
          - PRO
          - ULTRA
          - BUSINESS
          - ENTERPRISE
          - null
        allowed_endpoints:
          type: array
          items:
            type: string
        signup_url:
          type: string
          format: uri
        upgrade_url:
          type: string
          format: uri
          description: Only when the endpoint's tier can be bought at /checkout.
    ConcurrencyLimitError:
      type: object
      description: '429 from the heavy-query limiter: too many heavy requests in flight for this key (`concurrency`) or for the whole server (`capacity`). Clears as soon as in-flight requests finish.'
      required:
      - error
      - error_kind
      - retry_after_seconds
      properties:
        error:
          type: string
        error_kind:
          type: string
          enum:
          - concurrency
          - capacity
        retry_after_seconds:
          type: number
        max_concurrent:
          type: integer
        support:
          type: string
        _rid:
          type: string
    TierRequiredError:
      type: object
      description: 403 when the key's tier is below the endpoint's (or a parameter's) gate. `required_tier` matches the operation's `x-madeonsol-tier` or `x-madeonsol-feature-tiers`. ENTERPRISE gates return `contact` instead of `upgrade`.
      required:
      - error
      - message
      - your_tier
      - required_tier
      properties:
        error:
          type: string
          enum:
          - tier_required
        message:
          type: string
        feature:
          type: string
        your_tier:
          type: string
          enum:
          - BASIC
          - PRO
          - ULTRA
          - BUSINESS
          - ENTERPRISE
        required_tier:
          type: string
          enum:
          - PRO
          - ULTRA
          - BUSINESS
          - ENTERPRISE
        upgrade:
          type: object
          description: The plan that lifts this limit, with price and a checkout link.
          properties:
            tier:
              type: string
              enum:
              - PRO
              - ULTRA
              - BUSINESS
              - ENTERPRISE
            price_eur_per_month:
              type: number
            price_usdc_per_month:
              type: number
            daily_limit:
              type: integer
            burst_limit:
              type: integer
            pitch:
              type: string
            url:
              type: string
            upgrade_url:
              type: string
              format: uri
            reactivate:
              type: boolean
              description: Present (true) when the key's paid subscription has just lapsed and `tier` is the plan it held.
            prior_tier:
              type: string
              enum:
              - PRO
              - ULTRA
              - BUSINESS
        contact:
          type: object
          properties:
            url:
              type: string
            contact_url:
              type: string
            pitch:
              type: string
        support:
          type: string
        _rid:
          type: string
    CoordinationAlertRule:
      type: object
      description: A saved /kol/coordination/alerts rule. `created_at` is present on list/GET-one responses; `updated_at` is present on GET-one/PATCH responses (list omits it).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        min_kols:
          type: integer
        window_minutes:
          type: integer
        min_score:
          type: integer
        include_majors:
          type: boolean
        cooldown_min:
          type: integer
        score_jump_break:
          type: integer
        delivery_mode:
          type: string
          enum:
          - websocket
          - webhook
          - both
        webhook_url:
          type: string
          format: uri
          nullable: true
        min_mc_usd:
          type: number
          nullable: true
        max_mc_usd:
          type: number
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ServiceUnavailableError:
      type: object
      description: '503: a temporary capacity or maintenance condition (e.g. a Postgres statement timeout during a partition move, or the API-key lookup itself being unavailable). Retry after `Retry-After` seconds.'
      required:
      - error
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable code where one exists, e.g. `auth_backend_unavailable`.
        error_kind:
          type: string
          description: e.g. `statement_timeout`, `auth_backend`
        retry_after_seconds:
          type: number
        retryable:
          type: boolean
        support:
          type: string
        _rid:
          type: string
    LeaderboardRow:
      type: object
      properties:
        name:
          type: string
        wallet:
          type: string
        pnl:
          type: number
          description: Realized PnL in SOL
        buy_count:
          type: integer
        sell_count:
          type: integer
        volume:
          type: number
        win_rate:
          type: number
          description: 0-100
        median_hold_minutes_30d:
          type: number
          nullable: true
          description: Median hold time in minutes over the last 30 days.
        percentile_early_entry_30d:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: Percentile rank for early entry timing over the last 30 days.
    KolTrade:
      type: object
      properties:
        wallet_address:
          type: string
        kol_name:
          type: string
        kol_twitter:
          type: string
          format: uri
          nullable: true
        token_mint:
          type: string
        token_name:
          type: string
          nullable: true
        token_symbol:
          type: string
          nullable: true
        action:
          type: string
          enum:
          - buy
          - sell
        sol_amount:
          type: number
        token_amount:
          type: number
        market_cap_usd_at_trade:
          type: number
          nullable: true
          description: Token market cap in USD at the moment of trade (real-time, from our in-memory price tracker — not the post-hoc Dexscreener spot)
        price_usd_at_trade:
          type: number
          nullable: true
          description: Token price in USD at the moment of trade
        tx_signature:
          type: string
        traded_at:
          type: string
          format: date-time
        token_image_url:
          type: string
          nullable: true
        launchpad:
          type: string
          nullable: true
          description: Launchpad of origin (`pumpfun` / `launchlab` / `bags`); null for non-launchpad mints.
        token_age_minutes:
          type: integer
          nullable: true
          description: Minutes between the token's first observed trade and now (not at trade time); null when the mint has no first-seen record.
        kol_strategy_tag:
          type: string
          nullable: true
          description: Manual strategy tag from the roster, falling back to the auto-classified tag.
        kol_auto_strategy_tag:
          type: string
          nullable: true
          enum:
          - scalper
          - day_trader
          - swing_trader
          - hodler
          - mixed
          - null
          description: Auto-classified trader style — the value `strategy=` filters on.
        kol_winrate_7d:
          type: number
          nullable: true
          description: KOL's 7-day win rate (0-100).
        kol_winrate_30d:
          type: number
          nullable: true
          description: KOL's 30-day win rate (0-100).
        kol_early_entry_pct_30d:
          type: number
          nullable: true
          description: Share of the KOL's 30-day buys that were early entries.
        kol_is_heating_up:
          type: boolean
          description: KOL's recent performance is trending up vs their own baseline.
        kol_percentile_pnl_7d:
          type: number
