  /kol/coordination:
    get:
      tags:
      - KOL
      summary: Multi-KOL coordination signals (PRO+)
      description: Detect tokens being traded by multiple KOLs within a window. **PRO+** — the live signal includes participating KOL wallet addresses. 3+ convergent KOLs is often a leading signal. Stablecoins / wSOL / LSTs are always filtered; established memecoins (WIF, BONK, POPCAT) are filtered by default — pass `include_majors=true` to see them. `peak_*` fields describe the densest buy cluster inside the period. Results are sorted by `coordination_score` over a fixed universe — the top 150 clusters by (kol_count DESC, net_sol_flow DESC) — and every filter runs inside it (see `universe`; since 2026-09-21 — previously only the first `limit` clusters, ×3 with filters, were scored).
      parameters:
      - name: include
        in: query
        schema:
          type: string
          enum:
          - risk
        description: include=risk embeds /tokens/{mint}/risk on each cluster (≤20 distinct mints). Runs the sibling handler in-process and embeds its body under its own key; a failing include lands in include_errors and never fails the request; counts as ONE call.
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 1h
          - 6h
          - 24h
          - 7d
          default: 24h
      - name: min_kols
        in: query
        schema:
          type: integer
          minimum: 2
          maximum: 50
          default: 3
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: min_avg_winrate
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 100
        description: PRO+
      - name: unique_strategies
        in: query
        schema:
          type: boolean
        description: PRO+. true = require the cluster's KOLs to span distinct strategies (the route accepts true|false|1|0; any other value is a 400).
      - name: include_majors
        in: query
        schema:
          type: boolean
          default: false
        description: Include WIF, BONK, POPCAT etc. in results
      - name: window_minutes
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 60
          default: 15
        description: Width of the peak-density window
      - name: min_score
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100
        description: Only return clusters with coordination_score ≥ this value
      - name: min_mc_usd
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 1000000000000
        description: 'v1.6: lower bound on entry MC (MC at first KOL buy). Tokens with unknown entry MC drop out when set.'
      - name: max_mc_usd
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 1000000000000
        description: 'v1.6: upper bound on entry MC.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  coordination:
                    type: array
                    items:
                      $ref: '#/components/schemas/CoordinationCluster'
                  period:
                    type: string
                  min_kols:
                    type: integer
                    description: Echo of the applied min_kols.
                  window_minutes:
                    type: integer
                    description: Echo of the applied peak-density window (minutes).
                  score_version:
                    type: string
                    description: Bumps when score weights change; clients can pin logic to a known version.
                  universe:
                    type: object
                    description: 'The clusters the ranking was computed over (audit F09 follow-up, 2026-09-21): the top `max_size` by (kol_count DESC, net_sol_flow DESC) for the period/min_kols/window. Every filter (min_score, min_avg_winrate, unique_strategies, MC band) and the coordination_score sort run inside this universe, so a filtered result is always a subset of the unfiltered ranking. `truncated_at_max`=true means more clusters exist below the cap.'
                    properties:
                      kind:
                        type: string
                        enum:
                        - top_by_kol_count
                      order:
                        type: string
                      max_size:
                        type: integer
                      size:
                        type: integer
                      truncated_at_max:
                        type: boolean
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
