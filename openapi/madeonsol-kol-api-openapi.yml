                              - day_trader
                              - swing_trader
                              - hodler
                              - mixed
                            scout_tier:
                              type: string
                              nullable: true
                              enum:
                              - S
                              - A
                              - B
                              - C
                            scout_score:
                              type: number
                              nullable: true
                              description: Alias for swarm_3plus_pct
                            n_first_touches_30d:
                              type: integer
                              nullable: true
                        followers_4h:
                          type: integer
                          description: Only present when include=followers_4h was requested
                  count:
                    type: integer
                  next_before:
                    type: string
                    format: date-time
                    nullable: true
                    description: Pass as ?before= to page further back
                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque keyset cursor for the next (older) page — pass as `cursor=`. PREFERRED over next_before, which is a strict timestamp bound that skips same-timestamp siblings of the boundary row.
                  has_more:
