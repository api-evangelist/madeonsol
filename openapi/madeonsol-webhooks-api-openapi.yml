openapi: 3.2.0
info:
  title: MadeOnSol Webhooks API
  version: 1.20.0
  description: Real-time Solana & Robinhood Chain trading intelligence — KOL wallet trades, deployer reputation, token buyer-quality scoring, wallet tracking, and copy-trade signals across both chains (Robinhood Chain paths under `/rhc/*`).
  contact:
    name: MadeOnSol
    url: https://madeonsol.com/contact
  license:
    name: Proprietary
    url: https://madeonsol.com/terms
servers:
- url: https://madeonsol.com/api/v1
  description: Production
security:
- BearerAuth: []
tags:
- name: Webhooks
  description: HMAC-signed webhook registrations for KOL, deployer, wallet-tracker, sniper, token momentum, RHC KOL and realtime developer activity (dev:activity, live since 2026-10-05) events. PRO+.
paths:
  /webhooks:
    get:
      tags:
      - Webhooks
      summary: List your webhooks
      description: List the webhooks you've registered — each with its delivery URL, subscribed events, filters, and enabled state (the signing secret is never returned). PRO/ULTRA only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/Webhook'
                      - type: object
                        properties:
                          delivery_summary:
                            type: object
                            properties:
                              total_24h:
                                type: integer
                              success_24h:
                                type: integer
                              failed_24h:
                                type: integer
                              success_rate:
                                type: number
                                description: Percent; 100 when total_24h is 0
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: getWebhooks
      x-operation-id-source: derived
    post:
      tags:
      - Webhooks
      summary: Create a webhook
      description: Register an HTTPS endpoint to receive events. Returns a signing secret once. PRO/ULTRA only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - events
              properties:
                url:
                  type: string
                  format: uri
                  description: HTTPS delivery URL
                events:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: 'Event types (9): kol:trade, kol:coordination, deployer:alert, deployer:bond, wallet_tracker:event, sniper:deploy (PRO+, curated to elite/good deployers for PRO), token:surge, token:revival (new-token surge tiers early/strong/breakout and ≥24h-dormant-token revivals), rhc:kol_trade (PRO+, Robinhood Chain KOL trades — EVM-native fields: 0x addresses, eth_amount, tx_hash). The RHC DEX firehose is WebSocket-only (channel rhc:dex_trades) and is not available as a webhook event.'
                filters:
                  type: object
                  description: Optional per-event filters
                  properties:
                    min_sol:
                      type: number
                    action:
                      type: string
                      enum:
                      - buy
                      - sell
                    kol_name:
                      type: string
                    deployer_tier:
                      type: array
                      items:
                        type: string
                    min_kols:
                      type: integer
      responses:
        '200':
          description: Created — includes one-time signing secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook:
                    allOf:
                    - $ref: '#/components/schemas/Webhook'
                    - type: object
                      properties:
                        secret:
                          type: string
                          description: HMAC-SHA256 signing secret — shown only in this response, never again
                  note:
                    type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '409':
          description: Webhook quota reached
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      x-madeonsol-feature-tiers:
      - tier: ULTRA
        feature: Custom filter conditions (filters.conditions)
      operationId: postWebhooks
      x-operation-id-source: derived
  /webhooks/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        example: 1234
      description: Numeric webhook ID
    get:
      tags:
      - Webhooks
      summary: Fetch one webhook
      description: Fetch one webhook you own, addressed by the numeric `id` path param (integer). Returns its URL, events, filters, and enabled state (never the signing secret). 404 if the id isn't yours.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook:
                    $ref: '#/components/schemas/Webhook'
                  recent_deliveries:
                    type: array
                    items:
                      type: object
                      properties:
                        event_type:
                          type: string
                        status_code:
                          type: integer
                          nullable: true
                        response_time_ms:
                          type: integer
                          nullable: true
                        delivered_at:
                          type: string
                          format: date-time
                        error:
                          type: string
                          nullable: true
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '404':
          description: Not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: getWebhooksById
      x-operation-id-source: derived
    patch:
      tags:
      - Webhooks
      summary: Update a webhook
      description: 'Patchable: url, events, filters (min_sol/action/kol_name/deployer_tier/min_kols), is_active (re-enable after auto-disable).'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook:
                    type: object
                    properties:
                      id:
                        type: integer
                      url:
                        type: string
                        format: uri
                      events:
                        type: array
                        items:
                          type: string
                      filters:
                        $ref: '#/components/schemas/WebhookFilters'
                      is_active:
                        type: boolean
                      updated_at:
                        type: string
                        format: date-time
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '404':
          description: Not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      x-madeonsol-feature-tiers:
      - tier: ULTRA
        feature: Custom filter conditions (filters.conditions)
      operationId: patchWebhooksById
      x-operation-id-source: derived
    delete:
      tags:
      - Webhooks
      summary: Delete a webhook
      description: Permanently delete a webhook you own, addressed by the numeric `id` path param (integer). Stops all future deliveries to it. 404 if the id isn't yours.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '404':
          description: Not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: deleteWebhooksById
      x-operation-id-source: derived
  /webhooks/test:
    post:
      tags:
      - Webhooks
      summary: Send a test delivery
      description: Fires a sample signed payload to one of your webhooks so you can validate your HMAC verifier. PRO/ULTRA only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - webhook_id
              properties:
                webhook_id:
                  type: integer
                  description: Numeric webhook id from /webhooks
      responses:
        '200':
          description: Test delivery sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status_code:
                    type: integer
                    description: HTTP status the target URL responded with — present when the request completed
                  response_time_ms:
                    type: integer
                  event:
                    type: string
                    description: The event type that was sampled (the requested `event`, else the webhook's first subscribed event) — present when the delivery completed
                  error:
                    type: string
                    description: Present when success is false and the request never completed (network/timeout error)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Data-Delay:
              $ref: '#/components/headers/XDataDelay'
            X-MadeOnSol-Quota-Warning:
              $ref: '#/components/headers/XMadeOnSolQuotaWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierForbidden'
        '404':
          description: Webhook not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Used:
              $ref: '#/components/headers/XRateLimitUsed'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthBackendUnavailable'
      x-madeonsol-tier: PRO
      x-badges:
      - name: PRO
        position: after
        color: '#1d4ed8'
      operationId: postWebhooksTest
      x-operation-id-source: derived
components:
  headers:
    XRateLimitReset:
      description: When the window resets, as a Unix epoch in SECONDS (next 00:00 UTC for the daily quota; about 60 s ahead for a per-minute bucket).
      schema:
        type: integer
      example: 1791158400
    XRateLimitRemaining:
      description: Calls left in that window. `0` on a quota 429.
      schema:
        type: integer
        minimum: 0
      example: 9412
    XDataDelay:
      description: 'Free-tier only: the feed in this body is delayed by this many seconds (same value as the body''s `delay_seconds`). Absent on real-time responses.'
      schema:
        type: integer
        minimum: 1
      example: 300
    XRateLimitLimit:
      description: 'Size of the rate-limit window this call was counted against: the daily quota for your tier on data endpoints, the per-minute bucket on `/stream/token` (10) and `/stream/sessions` (30), the hourly allowance for the public demo key. Sent once the key has been authenticated and rate-limited, so it is absent on authentication-stage errors.'
      schema:
        type: integer
        minimum: 0
      example: 10000
    XMadeOnSolQuotaWarning:
      description: 'Free-tier only, past about 70 % of the daily quota: a human-readable usage line with an upgrade link.'
      schema:
        type: string
      example: '150/200 used - upgrade for 50x higher limits: https://madeonsol.com/checkout?tier=PRO'
    XRequestId:
      description: Unique id of this response. On responses built after authentication it is also the `request_id` of the audit-log row for the call, so quote it in a support request. Present on every response of the keyed API.
      required: true
      schema:
        type: string
        format: uuid
      example: 3f6c1d2e-8a4b-4f7e-9c21-5b0d7e6a9f13
    XRateLimitUsed:
      description: Calls used in that window (`limit − remaining`).
      schema:
        type: integer
        minimum: 0
      example: 588
    RetryAfter:
      description: Seconds to wait before retrying (RFC 9110 delay-seconds, at least 1). Sent on every 429 (quota, concurrency, authentication-failure) and every 503; when the body carries `retry_after_seconds` it is the same value.
      required: true
      schema:
        type: integer
        minimum: 1
      example: 10
  schemas:
    DemoKeyNotAllowedError:
      type: object
      description: 403 for the public demo key (`msk_demo_…`) outside its three-endpoint allow-list. `endpoint_tier` is the endpoint's real minimum plan (null when unknown).
      required:
      - error
      - message
      - allowed_endpoints
      properties:
        error:
          type: string
          enum:
          - demo_key_endpoint_not_allowed
        message:
          type: string
        endpoint_tier:
          type: string
          nullable: true
          enum:
          - FREE
          - PRO
          - ULTRA
          - BUSINESS
          - ENTERPRISE
          - null
        allowed_endpoints:
          type: array
          items:
            type: string
        signup_url:
          type: string
          format: uri
        upgrade_url:
          type: string
          format: uri
          description: Only when the endpoint's tier can be bought at /checkout.
    ConcurrencyLimitError:
      type: object
      description: '429 from the heavy-query limiter: too many heavy requests in flight for this key (`concurrency`) or for the whole server (`capacity`). Clears as soon as in-flight requests finish.'
      required:
      - error
      - error_kind
      - retry_after_seconds
      properties:
        error:
          type: string
        error_kind:
          type: string
          enum:
          - concurrency
          - capacity
        retry_after_seconds:
          type: number
        max_concurrent:
          type: integer
        support:
          type: string
        _rid:
          type: string
    TierRequiredError:
      type: object
      description: 403 when the key's tier is below the endpoint's (or a parameter's) gate. `required_tier` matches the operation's `x-madeonsol-tier` or `x-madeonsol-feature-tiers`. ENTERPRISE gates return `contact` instead of `upgrade`.
      required:
      - error
      - message
      - your_tier
      - required_tier
      properties:
        error:
          type: string
          enum:
          - tier_required
        message:
          type: string
        feature:
          type: string
        your_tier:
          type: string
          enum:
          - BASIC
          - PRO
          - ULTRA
          - BUSINESS
          - ENTERPRISE
        required_tier:
          type: string
          enum:
          - PRO
          - ULTRA
          - BUSINESS
          - ENTERPRISE
        upgrade:
          type: object
          description: The plan that lifts this limit, with price and a checkout link.
          properties:
            tier:
              type: string
              enum:
              - PRO
              - ULTRA
              - BUSINESS
              - ENTERPRISE
            price_eur_per_month:
              type: number
            price_usdc_per_month:
              type: number
            daily_limit:
              type: integer
            burst_limit:
              type: integer
            pitch:
              type: string
            url:
              type: string
            upgrade_url:
              type: string
              format: uri
            reactivate:
              type: boolean
              description: Present (true) when the key's paid subscription has just lapsed and `tier` is the plan it held.
            prior_tier:
              type: string
              enum:
              - PRO
              - ULTRA
              - BUSINESS
        contact:
          type: object
          properties:
            url:
              type: string
            contact_url:
              type: string
            pitch:
              type: string
        support:
          type: string
        _rid:
          type: string
    ServiceUnavailableError:
      type: object
      description: '503: a temporary capacity or maintenance condition (e.g. a Postgres statement timeout during a partition move, or the API-key lookup itself being unavailable). Retry after `Retry-After` seconds.'
      required:
      - error
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable code where one exists, e.g. `auth_backend_unavailable`.
        error_kind:
          type: string
          description: e.g. `statement_timeout`, `auth_backend`
        retry_after_seconds:
          type: number
        retryable:
          type: boolean
        support:
          type: string
        _rid:
          type: string
    WebhookFilters:
      type: object
      description: 'Optional per-event delivery filters on a webhook. wallet_tracker:event (since 2026-09-25): only min_sol, action and conditions on its own fields apply, after the subscriber check; on a webhook subscribed to wallet_tracker:event alone any other named filter is a 400.'
      properties:
        min_sol:
          type: number
          description: Minimum sol_amount (kol:trade, wallet_tracker:event)
        action:
          type: string
          enum:
          - buy
          - sell
          description: kol:trade, wallet_tracker:event (transfers have no action and are excluded)
        kol_name:
          type: string
        deployer_tier:
          type: array
          items:
            type: string
        min_kols:
          type: integer
        kinds:
          type: array
          items:
            type: string
            enum:
            - surge
            - revival
          description: token:surge / token:revival only
        tiers:
          type: array
          items:
            type: string
            enum:
            - early
            - strong
            - breakout
          description: token:surge / token:revival only
        launchpads:
          type: array
          items:
            type: string
          description: token:surge / token:revival only
        exclude_flags:
          type: array
          items:
            type: string
          description: token:surge / token:revival only
        min_mc_usd:
          type: number
        max_mc_usd:
          type: number
        types:
          type: array
          items:
            type: string
            enum:
            - dev_sell
            - dev_buy
            - dev_token_transfer_out
            - dev_token_transfer_in
          description: 'dev:activity only: event types to deliver'
        token_mints:
          type: array
          items:
            type: string
          maxItems: 500
          description: 'dev:activity only: mints'
        deployers:
          type: array
          items:
            type: string
          maxItems: 500
          description: 'dev:activity only: matches deployer_wallet or actor_wallet'
        conditions:
          type: array
          maxItems: 10
          description: ULTRA+ (2026-09-08). Custom { field, op, value } triples ANDed together and evaluated against the raw event payload, on top of the named filters. `field` must be a documented payload field of one of the webhook's subscribed event types (one level of dot-path allowed, e.g. `triggering_trade.sol_amount`); anything else is a 400. Number fields take eq/neq/gt/gte/lt/lte/in, strings eq/neq/in/contains, booleans eq/neq. On PRO the request is a 403 tier_required.
          items:
            type: object
            required:
            - field
            - op
            - value
            properties:
              field:
                type: string
                example: sol_amount
              op:
                type: string
                enum:
                - eq
                - neq
                - gt
                - gte
                - lt
                - lte
                - in
                - contains
              value:
                description: number | string | boolean, or a non-empty array (≤20) for `in`.
                anyOf:
                - type: number
                - type: string
                - type: boolean
                - type: array
                  items:
                    anyOf:
                    - type: string
                    - type: number
    RateLimitError:
      type: object
      description: '429 when a quota is exhausted: the daily quota, the per-minute burst, or a free-tier network/key-rotation cap. `datasets` is added on `daily` only.'
      required:
      - error
      - error_kind
      - message
      - tier
      - limit
      - resets_at
      properties:
        error:
          type: string
          enum:
          - rate_limit_exceeded
        error_kind:
          type: string
          enum:
          - daily
          - burst
          - ip_cap
          - ip_rotation
        message:
          type: string
        tier:
          type: string
          enum:
          - BASIC
          - PRO
          - ULTRA
          - BUSINESS
          - ENTERPRISE
        limit:
          type: integer
        resets_at:
          type: string
          format: date-time
        upgrade:
          type: object
          description: The plan that lifts this limit, with price and a checkout link.
          properties:
            tier:
              type: string
              enum:
              - PRO
              - ULTRA
              - BUSINESS
              - ENTERPRISE
            price_eur_per_month:
              type: number
            price_usdc_per_month:
              type: number
            daily_limit:
              type: integer
            burst_limit:
              type: integer
            pitch:
              type: string
            url:
              type: string
            upgrade_url:
              type: string
              format: uri
            reactivate:
              type: boolean
              description: Present (true) when the key's paid subscription has just lapsed and `tier` is the plan it held.
            prior_tier:
              type: string
              enum:
              - PRO
              - ULTRA
              - BUSINESS
        datasets:
          type: object
          properties:
            pitch:
              type: string
            url:
              type: string
              format: uri
    Webhook:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
        events:
          type: array
          description: 'dev:activity (live since 2026-10-05): developer dev_sell / dev_buy / dev_token_transfer_out / dev_token_transfer_in, projected per tier at delivery (PRO: the developer''s own events, raw facts, no identity keys; ULTRA+: identity fields and linked-wallet events from proven links only). Dedupe on data.id. Transfers are partial (most recently active developer wallets only).'
          items:
            type: string
            enum:
            - kol:trade
            - kol:coordination
            - deployer:alert
            - deployer:bond
            - wallet_tracker:event
            - sniper:deploy
            - rhc:kol_trade
            - token:surge
            - token:revival
            - dev:activity
        filters:
          $ref: '#/components/schemas/WebhookFilters'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_delivered_at:
          type: string
          format: date-time
          nullable: true
        consecutive_failures:
          type: integer
    Error:
      type: object
      description: Generic error envelope. `error` is always present (SDKs match on it). Errors returned after authentication also carry `_rid` and, on paid tiers, `support`; authentication-stage errors (missing/invalid key, origin) carry neither.
      properties:
        error:
          type: string
          description: Error message or machine code (e.g. `tier_required`, `rate_limit_exceeded`). Never changed once shipped.
        message:
          type: string
          description: Human-readable explanation, when `error` is a machine code.
        code:
          type: string
          description: Machine-readable sub-code on some errors (e.g. `invalid_query`, `invalid_wallet`, `origin_not_allowed`).
        error_kind:
          type: string
          description: Machine-readable category on some errors (e.g. `statement_timeout`, `concurrency`, `daily`).
        detail:
          type: string
          description: Extra human-readable context.
        hint:
          type: string
        retry_after_seconds:
          type: number
          description: When present on a 429/503, the same value is sent as the `Retry-After` header.
        signup_url:
          type: string
          format: uri
          description: 'On the missing-key / bad-format 401: where to get a free key.'
        docs_url:
          type: string
          format: uri
        support:
          type: string
          description: 'Paid tiers, errors after authentication: priority support contact.'
        _rid:
          type: string
          description: Request ID — include when reporting issues
      required:
      - error
  responses:
    TierForbidden:
      description: 'Forbidden. One of: the key''s tier is below this endpoint''s or parameter''s gate (`tier_required` with an `upgrade` block); the public demo key used outside its allow-list (`demo_key_endpoint_not_allowed`); an invalid or revoked key; an origin-restricted key called from a disallowed origin (`code` `origin_not_allowed` / `origin_required`). `X-RateLimit-*` headers are present only on `tier_required`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Used:
          $ref: '#/components/headers/XRateLimitUsed'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/TierRequiredError'
            - $ref: '#/components/schemas/DemoKeyNotAllowedError'
            - $ref: '#/components/schemas/Error'
          examples:
            tier_required:
              summary: Tier below the gate
              value:
                error: tier_required
                message: This endpoint requires ULTRA tier — you're on PRO.
                feature: This endpoint
                your_tier: PRO
                required_tier: ULTRA
                upgrade:
                  tier: ULTRA
                  price_eur_per_month: 131
                  price_usdc_per_month: 149
                  daily_limit: 100000
                  burst_limit: 600
                  pitch: …
                  url: https://madeonsol.com/pricing
                  upgrade_url: https://madeonsol.com/checkout?tier=ULTRA
                support: 'Priority support: info@madeonsol.com'
                _rid: eyJ1IjoiZXhhbXBsZSIsInQiOjE3OTEwMDAwMDAwMDAsImgiOiIwMDAwMDAwMCJ9
            demo_key:
              summary: Demo key outside its allow-list
              value:
                error: demo_key_endpoint_not_allowed
                message: The public demo key works on /kol/feed, /deployer-hunter/alerts, and /alpha/leaderboard only. This endpoint requires the PRO plan or higher; a free API key will not unlock it. See https://madeonsol.com/pricing.
                endpoint_tier: PRO
                allowed_endpoints:
                - /api/v1/kol/feed
                - /api/v1/deployer-hunter/alerts
                - /api/v1/alpha/leaderboard
                signup_url: https://madeonsol.com/developer
                upgrade_url: https://madeonsol.com/checkout?tier=PRO
            revoked_key:
              summary: Invalid or revoked key
              value:
                error: Invalid or revoked API key
    InternalError:
      description: Unexpected server error from the route (`Internal server error`, with `_rid`). Safe to retry with backoff. A failed API-key lookup is a 503 `auth_backend_unavailable`, never a 500.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Used:
          $ref: '#/components/headers/XRateLimitUsed'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            route:
              summary: Route error
              value:
                error: Internal server error
                _rid: eyJ1IjoiZXhhbXBsZSIsInQiOjE3OTEwMDAwMDAwMDAsImgiOiIwMDAwMDAwMCJ9
    RateLimited:
      description: Too many requests. Every 429 carries `Retry-After`. A quota 429 (`rate_limit_exceeded`, with `X-RateLimit-*`), a heavy-query concurrency 429 (`error_kind` `concurrency`/`capacity`), or the per-IP authentication-failure block (30 failed auths/min; plain `error` + `retry_after_seconds`, no `X-RateLimit-*`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Used:
          $ref: '#/components/headers/XRateLimitUsed'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/RateLimitError'
            - $ref: '#/components/schemas/ConcurrencyLimitError'
            - $ref: '#/components/schemas/Error'
          examples:
            daily:
              summary: Daily quota exhausted
              value:
                error: rate_limit_exceeded
                error_kind: daily
                message: Daily rate limit exceeded — 200/day for BASIC tier. Resets at midnight UTC.
                tier: BASIC
                limit: 200
                resets_at: '2026-10-05T00:00:00.000Z'
                upgrade:
                  tier: PRO
                  price_eur_per_month: 43
                  price_usdc_per_month: 49
                  daily_limit: 10000
                  burst_limit: 300
                  pitch: …
                  url: https://madeonsol.com/pricing
                  upgrade_url: https://madeonsol.com/checkout?tier=PRO
                datasets:
                  pitch: …
                  url: https://madeonsol.com/datasets
            concurrency:
              summary: Too many heavy queries in flight
              value:
                error: Too many concurrent heavy queries. Up to 8 of these endpoints may be in flight at once per key — retry in a moment, or lower your request concurrency.
                error_kind: concurrency
                retry_after_seconds: 2
                max_concurrent: 8
                _rid: eyJ1IjoiZXhhbXBsZSIsInQiOjE3OTEwMDAwMDAwMDAsImgiOiIwMDAwMDAwMCJ9
            auth_failures:
              summary: Per-IP authentication-failure block
              value:
                error: Too many authentication failures from this IP. Retry in 60s.
                retry_after_seconds: 42
    AuthBackendUnavailable:
      description: 'The API-key or subscription lookup could not be answered (authentication stage). Retryable and not your fault: it is never counted as a failed authentication. Honour `Retry-After`; no `X-RateLimit-*`, no `_rid`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceUnavailableError'
          examples:
            auth_backend:
              summary: API-key lookup unavailable
              value:
                error: Authentication temporarily unavailable — please retry.
                code: auth_backend_unavailable
                error_kind: auth_backend
                retryable: true
                retry_after_seconds: 5
    Unauthorized:
      description: 'Missing or invalid API key, or an expired free-tier key. Authentication-stage error: no `X-RateLimit-*` headers, no `_rid`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing_key:
              summary: No Bearer key
              value:
                error: 'Missing authentication — use API key (Authorization: Bearer msk_...)'
                hint: Get a free API key — 200 calls/day, no payment
                signup_url: https://madeonsol.com/developer
                docs_url: https://madeonsol.com/api-docs
            bad_format:
              summary: Malformed key
              value:
                error: Invalid API key format
                hint: Get a free API key — 200 calls/day, no payment
                signup_url: https://madeonsol.com/developer
                docs_url: https://madeonsol.com/api-docs
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: msk_...
      description: Get a free API key at https://madeonsol.com/developer
