apis:
- name: MadeOnSol API
  description: >-
    Keyed on-chain intelligence API for Solana and Robinhood Chain (Bearer msk_ API keys, free and paid tiers):
    KOL trades and leaderboards, wallet intelligence and funding, token and deployer analytics, risk signals,
    DEX trade tape and candles, plus WebSocket streams and signed webhooks. A keyless x402 pay-per-call subset is
    listed separately below.
