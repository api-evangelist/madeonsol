x-correction-request:
  requested: '2026-10-05'
  source:
  - https://github.com/api-evangelist/madeonsol/pull/1
  request: Model the full keyed API (https://madeonsol.com/api/v1/openapi.json, 197 operations, 1.20.0) as the primary
    contract and the keyless x402 pay-per-call surface (https://madeonsol.com/openapi.json) as separate subsets; add
    the APIs.json, RFC 9727 API catalog, AsyncAPI, Postman, Agent Skills, MCP package discovery, agents.json and x402
    discovery documents; refresh packages; re-score.
  ledger:
  - madeonsol-ee599794
  applied: '2026-10-05'
  applied_note: Applied by hand; every URL verified 200 on 2026-10-05 with a 404 control, and robots.txt now allows
    crawlers. The provider's own apis.json declares the keyed API primary and the x402 surfaces as subsets, so the
    profile follows it. Keyed OpenAPI 3.1 (1.20.0, 166 paths / 198 operations - the live document carries one more
    than the PR's 197) saved verbatim to openapi/_original/madeonsol-api-openapi.json and split into 17 per-tag APIs;
    the Robinhood Chain keyed view is a subset of it and is recorded as a pointer, not a second contract. The x402
    OpenAPI (35 operations) was refreshed verbatim in openapi/_original/madeonsol.json and split separately into the
    x402 Solana (25) and x402 Robinhood Chain (10) APIs, tags prefixed x402 so they do not merge with the keyed
    Robinhood Chain tag. Discovery documents added to common; packages refreshed from npm, crates.io and PyPI
    (10 official packages, including both stdio MCP servers). No hosted MCP endpoint is listed, per the provider.
    The PR was not merged.
