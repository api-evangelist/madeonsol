- breaking: false
  highlights:
  - Copy-trade signals fire only on realtime trades, and KOL trades missed during an outage are recovered
  - 'A copy-trade signal now fires only while the source trade is realtime: at most 10 seconds old on Solana and 5 seconds on Robinhood Chain,
    measured by chain time.'
  - 'The live kol:trade event carries a new nullable ISO field, chain_time_estimate : the block time of the nearest block at or before the trade''s
    slot.'
  - Recovered KOL trades are now fetched again from the provider's replay and added to the KOL trade history.
  date: '2026-09-26'
- breaking: false
  highlights:
  - Business copy-trade rules take 250 source wallets, as sold.
  - Wallet-tracker webhooks now apply the min_sol, action and conditions filters; before, they were accepted but not applied.
  - 'Rule webhooks: setting webhook_url with a PATCH now creates a signing secret when the rule had none.'
  - None of these releases is breaking.
  date: '2026-09-25'
